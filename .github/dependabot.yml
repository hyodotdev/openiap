version: 2
updates:
  # packages/kit — receipt-validation SaaS app
  - package-ecosystem: "npm"
    directory: "/packages/kit"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "openiap-kit"
      - "📦 update packages"
    groups:
      kit-convex:
        patterns:
          - "convex"
          - "@convex-dev/*"
      kit-react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      kit-dev-dependencies:
        dependency-type: "development"
    ignore:
      # Major bumps often need code migration work; review manually
      # rather than letting Dependabot flood the queue.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by kit's deploy workflow
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "💨 ci"
      - "📦 update packages"
    groups:
      # Several actions live at different paths in ONE repository and refuse to
      # run at mixed versions: CodeQL fails with "Loaded a configuration file
      # for version X, but running version Y" when init and analyze disagree.
      # Ungrouped, Dependabot opens one PR per path, and each is broken on its
      # own. scripts/audit-security.mjs enforces the same invariant on the
      # workflows themselves.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      gradle-actions:
        patterns:
          - "gradle/actions*"

  # packages/kit Dockerfile base image
  - package-ecosystem: "docker"
    directory: "/packages/kit"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "openiap-kit"
      - "👷‍♀️ build"
      - "📦 update packages"

  # React Native example CocoaPods toolchain
  - package-ecosystem: "bundler"
    directory: "/libraries/react-native-iap/example"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "react-native-iap"
      - "📦 update packages"
