version: 2
# Every version update lands in one monthly PR, so main needs one rebase and CI
# pass a month; it also keeps coupled actions such as CodeQL's init and analyze
# at one version. A week of cooldown lets a bad release be yanked first.
# Security updates skip the schedule and cooldown. Entries repeat the group
# label because Dependabot may apply only theirs.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "📦 update packages"

updates:
  # packages/kit — receipt-validation SaaS app
  - package-ecosystem: "npm"
    directory: "/packages/kit"
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
    labels:
      - "openiap-kit"
      - "📦 update packages"
    ignore:
      # Major bumps often need code migration work; review manually.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions in workflows and composite actions
  - package-ecosystem: "github-actions"
    # "/" reads only .github/workflows; composite actions need their own path.
    directories:
      - "/"
      - "/.github/actions/*"
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
    labels:
      - "💨 ci"
      - "📦 update packages"

  # packages/kit Dockerfile base image
  - package-ecosystem: "docker"
    directory: "/packages/kit"
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
    labels:
      - "openiap-kit"
      - "📦 update packages"

  # Apple release CocoaPods toolchain. CocoaPods itself is pinned in the
  # Gemfile and moves only with a release lint; its dependencies still update.
  - package-ecosystem: "bundler"
    directory: "/packages/apple"
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
    labels:
      - "📱 iOS"
      - "📦 update packages"
    ignore:
      - dependency-name: "cocoapods"

  # React Native example CocoaPods toolchain
  - package-ecosystem: "bundler"
    directory: "/libraries/react-native-iap/example"
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
    labels:
      - "react-native-iap"
      - "📦 update packages"
