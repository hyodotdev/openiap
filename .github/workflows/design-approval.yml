name: Design Approval

# pull_request_target runs this file and the checker from main, so a PR cannot
# delete or rewrite the approval check. The PR head is read as data only; no
# PR code, dependency, or script runs here.
on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: design-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Design Approval
    runs-on: ubuntu-latest
    # A hung install or type-check fails here instead of leaving the check
    # pending for six hours.
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # github.sha is main's tip, so the latest checker judges every PR.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install the base checker's dependencies
        run: bun install --frozen-lockfile --filter openiap-monorepo --ignore-scripts

      # Type-checking the SDK declarations needs their dependency types. Install
      # them from main's lockfiles without scripts, only when the PR touches an
      # SDK; the checker fails if a type stays unresolved.
      - name: Install SDK type dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          if git diff --quiet "$base" "$HEAD_SHA" -- libraries/react-native-iap libraries/expo-iap; then
            exit 0
          fi
          (cd libraries/react-native-iap && corepack enable && yarn install --immutable --mode=skip-build)
          (cd libraries/expo-iap && bun install --frozen-lockfile --ignore-scripts)

      - name: Verify prior design approval for public contract changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/audit-design-approval.mjs

  publish:
    name: Publish Design Approval
    needs: verify
    # A PR can name its own job "Verify Design Approval", but it cannot report
    # a check as this App. The required check pins the App as its source. A
    # run cancelled for a newer push reports nothing; the newer run reports.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Its branch policy admits main only. pull_request_target runs on main; a
    # PR's own workflows run on refs/pull and never receive the key.
    environment: design-approval
    permissions: {}
    steps:
      # Without the App no required check exists, so fail loudly instead of
      # leaving contract changes unchecked.
      - name: Require the check App
        env:
          CLIENT_ID: ${{ vars.DESIGN_APPROVAL_APP_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::Set up the design approval App, its environment, and the required check; see Public Contract Design Gate in knowledge/internal/02-architecture.md."
            exit 1
          fi

      - name: Create check token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DESIGN_APPROVAL_APP_CLIENT_ID }}
          private-key: ${{ secrets.DESIGN_APPROVAL_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Report the verdict on the PR head
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.verify.result }}
        run: |
          conclusion=failure
          if [ "$RESULT" = success ]; then conclusion=success; fi
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="OpenIAP Design Approval" \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=Design approval: $conclusion" \
            -f "output[summary]=The base branch's Verify Design Approval job ended with $RESULT."
