name: CI - godot-iap

on:
  pull_request:
    branches: [main, next]
    paths:
      - ".github/workflows/ci-godot-iap.yml"
      - "scripts/ci/retry-gradle.sh"
      - "scripts/fetch-godot-lib.sh"
      - "libraries/godot-iap/**"
      - "packages/gql/codegen/plugins/gdscript.ts"
      - "packages/gql/src/generated/types.gd"
      - "openiap-versions.json"
      - "!**/*.md"
  push:
    branches: [main, next]
    paths:
      - ".github/workflows/ci-godot-iap.yml"
      - "scripts/ci/retry-gradle.sh"
      - "scripts/fetch-godot-lib.sh"
      - "libraries/godot-iap/**"
      - "packages/gql/codegen/plugins/gdscript.ts"
      - "packages/gql/src/generated/types.gd"
      - "openiap-versions.json"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libraries/godot-iap

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2.4.2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Verify plugin files exist
        run: |
          test -f addons/godot-iap/plugin.cfg
          test -f addons/godot-iap/types.gd
          test -f addons/godot-iap/godot_iap.gd
          echo "All required plugin files exist"

      # The same [configuration] block is written in three places: this
      # tracked file, the Makefile that regenerates it, and the release
      # workflow that builds the zip. They drifted once (#366), so pin them.
      - name: Verify GDExtension platform gating
        run: |
          EXT=addons/godot-iap/bin/godot_iap.gdextension
          RELEASE=$GITHUB_WORKSPACE/.github/workflows/release-godot.yml
          grep -qx 'include_tags = \["ios", "macos"\]' "$EXT"
          grep -q "printf '%s\\\\n' 'include_tags = \[\"ios\", \"macos\"\]'" Makefile
          grep -qF 'include_tags = ["ios", "macos"]' "$RELEASE"
          grep -qF 'include_tags = ["ios"]' "$RELEASE"
          if git -C "$GITHUB_WORKSPACE" grep -nE 'supported_platforms[[:space:]]*=' \
            -- . ':!libraries/godot-iap/SwiftGodot'; then
            echo "supported_platforms is not a Godot .gdextension key; use include_tags"
            exit 1
          fi
          echo "GDExtension platform gating is consistent"

      - name: Verify Android plugin files exist
        run: |
          test -f android/build.gradle.kts
          test -f android/src/main/java/dev/hyo/godotiap/GodotIap.kt
          echo "All required Android plugin files exist"

      - name: Build and test Android plugin against minimum Godot
        run: |
          mkdir -p android/libs
          bash "$GITHUB_WORKSPACE/scripts/fetch-godot-lib.sh" \
            4.3-stable android/libs/godot-lib.aar
          cd android
          chmod +x gradlew
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" \
            ./gradlew --no-daemon clean assembleDebug testDebugUnitTest

      - name: Build and test Android plugin against latest Godot
        run: |
          bash "$GITHUB_WORKSPACE/scripts/fetch-godot-lib.sh" \
            4.7.1-stable android/libs/godot-lib.aar
          cd android
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" \
            ./gradlew --no-daemon clean assembleDebug testDebugUnitTest

      - name: Test generated types
        run: godot --headless --path Example --script res://tests/test_types_only.gd

      - name: Test API surface parity
        run: godot --headless --path Example --script res://tests/test_api_surface.gd

      - name: Test native envelope parsing
        run: godot --headless --path Example --script res://tests/test_envelope_parsing.gd

      - name: Test wrapper mapping
        run: godot --headless --path Example --script res://tests/test_godot_iap.gd

  swift-test:
    name: Swift Test
    # SwiftGodot v0.79.0 declares a Swift 6.3 package manifest. Keep this
    # source-build lane on Xcode 26.5 or newer so Swift can parse it.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tracked iOS framework toolchain
        working-directory: libraries/godot-iap
        run: bash scripts/verify-ios-toolchain.sh

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Checkout SwiftGodot
        working-directory: libraries/godot-iap
        run: make setup-swiftgodot

      - name: Test iOS GDExtension bridge
        working-directory: libraries/godot-iap/ios-gdextension
        run: swift test
