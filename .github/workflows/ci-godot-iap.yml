name: CI - godot-iap

on:
  pull_request:
    branches: [main, next]
    paths:
      - ".github/workflows/ci-godot-iap.yml"
      - "scripts/ci/retry-gradle.sh"
      - "scripts/fetch-godot-lib.sh"
      - "libraries/godot-iap/**"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "packages/google/compatibility/store-resolver/fake-adb"
      - "specs/client/codegen/plugins/gdscript.ts"
      - "specs/client/src/generated/types.gd"
      - "openiap-versions.json"
      - "!**/*.md"
  push:
    branches: [main, next]
    paths:
      - ".github/workflows/ci-godot-iap.yml"
      - "scripts/ci/retry-gradle.sh"
      - "scripts/fetch-godot-lib.sh"
      - "libraries/godot-iap/**"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "packages/google/compatibility/store-resolver/fake-adb"
      - "specs/client/codegen/plugins/gdscript.ts"
      - "specs/client/src/generated/types.gd"
      - "openiap-versions.json"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libraries/godot-iap

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: true

      - name: Verify plugin files exist
        run: |
          test -f addons/godot-iap/plugin.cfg
          test -f addons/godot-iap/types.gd
          test -f addons/godot-iap/godot_iap.gd
          echo "All required plugin files exist"

      # The same [configuration] block is written in three places: this
      # tracked file, the Makefile that regenerates it, and the release
      # workflow that builds the zip. They drifted once (#366), so pin them.
      - name: Verify GDExtension platform gating
        run: |
          EXT=addons/godot-iap/bin/godot_iap.gdextension
          RELEASE=$GITHUB_WORKSPACE/.github/workflows/release-godot.yml
          grep -qx 'include_tags = \["ios", "macos"\]' "$EXT"
          grep -q "printf '%s\\\\n' 'include_tags = \[\"ios\", \"macos\"\]'" Makefile
          grep -qF 'include_tags = ["ios", "macos"]' "$RELEASE"
          grep -qF 'include_tags = ["ios"]' "$RELEASE"
          if git -C "$GITHUB_WORKSPACE" grep -nE 'supported_platforms[[:space:]]*=' \
            -- . ':!libraries/godot-iap/SwiftGodot'; then
            echo "supported_platforms is not a Godot .gdextension key; use include_tags"
            exit 1
          fi
          echo "GDExtension platform gating is consistent"

      - name: Verify Android plugin files exist
        run: |
          test -f android/build.gradle.kts
          test -f android/src/main/java/dev/hyo/godotiap/GodotIap.kt
          echo "All required Android plugin files exist"

      - name: Build and test Android plugin against minimum Godot
        run: |
          mkdir -p android/libs
          bash "$GITHUB_WORKSPACE/scripts/fetch-godot-lib.sh" \
            4.3-stable android/libs/godot-lib.aar
          cd android
          chmod +x gradlew
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" \
            ./gradlew --no-daemon clean assembleDebug testDebugUnitTest

      - name: Build and test Android plugin against latest Godot
        run: |
          bash "$GITHUB_WORKSPACE/scripts/fetch-godot-lib.sh" \
            4.7.1-stable android/libs/godot-lib.aar
          cd android
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" \
            ./gradlew --no-daemon clean assembleDebug testDebugUnitTest

      # Quest and Fire exports swap in that store's openiap-google, so the one
      # AAR must compile against each store's API, not only Play's.
      - name: Compile Android plugin against Horizon and Amazon
        run: |
          cd android
          for store in horizon amazon; do
            "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" \
              ./gradlew --no-daemon compileDebugKotlin -PopeniapCompileStore="$store"
          done

      # Godot exits 0 on a script parse error; the runner turns that into a failure.
      - name: Test the suite runner
        run: node --test scripts/run-godot-suite.test.mjs

      - name: Test generated types
        run: bash scripts/run-godot-suite.sh test_types_only

      - name: Test API surface parity
        run: bash scripts/run-godot-suite.sh test_api_surface

      - name: Test native envelope parsing
        run: bash scripts/run-godot-suite.sh test_envelope_parsing

      - name: Test wrapper mapping
        run: bash scripts/run-godot-suite.sh test_godot_iap

      - name: Test export store mapping
        run: bash scripts/run-godot-suite.sh test_android_store test_android_export

  verify-minimum-godot:
    name: Verify on Godot 4.3
    # The addon supports Godot 4.3+; Verify runs the latest release.
    # test_godot_iap.gd captures logs through Logger, which needs Godot 4.5.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Test generated types, API surface, envelopes, and export store mapping
        run: >
          bash scripts/run-godot-suite.sh
          test_types_only test_api_surface test_envelope_parsing test_android_store test_android_export

  apple-changes:
    name: Detect Apple framework sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            apple:
              - '.github/workflows/ci-godot-iap.yml'
              - 'libraries/godot-iap/ios-gdextension/**'
              - 'packages/apple/Sources/**'
              - 'packages/apple/Package.swift'
              - 'libraries/godot-iap/Makefile'
              - 'libraries/godot-iap/scripts/install_apple_framework.sh'
              - 'libraries/godot-iap/scripts/verify-ios-toolchain.sh'

  apple-frameworks:
    name: Build Apple frameworks (Xcode 26.6)
    # App Store submissions need the iOS 26.5 SDK, and the release ZIP ships the
    # committed frameworks. Build them with that toolchain whenever their
    # sources change, and upload them to commit.
    needs: apple-changes
    if: needs.apple-changes.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Build iOS and macOS frameworks
        run: make ios macos

      - name: Verify the App Store toolchain
        run: bash scripts/verify-ios-toolchain.sh

      - name: Upload frameworks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot-iap-apple-frameworks
          path: |
            libraries/godot-iap/addons/godot-iap/bin/ios
            libraries/godot-iap/addons/godot-iap/bin/macos
            libraries/godot-iap/addons/godot-iap/bin/godot_iap.gdextension
          if-no-files-found: error
          retention-days: 14

  swift-test:
    name: Swift Test
    # SwiftGodot v0.79.0 declares a Swift 6.3 package manifest. Keep this
    # source-build lane on Xcode 26.5 or newer so Swift can parse it.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tracked iOS framework toolchain
        working-directory: libraries/godot-iap
        run: bash scripts/verify-ios-toolchain.sh

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Checkout SwiftGodot
        working-directory: libraries/godot-iap
        run: make setup-swiftgodot

      - name: Test iOS GDExtension bridge
        working-directory: libraries/godot-iap/ios-gdextension
        run: swift test
