name: CI - godot-iap

on:
  pull_request:
    branches: [main, next]
    paths:
      - ".github/workflows/ci-godot-iap.yml"
      - "libraries/godot-iap/**"
      - "packages/gql/codegen/plugins/gdscript.ts"
      - "packages/gql/src/generated/types.gd"
  push:
    branches: [main, next]
    paths:
      - ".github/workflows/ci-godot-iap.yml"
      - "libraries/godot-iap/**"
      - "packages/gql/codegen/plugins/gdscript.ts"
      - "packages/gql/src/generated/types.gd"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libraries/godot-iap

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.6.3
          use-dotnet: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Verify plugin files exist
        run: |
          test -f addons/godot-iap/plugin.cfg
          test -f addons/godot-iap/types.gd
          test -f addons/godot-iap/godot_iap.gd
          echo "All required plugin files exist"

      - name: Verify Android plugin files exist
        run: |
          test -f android/build.gradle.kts
          test -f android/src/main/java/dev/hyo/godotiap/GodotIap.kt
          echo "All required Android plugin files exist"

      - name: Build and test Android plugin
        run: |
          mkdir -p android/libs
          curl -L -o android/libs/godot-lib.aar \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/godot-lib.4.3.stable.template_release.aar"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Test generated types
        run: godot --headless --path Example --script res://tests/test_types_only.gd

      - name: Test API surface parity
        run: godot --headless --path Example --script res://tests/test_api_surface.gd

      - name: Test native envelope parsing
        run: godot --headless --path Example --script res://tests/test_envelope_parsing.gd

      - name: Test wrapper mapping
        run: godot --headless --path Example --script res://tests/test_godot_iap.gd

  swift-test:
    name: Swift Test
    # SwiftGodot v0.74.0 uses Swift 6.2 standard-library APIs. Keep this
    # source-build lane on the matching Xcode 26 runner.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Checkout SwiftGodot
        working-directory: libraries/godot-iap
        run: make setup-swiftgodot

      - name: Test iOS GDExtension bridge
        working-directory: libraries/godot-iap/ios-gdextension
        run: swift test
