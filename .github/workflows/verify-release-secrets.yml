# One-off check after moving the release secrets into the `release`
# environment: reports each secret's shape by name, never its value.
name: "Security: Verify release secrets"

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check secret shapes
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          DEPENDENCY_UPDATE_PAT: ${{ secrets.DEPENDENCY_UPDATE_PAT }}
          GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -uo pipefail
          failed=0
          report() { echo "$1  $2${3:+  ($3)}"; [ "$1" = FAIL ] && failed=1; return 0; }
          nonempty() { if [ -n "${!1}" ]; then report PASS "$1"; else report FAIL "$1" "empty"; fi; }
          shape() {
            if [ -z "${!1}" ]; then report FAIL "$1" "empty"
            elif [[ "${!1}" =~ $2 ]]; then report PASS "$1"
            else report WARN "$1" "unexpected format"; fi
          }
          decodes_to() {
            local text
            if ! text="$(printf '%s' "${!1}" | base64 --decode 2>/dev/null | tr -d '\0')"; then report FAIL "$1" "not base64"
            elif [[ "$text" == *"$2"* ]]; then report PASS "$1"
            else report WARN "$1" "decodes, unexpected content"; fi
          }

          if [ "$(printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode 2>/dev/null | wc -c)" -gt 500 ]; then
            report PASS APPLE_DEVELOPER_ID_CERTIFICATE_BASE64
          else
            report FAIL APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 "not a base64 certificate"
          fi
          nonempty APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD
          shape APP_STORE_CONNECT_API_ISSUER_ID '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          decodes_to APP_STORE_CONNECT_API_KEY_BASE64 "PRIVATE KEY"
          shape APP_STORE_CONNECT_API_KEY_ID '^[A-Z0-9]{10}$'
          nonempty COCOAPODS_TRUNK_TOKEN
          shape DEPENDENCY_UPDATE_PAT '^(ghp_|github_pat_)'
          if [[ "$GPG_KEY_CONTENTS" == *"PRIVATE KEY BLOCK"* ]]; then report PASS GPG_KEY_CONTENTS
          else decodes_to GPG_KEY_CONTENTS "PRIVATE KEY BLOCK"; fi
          nonempty MAVEN_CENTRAL_USERNAME
          nonempty MAVEN_CENTRAL_PASSWORD
          nonempty NUGET_API_KEY
          shape SIGNING_KEY_ID '^[0-9A-Fa-f]{8,40}$'
          nonempty SIGNING_PASSWORD

          # Two names holding the same value means one was entered under the wrong name.
          duplicates="$(for name in APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD \
            APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_API_KEY_ID \
            COCOAPODS_TRUNK_TOKEN DEPENDENCY_UPDATE_PAT GPG_KEY_CONTENTS MAVEN_CENTRAL_USERNAME \
            MAVEN_CENTRAL_PASSWORD NUGET_API_KEY SIGNING_KEY_ID SIGNING_PASSWORD; do
            [ -n "${!name}" ] && printf '%s %s\n' "$(printf '%s' "${!name}" | sha256sum | cut -c1-64)" "$name"
          done | sort | awk '{ if ($1 == prev) print prevname " = " $2; prev = $1; prevname = $2 }')"
          if [ -n "$duplicates" ]; then echo "FAIL  same value under two names: $duplicates"; failed=1; else echo "PASS  no duplicated values"; fi
          exit "$failed"
