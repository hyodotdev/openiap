name: CI - react-native-iap

on:
  pull_request:
    branches: [main, next]
    paths:
      - "libraries/react-native-iap/**"
      - "libraries/expo-iap/android/**"
      - "libraries/expo-iap/package.json"
      - "libraries/expo-iap/bun.lock"
      - "scripts/test-android-gradle-compatibility.mjs"
      - "specs/client/src/generated/types.ts"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "openiap-versions.json"
      - "libraries-versions.jsonc"
      - "codecov.yml"
      - "scripts/test-ios-log-sanitizers.sh"
      - ".github/workflows/ci-react-native-iap.yml"
      - "!**/*.md"
  push:
    branches: [main, next]
    paths:
      - "libraries/react-native-iap/**"
      - "libraries/expo-iap/android/**"
      - "libraries/expo-iap/package.json"
      - "libraries/expo-iap/bun.lock"
      - "scripts/test-android-gradle-compatibility.mjs"
      - "specs/client/src/generated/types.ts"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "openiap-versions.json"
      - "libraries-versions.jsonc"
      - "codecov.yml"
      - "scripts/test-ios-log-sanitizers.sh"
      - ".github/workflows/ci-react-native-iap.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libraries/react-native-iap

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable && corepack prepare yarn@3.6.1 --activate

      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: libraries/react-native-iap/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('libraries/react-native-iap/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn lint:tsc

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable && corepack prepare yarn@3.6.1 --activate

      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: libraries/react-native-iap/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('libraries/react-native-iap/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test:ci

      - name: Enforce line coverage
        run: node ../../scripts/assert-lcov-coverage.mjs coverage/lcov.info 90

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          disable_search: true
          files: coverage/lcov.info
          flags: react-native-iap
          name: react-native-iap
          network_prefix: libraries/react-native-iap/
          working-directory: libraries/react-native-iap

      - name: Consumer install smoke test
        run: yarn verify:consumer-install

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable && corepack prepare yarn@3.6.1 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Nitro bridge
        run: yarn nitrogen

      - name: Install JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run Android unit tests
        working-directory: libraries/react-native-iap/example/android
        run: ./gradlew :react-native-iap:testDebugUnitTest --stacktrace

  android-gradle-compatibility:
    name: Android Gradle ${{ matrix.agp }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - agp: "8.8.2"
            mode: default
            gradle: "8.13"
            kotlin: "2.1.20"
          - agp: "8.13.2"
            mode: default
          - agp: "9.0.1"
            mode: default
          - agp: "9.2.1"
            mode: default
          - agp: "9.2.1"
            mode: opt-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: ${{ matrix.gradle || '9.4.1' }}
      - name: Install React Native dependencies and generate bindings
        run: |
          corepack enable && corepack prepare yarn@3.6.1 --activate
          yarn install --immutable
          yarn nitrogen
      - name: Install Expo dependencies
        working-directory: libraries/expo-iap
        run: bun install --frozen-lockfile
      - name: Verify both Android library build scripts
        working-directory: .
        env:
          AGP_VERSION: ${{ matrix.agp }}
          KOTLIN_MODE: ${{ matrix.mode }}
          KOTLIN_VERSION: ${{ matrix.kotlin }}
        run: node scripts/test-android-gradle-compatibility.mjs "$AGP_VERSION" "$KOTLIN_MODE"

  ios-xcode-27:
    name: iOS example (Xcode 27)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Test iOS log sanitizer
        run: bash ../../scripts/test-ios-log-sanitizers.sh react-native

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          working-directory: libraries/react-native-iap/example

      - name: Enable Corepack
        run: corepack enable && corepack prepare yarn@3.6.1 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Nitro bridge
        run: yarn nitrogen

      - name: Install Ruby dependencies
        working-directory: libraries/react-native-iap/example
        run: BUNDLE_FROZEN=true bundle install

      - name: Install CocoaPods dependencies
        working-directory: libraries/react-native-iap/example/ios
        run: bundle exec pod install --repo-update

      - name: Build scene-based iOS example
        working-directory: libraries/react-native-iap/example/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace example.xcworkspace \
            -scheme example \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
