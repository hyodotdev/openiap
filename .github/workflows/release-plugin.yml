name: "P1. Release: OpenIAP plugin"

# Installed Codex and Claude Code plugins update only when the manifest version
# rises, so a skills change reaches them through this release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Bump the plugin version
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Plugin releases run from main, not $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Bump openiap-versions.json and both manifests
        id: bump
        env:
          BUMP: ${{ inputs.version }}
        run: |
          VERSION=$(node scripts/audit-plugin-manifests.mjs bump "$BUMP")
          node scripts/audit-plugin-manifests.mjs
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # The version copies and generated context land in the same commit.
      - name: Sync version files
        run: ./scripts/sync-release-generated.sh

      - name: Create release push token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit version update
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/openiap/.codex-plugin/plugin.json plugins/openiap/.claude-plugin/plugin.json
          git commit -m "chore(release): openiap plugin@$VERSION" --no-verify
          git push origin "HEAD:main"
