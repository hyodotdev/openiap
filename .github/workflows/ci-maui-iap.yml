name: CI - maui-iap

on:
  pull_request:
    branches: [main, next]
    paths:
      - "libraries/maui-iap/**"
      - "packages/gql/**"
      - "packages/google/**"
      - "packages/apple/Sources/**"
      - "packages/apple/wrapper/**"
      - "packages/apple/scripts/**"
      - "openiap-versions.json"
      - "scripts/ci/retry-gradle.sh"
      - ".github/workflows/ci-maui-iap.yml"
      - "!**/*.md"
  push:
    branches: [main, next]
    paths:
      - "libraries/maui-iap/**"
      - "packages/gql/**"
      - "packages/google/**"
      - "packages/apple/Sources/**"
      - "packages/apple/wrapper/**"
      - "packages/apple/scripts/**"
      - "openiap-versions.json"
      - "scripts/ci/retry-gradle.sh"
      - ".github/workflows/ci-maui-iap.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: 2.45.4
  XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
  APP_STORE_XCODE_VERSION: "26.6"
  APP_STORE_SDK_VERSION: "26.5"
  APP_STORE_LD_VERSION: "1267.0"

jobs:
  compile-check:
    name: Compile Check (net10.0 shared)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: libraries/maui-iap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      # The shared `net10.0` build is the fast lane — no AAR / xcframework,
      # MAUI workload, or native binding csprojs in the project graph. Two
      # things make this work:
      #   1. `<UseMaui>` is conditional on having a platform identifier in
      #      OpenIap.Maui.csproj, so the shared TFMs don't activate MAUI.
      #   2. `-p:TargetFrameworks=net10.0` (PLURAL — overrides the project's
      #      `<TargetFrameworks>` list to a single TFM). This must be plural,
      #      not `-p:TargetFramework=net10.0` (singular) or `-f net10.0`: those
      #      filter the inner BUILD but leave the implicit RESTORE walking
      #      all platform TFMs in the multi-target list, which loads the conditional
      #      ProjectReferences to Bindings.Android / Bindings.iOS for
      #      restore-time evaluation and triggers NETSDK1147 / NETSDK1178.
      - name: Build library (shared)
        run: dotnet build src/OpenIap.Maui/OpenIap.Maui.csproj -p:TargetFrameworks=net10.0 --nologo

      - name: Run contract tests (shared)
        run: dotnet run --project tests/OpenIap.Maui.ContractTests/OpenIap.Maui.ContractTests.csproj --framework net10.0 -p:TargetFrameworks=net10.0 --no-launch-profile

      # xUnit suite for the shared surface (Types.cs serialization, error
      # mapper, KitApi HTTP contract). net10.0-only project;
      # the PLURAL TargetFrameworks override keeps the referenced
      # OpenIap.Maui restore off the workload TFMs — same gotcha as above.
      - name: Run unit tests (shared)
        run: dotnet test tests/OpenIap.Maui.Tests/OpenIap.Maui.Tests.csproj -p:TargetFrameworks=net10.0 --nologo

  android-binding:
    name: Android binding (net10.0-android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui-android --skip-sign-check

      # The Android binding consumes the selected Google AAR as an unbound
      # runtime dependency, plus the MAUI-owned OpenIapMauiModule AAR as the
      # bound facade. Build all Google store artifacts up front, then rebuild
      # the MAUI facade/binding/library for each store because the facade AAR
      # output path is shared across store selections.
      - name: Build Google AARs
        working-directory: packages/google
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew \
            :openiap:assemblePlayRelease \
            :openiap:assembleAmazonRelease \
            :openiap:assembleHorizonRelease

      # `-p:TargetFrameworks=net10.0-android` (PLURAL) isolates each store build.
      # The singular `-f net10.0-android` filters the inner
      # build but leaves the implicit restore walking ALL 4 TFMs in the
      # project's multi-target list. That makes restore load the
      # Bindings.iOS conditional ProjectReference, whose SDK packs aren't part
      # of the `maui-android` workload installed above.
      - name: Build Android binding + library
        working-directory: libraries/maui-iap
        run: |
          DOTNET_BUILD_ARGS=(/m:1 /nr:false -p:UseSharedCompilation=false --nologo)
          for store in play amazon horizon; do
            printf '\n== Building MAUI Android store: %s (net10.0) ==\n' "$store"
            dotnet build-server shutdown || true
            rm -rf \
              src/OpenIap.Maui.Bindings.Android/bin \
              src/OpenIap.Maui.Bindings.Android/obj
            (
              cd android
              "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" \
                ../../../packages/google/gradlew \
                :openiap:assembleRelease \
                -PopenIapAndroidStore="$store"
            )
            dotnet build src/OpenIap.Maui.Bindings.Android/OpenIap.Maui.Bindings.Android.csproj -p:TargetFrameworks=net10.0-android -p:OpenIapAndroidStore="$store" "${DOTNET_BUILD_ARGS[@]}"
            dotnet build src/OpenIap.Maui/OpenIap.Maui.csproj -p:TargetFrameworks=net10.0-android -p:OpenIapAndroidStore="$store" -p:BuildProjectReferences=false "${DOTNET_BUILD_ARGS[@]}"
          done

  pick-mac-runner:
    # Same-repo runs go to the self-hosted Mac only while its heartbeat
    # (MAC_CI, refreshed by scripts/ci/mac-runner-heartbeat.sh) is fresh;
    # a stale heartbeat, a fork PR, or any parse doubt falls back to cloud.
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          HEARTBEAT: ${{ vars.MAC_CI }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          runner='macos-26'
          case "$HEARTBEAT" in
            ''|*[!0-9]*) ;;
            *)
              if [ "$SAME_REPO" = "true" ] \
                && [ $(( $(date +%s) - HEARTBEAT )) -lt 900 ]; then
                runner='self-mac'
              fi
              ;;
          esac
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  app-store-artifact:
    name: App Store artifact (Xcode 26.6)
    needs: pick-mac-runner
    runs-on: ${{ needs.pick-mac-runner.outputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up App Store Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.APP_STORE_XCODE_VERSION }}

      - name: Install xcodegen
        run: bash scripts/install-xcodegen.sh "$XCODEGEN_VERSION"

      - name: Build OpenIAP.xcframework
        run: bash packages/apple/scripts/build-xcframework.sh

      - name: Verify App Store toolchain provenance
        run: bash packages/apple/scripts/verify-app-store-xcframework.sh

  ios-binding:
    name: iOS binding (net10.0 ios + maccatalyst)
    # This lane proves source compatibility with the upcoming Xcode 27 SDK.
    # The separate app-store-artifact lane guards the XCFramework that can be
    # packed into a stable NuGet release.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-sign-check

      - name: Install xcodegen
        run: bash scripts/install-xcodegen.sh "$XCODEGEN_VERSION"

      # The iOS binding csproj consumes packages/apple/.build/xcframework/OpenIAP.xcframework.
      # Build it via the wrapper Xcode project produced from packages/apple/wrapper/project.yml.
      - name: Build OpenIAP.xcframework
        run: bash packages/apple/scripts/build-xcframework.sh

      # `-p:TargetFrameworks=...` (PLURAL) — see the android-binding job
      # comment for the rationale. Cross-TFM restore-walk is the same
      # gotcha here even though the iOS runner has more workloads installed.
      - name: Build iOS binding (ios + maccatalyst)
        working-directory: libraries/maui-iap/src/OpenIap.Maui.Bindings.iOS
        run: |
          dotnet build -p:TargetFrameworks=net10.0-ios --nologo
          dotnet build -p:TargetFrameworks=net10.0-maccatalyst --nologo

      - name: Build library (ios + maccatalyst)
        working-directory: libraries/maui-iap/src/OpenIap.Maui
        run: |
          dotnet build -p:TargetFrameworks=net10.0-ios --nologo
          dotnet build -p:TargetFrameworks=net10.0-maccatalyst --nologo
