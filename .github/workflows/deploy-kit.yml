name: "A2. Deploy: Kit"

# Verify on any push/PR or manual ref; deploy only from the main branch, and
# from a push only when it changes what kit builds from
# (scripts/ci/kit-deploy-needed.mjs). Production deploys configure the source
# credential before publishing Convex functions and Fly.

on:
  push:
    branches: [main]
    paths:
      - "packages/kit/**"
      # The kit binary serves kit.openiap.dev/mcp from the MCP server's source
      # (issue #287) and embeds the Commerce Protocol's generated artifacts.
      - "packages/mcp-server/**"
      - "specs/commerce-protocol/**"
      # The MCP server compiles against the portable kit-api contract.
      - "specs/client/src/kit-api.ts"
      - "specs/client/package.json"
      - "codecov.yml"
      - ".github/workflows/deploy-kit.yml"
      - "scripts/install-security-tool.sh"
      - "scripts/assert-lcov-coverage.mjs"
      - "scripts/bun-dependency-snapshot.mjs"
      - "scripts/ci/kit-deploy-needed.mjs"
      - ".github/actions/coverage-report/**"
      - "bun.lock"
      - "package.json"
  pull_request:
    paths:
      - "packages/kit/**"
      - "packages/mcp-server/**"
      - "specs/commerce-protocol/**"
      - "specs/client/src/kit-api.ts"
      - "specs/client/package.json"
      - "codecov.yml"
      - ".github/workflows/deploy-kit.yml"
      - "scripts/install-security-tool.sh"
      - "scripts/assert-lcov-coverage.mjs"
      - "scripts/bun-dependency-snapshot.mjs"
      - "scripts/ci/kit-deploy-needed.mjs"
      - ".github/actions/coverage-report/**"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck + Build (kit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    defaults:
      run:
        working-directory: packages/kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # Root manifest and lock edits deploy only when they reach kit; PRs run
      # it too so the decision is exercised before it gates main.
      - name: Decide whether the change deploys kit
        id: scope
        working-directory: ${{ github.workspace }}
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          deploy=true
          if [ -n "$BASE" ]; then
            deploy="$(bun scripts/ci/kit-deploy-needed.mjs "$BASE")"
          fi
          # Only an explicit `false` skips the deploy.
          [ "$deploy" = false ] || deploy=true
          echo "Deploy kit: $deploy"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: |
          # Registry metadata can be temporarily incomplete even when the
          # frozen lockfile is valid. Match the root CI retry policy.
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "Attempt $attempt failed. Retrying..."
            sleep 5
          done

      - name: Install OSV-Scanner v2.5.0
        working-directory: ${{ github.workspace }}
        run: |
          scripts/install-security-tool.sh osv-scanner "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Audit dependency vulnerabilities
        working-directory: ${{ github.workspace }}
        run: node scripts/audit-security.mjs dependencies

      - name: Test production Convex target guard
        run: |
          set -a
          source production.env
          set +a
          VITE_KIT_CONVEX_URL="$IAPKIT_PRODUCTION_CONVEX_URL" \
            ./scripts/verify-production-convex-target.sh
          if VITE_KIT_CONVEX_URL=https://invalid-dev.convex.cloud \
            ./scripts/verify-production-convex-target.sh; then
            echo "::error::Production target guard accepted a development deployment."
            exit 1
          fi

      # ci.yml runs independently, so the guard has to gate the deploy here too.
      - name: Run IAPKit spec contract audit
        working-directory: ${{ github.workspace }}
        run: node scripts/audit-kit-spec-contract.mjs

      - name: Lint (app + Convex typecheck + eslint)
        run: bun run lint

      - name: Format check
        run: bunx prettier --check "src/**/*.{ts,tsx,css,json}" "server/**/*.ts" "convex/**/*.ts" "scripts/verify-fly-deployment*.ts" "scripts/verification-provisioning.test.ts"

      - name: Run tests (convex + server unit tests)
        run: bun run test:coverage

      - name: Enforce server project and patch coverage
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node ../../scripts/assert-lcov-coverage.mjs coverage/lcov.info --component iapkit-server

      - name: Enforce Convex project and patch coverage
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node ../../scripts/assert-lcov-coverage.mjs coverage/lcov.info --component iapkit-convex

      - name: Lint + test MCP server (served by kit's /mcp route)
        # kit's Fly binary imports @hyodotdev/openiap-mcp-server/web from
        # source, so its regressions ship with kit deploys. This workflow
        # is the only CI that runs the MCP server's own suite.
        working-directory: packages/mcp-server
        run: |
          bun run lint
          bun run test

      - name: Vite build
        env:
          VITE_KIT_CONVEX_URL: https://placeholder-build-1.convex.cloud
        run: bun run build

      - name: Bun compile server
        run: bun run build:server

      - name: Install Playwright chromium
        # smoke-browser.ts loads the SPA in headless Chromium to catch
        # runtime bundle crashes that HTTP probes miss (see PR #120).
        # `--with-deps` runs apt, which fails whenever Google's Chrome
        # repository serves a stale index. Playwright downloads its own
        # chromium, so drop that source first: nothing here needs it.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          bunx playwright install --with-deps chromium

      - name: Smoke test compiled server
        run: ./scripts/smoke-server.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Docker build (PR-level Dockerfile check)
        # The Deploy job below also builds the Docker image, but only on
        # push-to-main. Building here on PRs catches Dockerfile/Bun-image
        # incompatibilities before merge (see PR #119, where bun 1.3.13
        # changed --filter hoisting and broke the per-package COPY).
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ github.workspace }}
          file: packages/kit/Dockerfile
          load: true
          push: false
          tags: openiap-kit:security-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_KIT_CONVEX_URL=https://placeholder-build-1.convex.cloud
            IAPKIT_REVISION=${{ github.sha }}

      - name: Install Trivy v0.74.0
        working-directory: ${{ github.workspace }}
        run: scripts/install-security-tool.sh trivy "$RUNNER_TEMP/trivy"

      - name: Scan Kit image
        working-directory: ${{ github.workspace }}
        run: >-
          "$RUNNER_TEMP/trivy" image openiap-kit:security-scan
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignorefile packages/kit/.trivyignore.yaml
          --exit-code 1
          --exit-on-eol 1

      - name: Preserve and report coverage
        uses: ./.github/actions/coverage-report
        with:
          package-path: packages/kit
          flag: iapkit
          use-oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  deploy:
    name: Deploy Convex + openiap-kit
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.verify.outputs.deploy == 'true'))
    environment: kit-production
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-kit-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate deployment credentials
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.KIT_CONVEX_DEPLOY_KEY }}
          FLY_API_TOKEN: ${{ secrets.KIT_FLY_API_TOKEN }}
          IAPKIT_VERIFICATION_SOURCE_SECRET: ${{ secrets.KIT_VERIFICATION_SOURCE_SECRET }}
        run: bash packages/kit/scripts/validate-deployment-credentials.sh

      - name: Setup Bun (for Convex deploy)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install Kit dependencies
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile --filter @hyodotdev/openiap-kit && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "Attempt $attempt failed. Retrying..."
            sleep 5
          done

      - name: Setup flyctl
        # Pinned to the `1.6` release rather than `@master` so the action
        # can't silently change under us (supply-chain risk — a future
        # compromise of `master` shouldn't wedge our deploy).
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy Convex functions
        working-directory: packages/kit
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.KIT_CONVEX_DEPLOY_KEY }}
          FLY_API_TOKEN: ${{ secrets.KIT_FLY_API_TOKEN }}
          IAPKIT_VERIFICATION_SOURCE_SECRET: ${{ secrets.KIT_VERIFICATION_SOURCE_SECRET }}
        run: |
          # Convex resolves the canonical URL for the deployment selected by
          # CONVEX_DEPLOY_KEY. Abort before pushing functions if it does not
          # match the committed production SSOT. Configure the shared runtime
          # source credential before publishing guards, then pass the resolved
          # URL to the later Fly build through GITHUB_ENV.
          bunx convex deploy --yes \
            --cmd 'bash ./scripts/provision-verification-source.sh && printf "VITE_KIT_CONVEX_URL=%s\n" "$VITE_KIT_CONVEX_URL" >> "$GITHUB_ENV"' \
            --cmd-url-env-var-name VITE_KIT_CONVEX_URL

      - name: Deploy
        # Deploy from the monorepo root so the Docker build context has
        # the workspace lockfile + every workspace package.json available
        # to `bun install --filter @hyodotdev/openiap-kit`. Without this,
        # `COPY package.json bun.lock ./` in the Dockerfile can't find
        # the lockfile — it lives at root, not under packages/kit/.
        working-directory: ${{ github.workspace }}
        env:
          FLY_API_TOKEN: ${{ secrets.KIT_FLY_API_TOKEN }}
          VITE_KIT_SENTRY_DSN: ${{ secrets.VITE_KIT_SENTRY_DSN }}
          VITE_KIT_MIXPANEL_TOKEN: ${{ secrets.VITE_KIT_MIXPANEL_TOKEN }}
        run: |
          # VITE_KIT_SENTRY_DSN / VITE_KIT_MIXPANEL_TOKEN are optional —
          # if unset, the SPA skips the corresponding analytics init at
          # runtime rather than failing the build.
          # Mixpanel is passed as a BuildKit secret, not an ARG/ENV pair,
          # so Docker's secret-name check does not flag a public SPA token.
          # A short hash of the token is also passed as a build arg purely to
          # bust the layer cache when the token rotates (BuildKit secret values
          # are not part of the cache key).
          BUILD_FLAGS=(
            --build-arg "VITE_KIT_CONVEX_URL=$VITE_KIT_CONVEX_URL"
            --build-arg "VITE_KIT_SENTRY_DSN=$VITE_KIT_SENTRY_DSN"
            --build-arg "IAPKIT_REVISION=$GITHUB_SHA"
          )
          if [ -n "$VITE_KIT_MIXPANEL_TOKEN" ]; then
            MIXPANEL_TOKEN_HASH=$(printf '%s' "$VITE_KIT_MIXPANEL_TOKEN" | sha256sum | cut -c1-16)
            BUILD_FLAGS+=(--build-arg "VITE_KIT_MIXPANEL_TOKEN_HASH=$MIXPANEL_TOKEN_HASH")
            BUILD_FLAGS+=(--build-secret "VITE_KIT_MIXPANEL_TOKEN=$VITE_KIT_MIXPANEL_TOKEN")
          fi

          flyctl deploy --remote-only \
            --config packages/kit/fly.toml \
            --dockerfile packages/kit/Dockerfile \
            "${BUILD_FLAGS[@]}"

      - name: Verify every retained Fly machine
        env:
          FLY_API_TOKEN: ${{ secrets.KIT_FLY_API_TOKEN }}
          IAPKIT_REVISION: ${{ github.sha }}
        run: bun packages/kit/scripts/verify-fly-deployment.ts "$IAPKIT_REVISION"
