name: Kit — Verify + Deploy

# Verify on any push/PR or manual ref; deploy only from the main branch. The
# paths filter keeps this workflow off the critical path for unrelated package
# changes. Production deploys publish additive Convex functions before Fly.

on:
  push:
    branches: [main]
    paths:
      - "packages/kit/**"
      # kit.openiap.dev/mcp is served by kit's Fly binary importing
      # @hyodotdev/openiap-mcp-server/web straight from source, so an
      # MCP-server change must redeploy kit or it never ships (issue #287).
      - "packages/mcp-server/**"
      - ".github/workflows/deploy-kit.yml"
      - "bun.lock"
      - "package.json"
  pull_request:
    paths:
      - "packages/kit/**"
      - "packages/mcp-server/**"
      - "codecov.yml"
      - ".github/workflows/deploy-kit.yml"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck + Build (kit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/kit
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: |
          # Registry metadata can be temporarily incomplete even when the
          # frozen lockfile is valid. Match the root CI retry policy.
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "Attempt $attempt failed. Retrying..."
            sleep 5
          done

      - name: Test production Convex target guard
        run: |
          set -a
          source production.env
          set +a
          VITE_KIT_CONVEX_URL="$IAPKIT_PRODUCTION_CONVEX_URL" \
            ./scripts/verify-production-convex-target.sh
          if VITE_KIT_CONVEX_URL=https://invalid-dev.convex.cloud \
            ./scripts/verify-production-convex-target.sh; then
            echo "::error::Production target guard accepted a development deployment."
            exit 1
          fi

      # This workflow is what actually ships kit to every already-published
      # app, so the response-contract guard has to gate it here — ci.yml runs
      # independently and can still be red when this job's deploy gate opens.
      - name: Run IAPKit spec contract audit
        working-directory: ${{ github.workspace }}
        run: node scripts/audit-kit-spec-contract.mjs

      - name: Lint (app + Convex typecheck + eslint)
        run: bun run lint

      - name: Format check
        run: bunx prettier --check "src/**/*.{ts,tsx,css,json}" "server/**/*.ts" "convex/**/*.ts"

      - name: Run tests (convex + server unit tests)
        run: bun run test:coverage

      - name: Enforce server line coverage
        run: node ../../scripts/assert-lcov-coverage.mjs coverage/lcov.info 90 server/

      - name: Enforce Convex line coverage
        run: node ../../scripts/assert-lcov-coverage.mjs coverage/lcov.info 48 convex/

      - name: Upload Kit coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          disable_search: true
          files: coverage/lcov.info
          flags: iapkit
          name: iapkit
          network_prefix: packages/kit/
          working-directory: packages/kit

      - name: Lint + test MCP server (served by kit's /mcp route)
        # kit's Fly binary imports @hyodotdev/openiap-mcp-server/web from
        # source, so its regressions ship with kit deploys. This workflow
        # is the only CI that runs the MCP server's own suite.
        working-directory: packages/mcp-server
        run: |
          bun run lint
          bun run test

      - name: Vite build
        env:
          VITE_KIT_CONVEX_URL: https://placeholder-build-1.convex.cloud
        run: bun run build

      - name: Bun compile server
        run: bun run build:server

      - name: Install Playwright chromium
        # smoke-browser.ts loads the SPA in headless Chromium to catch
        # runtime bundle crashes that HTTP probes miss (see PR #120).
        run: bunx playwright install --with-deps chromium

      - name: Smoke test compiled server
        run: ./scripts/smoke-server.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker build (PR-level Dockerfile check)
        # The Deploy job below also builds the Docker image, but only on
        # push-to-main. Building here on PRs catches Dockerfile/Bun-image
        # incompatibilities before merge (see PR #119, where bun 1.3.13
        # changed --filter hoisting and broke the per-package COPY).
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}
          file: packages/kit/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_KIT_CONVEX_URL=https://placeholder-build-1.convex.cloud
            IAPKIT_REVISION=${{ github.sha }}

  deploy:
    name: Deploy Convex + openiap-kit
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-kit-${{ github.ref }}
      cancel-in-progress: false
    env:
      KIT_CONVEX_DEPLOY_KEY: ${{ secrets.KIT_CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate deployment credentials
        env:
          FLY_API_TOKEN: ${{ secrets.KIT_FLY_API_TOKEN }}
        run: |
          if [ -z "$KIT_CONVEX_DEPLOY_KEY" ]; then
            echo "::error::KIT_CONVEX_DEPLOY_KEY secret not set."
            exit 1
          fi
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::KIT_FLY_API_TOKEN secret not set."
            exit 1
          fi

      - name: Setup Bun (for Convex deploy)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Deploy Convex functions
        working-directory: packages/kit
        env:
          CONVEX_DEPLOY_KEY: ${{ env.KIT_CONVEX_DEPLOY_KEY }}
        run: |
          # Install only Kit's workspace dependencies. Convex goes first because
          # its additive API remains compatible with the currently running Fly app.
          for attempt in 1 2 3; do
            (cd "$GITHUB_WORKSPACE" && bun install --frozen-lockfile --filter @hyodotdev/openiap-kit) && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "Attempt $attempt failed. Retrying..."
            sleep 5
          done
          # Convex resolves the canonical URL for the deployment selected by
          # CONVEX_DEPLOY_KEY. Abort before pushing functions if it does not
          # match the committed production SSOT, then pass that same resolved
          # URL to the later Fly build through GITHUB_ENV.
          bunx convex deploy --yes \
            --cmd './scripts/verify-production-convex-target.sh && printf "VITE_KIT_CONVEX_URL=%s\n" "$VITE_KIT_CONVEX_URL" >> "$GITHUB_ENV"' \
            --cmd-url-env-var-name VITE_KIT_CONVEX_URL

      - name: Setup flyctl
        # Pinned to the `1.6` release rather than `@master` so the action
        # can't silently change under us (supply-chain risk — a future
        # compromise of `master` shouldn't wedge our deploy).
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy
        # Deploy from the monorepo root so the Docker build context has
        # the workspace lockfile + every workspace package.json available
        # to `bun install --filter @hyodotdev/openiap-kit`. Without this,
        # `COPY package.json bun.lock ./` in the Dockerfile can't find
        # the lockfile — it lives at root, not under packages/kit/.
        env:
          FLY_API_TOKEN: ${{ secrets.KIT_FLY_API_TOKEN }}
          VITE_KIT_SENTRY_DSN: ${{ secrets.VITE_KIT_SENTRY_DSN }}
          VITE_KIT_MIXPANEL_TOKEN: ${{ secrets.VITE_KIT_MIXPANEL_TOKEN }}
        run: |
          # VITE_KIT_SENTRY_DSN / VITE_KIT_MIXPANEL_TOKEN are optional —
          # if unset, the SPA skips the corresponding analytics init at
          # runtime rather than failing the build.
          # Mixpanel is passed as a BuildKit secret, not an ARG/ENV pair,
          # so Docker's secret-name check does not flag a public SPA token.
          # A short hash of the token is also passed as a build arg purely to
          # bust the layer cache when the token rotates (BuildKit secret values
          # are not part of the cache key).
          BUILD_FLAGS=(
            --build-arg "VITE_KIT_CONVEX_URL=$VITE_KIT_CONVEX_URL"
            --build-arg "VITE_KIT_SENTRY_DSN=$VITE_KIT_SENTRY_DSN"
            --build-arg "IAPKIT_REVISION=$GITHUB_SHA"
          )
          if [ -n "$VITE_KIT_MIXPANEL_TOKEN" ]; then
            MIXPANEL_TOKEN_HASH=$(printf '%s' "$VITE_KIT_MIXPANEL_TOKEN" | sha256sum | cut -c1-16)
            BUILD_FLAGS+=(--build-arg "VITE_KIT_MIXPANEL_TOKEN_HASH=$MIXPANEL_TOKEN_HASH")
            BUILD_FLAGS+=(--build-secret "VITE_KIT_MIXPANEL_TOKEN=$VITE_KIT_MIXPANEL_TOKEN")
          fi

          flyctl deploy --remote-only \
            --config packages/kit/fly.toml \
            --dockerfile packages/kit/Dockerfile \
            "${BUILD_FLAGS[@]}"
