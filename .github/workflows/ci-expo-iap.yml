name: CI - expo-iap

on:
  pull_request:
    branches: [main, next]
    paths:
      - "libraries/expo-iap/**"
      - "packages/gql/src/generated/types.ts"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "openiap-versions.json"
      - "codecov.yml"
      - ".github/workflows/ci-expo-iap.yml"
  push:
    branches: [main, next]
    paths:
      - "libraries/expo-iap/**"
      - "packages/gql/src/generated/types.ts"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "openiap-versions.json"
      - "codecov.yml"
      - ".github/workflows/ci-expo-iap.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libraries/expo-iap

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('libraries/expo-iap/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint:tsc

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('libraries/expo-iap/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugin
        run: bun run build:plugin

      - name: Test
        run: bun run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: true
          disable_search: true
          files: libraries/expo-iap/coverage/lcov.info
          flags: expo-iap
          name: expo-iap
          root_dir: libraries/expo-iap
          network_prefix: libraries/expo-iap/

      - name: Test plugin
        run: bun run test:plugin

      - name: Consumer install smoke test
        run: bun run verify:consumer-install

  ios-xcode-27:
    name: iOS example (Xcode 27)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install example dependencies
        working-directory: libraries/expo-iap/example
        run: bun install --frozen-lockfile

      - name: Build config plugin
        run: bun run build:plugin

      - name: Generate scene-based iOS project
        working-directory: libraries/expo-iap/example
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        working-directory: libraries/expo-iap/example/ios
        run: pod install --repo-update

      - name: Build scene-based iOS example
        working-directory: libraries/expo-iap/example/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace expoiapexample.xcworkspace \
            -scheme ExpoIAPExample \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
