name: CI - expo-iap

on:
  pull_request:
    branches: [main, next]
    paths:
      - "libraries/expo-iap/**"
      - "specs/client/src/generated/types.ts"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "openiap-versions.json"
      - "packages/google/gradle/openiap-store.gradle"
      - "libraries-versions.jsonc"
      - "codecov.yml"
      - "scripts/install-security-tool.sh"
      - "scripts/assert-lcov-coverage.mjs"
      - ".github/actions/coverage-report/**"
      - "scripts/test-ios-log-sanitizers.sh"
      - "scripts/ci/retry-gradle.sh"
      - ".github/workflows/ci-expo-iap.yml"
      - "!**/*.md"
  push:
    branches: [main, next]
    paths:
      - "libraries/expo-iap/**"
      - "specs/client/src/generated/types.ts"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "openiap-versions.json"
      - "packages/google/gradle/openiap-store.gradle"
      - "libraries-versions.jsonc"
      - "codecov.yml"
      - "scripts/install-security-tool.sh"
      - "scripts/assert-lcov-coverage.mjs"
      - ".github/actions/coverage-report/**"
      - "scripts/test-ios-log-sanitizers.sh"
      - "scripts/ci/retry-gradle.sh"
      - ".github/workflows/ci-expo-iap.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libraries/expo-iap

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('libraries/expo-iap/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint:tsc

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('libraries/expo-iap/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugin
        run: bun run build:plugin

      - name: Test
        run: bun run test:coverage

      - name: Enforce project and patch coverage
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node ../../scripts/assert-lcov-coverage.mjs coverage/lcov.info --component expo-iap

      - name: Test plugin
        run: bun run test:plugin

      - name: Consumer install smoke test
        run: bun run verify:consumer-install

      - name: Preserve and report coverage
        uses: ./.github/actions/coverage-report
        with:
          package-path: libraries/expo-iap
          flag: expo-iap
          use-oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('libraries/expo-iap/bun.lock', 'libraries/expo-iap/example/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install example dependencies
        working-directory: libraries/expo-iap/example
        run: bun install --frozen-lockfile

      - name: Build config plugin
        run: bun run build:plugin

      - name: Generate Android project
        working-directory: libraries/expo-iap/example
        run: npx expo prebuild --platform android --no-install --clean

      - name: Install JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run Android unit tests
        working-directory: libraries/expo-iap/example/android
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew :expo-iap:testDebugUnitTest --stacktrace

  ios-xcode-27:
    name: iOS example (Xcode 27)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Test iOS log sanitizer
        run: bash ../../scripts/test-ios-log-sanitizers.sh expo

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install example dependencies
        working-directory: libraries/expo-iap/example
        run: bun install --frozen-lockfile

      - name: Build config plugin
        run: bun run build:plugin

      - name: Generate scene-based iOS project
        working-directory: libraries/expo-iap/example
        run: |
          CP_CACHE_DIR="$RUNNER_TOOL_CACHE/cocoapods/$(pod --version)"
          export CP_CACHE_DIR
          printf 'CP_CACHE_DIR=%s\n' "$CP_CACHE_DIR" >> "$GITHUB_ENV"
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        working-directory: libraries/expo-iap/example/ios
        run: pod install --repo-update

      - name: Build scene-based iOS example
        working-directory: libraries/expo-iap/example/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace expoiapexample.xcworkspace \
            -scheme ExpoIAPExample \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
