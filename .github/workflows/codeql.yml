name: CodeQL

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_VERSION: 16.4

jobs:
  codeql-scope:
    name: Detect CodeQL Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift_core: ${{ github.event_name != 'pull_request' || steps.core.outputs.swift_core == 'true' }}
      swift_wrappers: ${{ github.event_name != 'pull_request' || steps.wrappers.outputs.changes != '[]' }}
      swift_components: >-
        ${{ github.event_name != 'pull_request' &&
        '["react-native","expo","expo-onside","flutter","godot"]' ||
        steps.wrappers.outputs.changes }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect Apple core changes
        if: github.event_name == 'pull_request'
        id: core
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Without this, '!' patterns are OR-ed positives that match nearly everything.
          predicate-quantifier: some-with-excludes
          filters: |
            swift_core:
              - 'packages/apple/**'
              - 'libraries/kmp-iap/native/InAppPurchaseBridge/**'
              - 'libraries/kmp-iap/openiap-versions.json'
              - 'openiap-versions.json'
              - '.github/workflows/codeql.yml'
              - '!**/*.md'

      - name: Detect Swift wrapper changes
        if: github.event_name == 'pull_request'
        id: wrappers
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            react-native:
              - 'libraries/react-native-iap/**'
              - 'libraries-versions.jsonc'
              - 'openiap-versions.json'
              - '.github/workflows/codeql.yml'
              - '!**/*.md'
            expo:
              - 'libraries/expo-iap/**'
              - 'libraries-versions.jsonc'
              - 'openiap-versions.json'
              - '.github/workflows/codeql.yml'
              - '!**/*.md'
            expo-onside:
              - 'libraries/expo-iap/**'
              - 'libraries-versions.jsonc'
              - 'openiap-versions.json'
              - '.github/workflows/codeql.yml'
              - '!**/*.md'
            flutter:
              - 'libraries/flutter_inapp_purchase/**'
              - 'libraries-versions.jsonc'
              - 'openiap-versions.json'
              - '.github/workflows/codeql.yml'
              - '!**/*.md'
            godot:
              - 'libraries/godot-iap/**'
              - 'openiap-versions.json'
              - '.github/workflows/codeql.yml'
              - '!**/*.md'

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - csharp
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:${{ matrix.language }}

  analyze-kotlin:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build Google Kotlin targets
        working-directory: packages/google
        run: |
          chmod +x gradlew
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew \
            --no-daemon --no-build-cache --rerun-tasks clean \
            :openiap:compilePlayDebugKotlin \
            :openiap:compileHorizonDebugKotlin \
            :openiap:compileAmazonDebugKotlin

      - name: Build KMP Android targets
        working-directory: libraries/kmp-iap
        run: |
          chmod +x gradlew
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew \
            --no-daemon --no-parallel --no-build-cache --rerun-tasks \
            -Dorg.gradle.jvmargs=-Xmx8192M \
            -Dkotlin.daemon.jvm.options=-Xmx4096M \
            clean \
            :library:compilePlayDebugKotlinAndroid \
            :library:compileHorizonDebugKotlinAndroid \
            :library:compileAmazonDebugKotlinAndroid

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:java-kotlin

  analyze-kotlin-wrappers:
    name: Analyze (java-kotlin / ${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [react-native, expo, flutter, godot, maui]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Setup Node.js
        if: matrix.component == 'react-native' || matrix.component == 'expo'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Setup Bun
        if: matrix.component == 'expo'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Setup Flutter
        if: matrix.component == 'flutter'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build React Native Android wrapper
        if: matrix.component == 'react-native'
        working-directory: libraries/react-native-iap
        run: |
          corepack enable
          corepack prepare yarn@3.6.1 --activate
          yarn install --immutable
          yarn nitrogen
          cd example/android
          chmod +x gradlew
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew \
            --no-daemon --no-build-cache --rerun-tasks :app:compileDebugKotlin

      - name: Build Expo Android wrapper
        if: matrix.component == 'expo'
        working-directory: libraries/expo-iap
        run: |
          bun install --frozen-lockfile
          bun run build:plugin
          cd example
          bun install --frozen-lockfile
          npx expo prebuild --platform android --clean
          chmod +x android/gradlew
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" android/gradlew \
            -p android --no-daemon --no-build-cache --rerun-tasks \
            :app:compileDebugKotlin

      - name: Build Flutter Android wrapper
        if: matrix.component == 'flutter'
        working-directory: libraries/flutter_inapp_purchase
        run: |
          flutter pub get
          bash scripts/verify-android-consumer-build.sh

      - name: Build Godot Android wrapper
        if: matrix.component == 'godot'
        working-directory: libraries/godot-iap
        run: |
          mkdir -p android/libs
          bash "$GITHUB_WORKSPACE/scripts/fetch-godot-lib.sh" \
            4.7.1-stable android/libs/godot-lib.aar
          cd android
          chmod +x gradlew
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew \
            --no-daemon --no-build-cache --rerun-tasks clean assembleDebug

      - name: Build MAUI Android wrapper
        if: matrix.component == 'maui'
        working-directory: libraries/maui-iap/android
        run: |
          chmod +x ../../../packages/google/gradlew
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" \
            ../../../packages/google/gradlew \
            --no-daemon --no-build-cache --rerun-tasks \
            :openiap:assembleRelease -PopenIapAndroidStore=play

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:java-kotlin/component:${{ matrix.component }}

  analyze-swift:
    name: Analyze (swift)
    needs: codeql-scope
    if: needs.codeql-scope.outputs.swift_core == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Build and test Apple core
        working-directory: packages/apple
        run: |
          swift package clean
          swift test

      - name: Build KMP Swift bridge
        working-directory: libraries/kmp-iap/native/InAppPurchaseBridge
        run: |
          swift package clean
          swift build

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:swift

  analyze-swift-wrappers:
    name: Analyze (swift / ${{ matrix.component }})
    needs: codeql-scope
    if: >-
      needs.codeql-scope.outputs.swift_wrappers == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ (github.event_name == 'pull_request' || matrix.component == 'godot') && 'macos-26' || 'xcode-27' }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.codeql-scope.outputs.swift_components) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: matrix.component == 'react-native' || startsWith(matrix.component, 'expo')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Setup Ruby
        if: matrix.component == 'react-native'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          working-directory: libraries/react-native-iap/example

      - name: Setup Bun
        if: startsWith(matrix.component, 'expo')
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Setup Flutter
        if: matrix.component == 'flutter'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Set up Godot Xcode
        if: matrix.component == 'godot'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Build React Native Swift wrapper
        if: matrix.component == 'react-native'
        working-directory: libraries/react-native-iap
        run: |
          corepack enable
          corepack prepare yarn@3.6.1 --activate
          yarn install --immutable
          yarn nitrogen
          cd example
          BUNDLE_FROZEN=true bundle install
          cd ios
          bundle exec pod install --repo-update
          xcodebuild build \
            -workspace example.xcworkspace \
            -scheme example \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Build Expo Swift wrapper
        if: startsWith(matrix.component, 'expo')
        working-directory: libraries/expo-iap
        env:
          EXPO_IAP_ONSIDE: ${{ matrix.component == 'expo-onside' && '1' || '0' }}
        run: |
          bun install --frozen-lockfile
          bun run build:plugin
          cd example
          bun install --frozen-lockfile
          npx expo prebuild --platform ios --clean
          cd ios
          pod install --repo-update
          xcodebuild build \
            -workspace expoiapexample.xcworkspace \
            -scheme ExpoIAPExample \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Build Flutter Swift wrappers
        if: matrix.component == 'flutter'
        working-directory: libraries/flutter_inapp_purchase
        env:
          EXPECTED_XCODE_MAJOR: ${{ github.event_name == 'pull_request' && '26' || '27' }}
        run: bash scripts/verify-apple-swiftpm-consumer-build.sh

      - name: Build Godot Swift wrapper
        if: matrix.component == 'godot'
        working-directory: libraries/godot-iap
        run: |
          make setup-swiftgodot
          cd ios-gdextension
          swift test

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:swift/component:${{ matrix.component }}
