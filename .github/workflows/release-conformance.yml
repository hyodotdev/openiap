name: "A. Release: openiap-conformance"

# Two-phase release, matching the other npm lanes: this workflow bumps and tags
# on the release branch, then dispatches itself on the tag ref so npm provenance
# attests the same commit the tag names.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - current
          - rc-bump
        default: patch
      prerelease:
        description: "Publish as prerelease from next (-rc.1)"
        required: false
        default: false
        type: boolean
      publish_only:
        description: "Internal: publish an existing release tag to npm"
        required: false
        default: false
        type: boolean
      source_run_id:
        description: "Internal: validated branch release workflow run"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.publish_only && 'publish' || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-branch:
    name: Validate release branch
    if: ${{ !inputs.publish_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce stable and prerelease branches
        run: >-
          node scripts/release-branch-policy.mjs guard conformance
          "${{ inputs.version }}" "${{ inputs.prerelease }}"
          "$GITHUB_REF_NAME"

  validate:
    name: Verify conformance suite
    needs: [release-branch]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            bun install --frozen-lockfile && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

      - name: Run suite tests
        working-directory: packages/conformance
        run: bun run test

      # A published suite whose behavior ids disagree with the native suites
      # would invalidate every report produced against it.
      - name: Verify cross-language behavior ids are in sync
        run: node packages/conformance/scripts/generate-behavior-ids.mjs --check

      - name: Verify every MUST behavior has an implementation
        run: node packages/conformance/scripts/coverage-report.mjs --check

      - name: Reference conformance report
        run: node packages/conformance/scripts/run-reference-report.mjs

  deploy:
    name: Bump, tag, and release
    needs: [validate]
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/conformance
    env:
      RELEASE_BRANCH: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Preserve npm release verifiers
        run: |
          cp "$GITHUB_WORKSPACE/scripts/verify-npm-release-provenance.mjs" "$RUNNER_TEMP/verify-npm-release-provenance.mjs"
          cp "$GITHUB_WORKSPACE/scripts/npm-publish-authorization.mjs" "$RUNNER_TEMP/npm-publish-authorization.mjs"

      - name: Ensure npm CLI v11.19.0 for signature verification
        run: npm install -g npm@11.19.0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          VERSION_TYPE: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$VERSION_TYPE" = "current" ]; then
            NEW_VERSION=$(node -p "require('./package.json').version")
          elif [ "$VERSION_TYPE" = "rc-bump" ]; then
            npm version prerelease --preid=rc --no-git-tag-version --workspaces=false
            NEW_VERSION=$(node -p "require('./package.json').version")
          elif [ "$IS_PRERELEASE" = "true" ]; then
            npm version "pre${VERSION_TYPE}" --preid=rc --no-git-tag-version --workspaces=false
            NEW_VERSION=$(node -p "require('./package.json').version")
          else
            npm version "$VERSION_TYPE" --no-git-tag-version --workspaces=false
            NEW_VERSION=$(node -p "require('./package.json').version")
          fi

          case "$NEW_VERSION" in
            *-*) IS_PRE=true ;;
            *) IS_PRE=false ;;
          esac
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        id: check_tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          VERSION_TYPE: ${{ inputs.version }}
        run: |
          TAG="openiap-conformance-$VERSION"
          git fetch --tags origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$VERSION_TYPE" != "current" ]; then
              echo "::error::$TAG already exists. Use current to retry this version."
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag (current version)
        if: ${{ inputs.version == 'current' && steps.check_tag.outputs.exists == 'true' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          TAG="openiap-conformance-$VERSION"
          node "$GITHUB_WORKSPACE/scripts/assert-release-tag.mjs" \
            conformance "$RELEASE_BRANCH" "$TAG" "$VERSION"
          git checkout "$TAG"

      - name: Assert verified release head is unchanged
        if: ${{ inputs.version != 'current' || steps.check_tag.outputs.exists != 'true' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/assert-release-head.mjs "$RELEASE_BRANCH" "$GITHUB_SHA"

      - name: Check npm for an existing version
        id: check_npm
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if NPM_OUTPUT=$(npm view "openiap-conformance@$VERSION" version 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$NPM_OUTPUT" | grep -qiE 'E404|404 Not Found'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unable to verify openiap-conformance@$VERSION on npm"
            echo "$NPM_OUTPUT"
            exit 1
          fi

      - name: Refuse an untagged published version
        if: ${{ steps.check_npm.outputs.exists == 'true' && steps.check_tag.outputs.exists != 'true' }}
        run: |
          echo "::error::Published version has no immutable release tag"
          exit 1

      - name: Verify existing npm release provenance
        if: ${{ steps.check_npm.outputs.exists == 'true' && steps.check_tag.outputs.exists == 'true' }}
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          TAG="openiap-conformance-$VERSION"
          EXPECTED_COMMIT=$(git rev-parse "$TAG^{commit}")
          node "$RUNNER_TEMP/verify-npm-release-provenance.mjs" \
            openiap-conformance "$VERSION" "$EXPECTED_COMMIT" "$TAG" \
            release-conformance.yml

      - name: Commit and tag
        if: ${{ inputs.version != 'current' }}
        working-directory: ${{ github.workspace }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          TAG="openiap-conformance-$VERSION"
          git add packages/conformance/package.json
          git commit -m "chore(release): openiap-conformance $VERSION"
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin "HEAD:$RELEASE_BRANCH" --follow-tags

      - name: Create tag (current version)
        if: ${{ inputs.version == 'current' && steps.check_tag.outputs.exists != 'true' }}
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          TAG="openiap-conformance-$VERSION"
          git commit --allow-empty -m "chore: recover release ref"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push --atomic origin \
            "HEAD:refs/heads/$RELEASE_BRANCH" \
            "refs/tags/$TAG:refs/tags/$TAG"

      - name: Require tag-ref npm publisher capability
        if: steps.check_npm.outputs.exists == 'false'
        working-directory: ${{ github.workspace }}
        env:
          TAG: openiap-conformance-${{ steps.bump.outputs.version }}
        run: |
          if ! git grep -q '^  publish-npm:' "$TAG" -- .github/workflows/release-conformance.yml || \
             ! git grep -q 'Upload npm publish authorization' "$TAG" -- .github/workflows/release-conformance.yml || \
             ! git cat-file -e "$TAG:scripts/verify-npm-release-provenance.mjs" || \
             ! git cat-file -e "$TAG:scripts/npm-publish-authorization.mjs"; then
            echo "::error::$TAG predates the authorized tag-ref npm publisher. Release a new reviewed version instead."
            exit 1
          fi

      - name: Write npm publish authorization
        if: steps.check_npm.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          TAG="openiap-conformance-$VERSION"
          TAG_SHA=$(git rev-parse "$TAG^{commit}")
          node "$RUNNER_TEMP/npm-publish-authorization.mjs" write \
            "$RUNNER_TEMP/npm-publish-authorization.json" \
            "$GITHUB_REPOSITORY" ".github/workflows/release-conformance.yml" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RELEASE_BRANCH" \
            "$GITHUB_SHA" "$TAG" "$TAG_SHA"

      - name: Upload npm publish authorization
        if: steps.check_npm.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: npm-publish-authorization-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-publish-authorization.json
          if-no-files-found: error
          retention-days: 1

      - name: Write release notes
        working-directory: ${{ github.workspace }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          cat > /tmp/release-notes.md <<EOF
          Versioned OpenIAP conformance suite: behavioral spec, runner, and adapter contract.

          ### Install

          \`\`\`bash
          npm install --save-dev openiap-conformance@$VERSION
          \`\`\`

          ### Links

          - [npm](https://www.npmjs.com/package/openiap-conformance/v/$VERSION)
          - [Adapter contract](https://github.com/hyodotdev/openiap/tree/openiap-conformance-$VERSION/packages/conformance#readme)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: openiap-conformance-${{ steps.bump.outputs.version }}
          name: openiap-conformance ${{ steps.bump.outputs.version }}
          draft: false
          prerelease: ${{ steps.bump.outputs.is_prerelease }}
          body_path: /tmp/release-notes.md

      - name: Dispatch SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: openiap-conformance-${{ steps.bump.outputs.version }}
        run: gh workflow run sbom.yml --ref main -f tag="$RELEASE_TAG"

      # npm provenance reads the immutable workflow event GITHUB_SHA. Dispatch
      # this same trusted-publisher workflow on the tag so the event SHA, npm
      # package gitHead, and release tag all identify the same source commit.
      - name: Dispatch npm publish on tag ref
        if: steps.check_npm.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_UPDATE_PAT }}
          TAG: openiap-conformance-${{ steps.bump.outputs.version }}
        run: |
          gh workflow run release-conformance.yml --ref "$TAG" \
            -f version=current \
            -f publish_only=true \
            -f source_run_id="$GITHUB_RUN_ID"

  publish-npm:
    name: Publish npm from release tag
    if: ${{ inputs.publish_only }}
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/conformance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm CLI v11.19.0 for signature verification
        run: npm install -g npm@11.19.0

      - name: Require the matching release tag
        id: release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_REF="refs/tags/openiap-conformance-$VERSION"
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "::error::npm publish must be dispatched on $EXPECTED_REF"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checked-out source does not match the workflow event SHA"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            SOURCE_BRANCH="next"
          else
            SOURCE_BRANCH="main"
          fi
          git fetch --no-tags origin "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$SOURCE_BRANCH"; then
            echo "::error::$EXPECTED_REF is not reachable from origin/$SOURCE_BRANCH"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Require successful source release run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ steps.release.outputs.source_branch }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A validated source release run id is required"
            exit 1
          fi
          SOURCE_RUN_JSON=""
          SOURCE_STATUS=""
          for _ in {1..60}; do
            SOURCE_RUN_JSON=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID") || {
              sleep 5
              continue
            }
            SOURCE_STATUS=$(jq -r '.status // ""' <<<"$SOURCE_RUN_JSON")
            if [ "$SOURCE_STATUS" = "completed" ]; then
              break
            fi
            sleep 5
          done
          if [ "$SOURCE_STATUS" != "completed" ]; then
            echo "::error::Source release run $SOURCE_RUN_ID did not complete within the wait window"
            exit 1
          fi
          SOURCE_PATH=$(jq -r '.path // ""' <<<"$SOURCE_RUN_JSON")
          SOURCE_EVENT=$(jq -r '.event // ""' <<<"$SOURCE_RUN_JSON")
          SOURCE_HEAD_BRANCH=$(jq -r '.head_branch // ""' <<<"$SOURCE_RUN_JSON")
          SOURCE_HEAD_SHA=$(jq -r '.head_sha // ""' <<<"$SOURCE_RUN_JSON")
          SOURCE_RUN_ATTEMPT=$(jq -r '.run_attempt // ""' <<<"$SOURCE_RUN_JSON")
          SOURCE_CONCLUSION=$(jq -r '.conclusion // ""' <<<"$SOURCE_RUN_JSON")
          SOURCE_REPOSITORY=$(jq -r '.repository.full_name // ""' <<<"$SOURCE_RUN_JSON")
          if [ "$SOURCE_STATUS" != "completed" ] || [ "$SOURCE_CONCLUSION" != "success" ]; then
            echo "::error::Source release run $SOURCE_RUN_ID did not complete successfully"
            exit 1
          fi
          if [ "$SOURCE_PATH" != ".github/workflows/release-conformance.yml" ] || \
             [ "$SOURCE_EVENT" != "workflow_dispatch" ] || \
             [ "$SOURCE_HEAD_BRANCH" != "$SOURCE_BRANCH" ] || \
             [ "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ] || \
             ! [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Source run does not match the required release workflow and branch"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_HEAD_SHA" "origin/$SOURCE_BRANCH"; then
            echo "::error::Source release run is not reachable from origin/$SOURCE_BRANCH"
            exit 1
          fi
          echo "head_sha=$SOURCE_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$SOURCE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Verify source run authorized this release tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ steps.release.outputs.source_branch }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          AUTHORIZATION_DIR="$RUNNER_TEMP/npm-publish-authorization"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "npm-publish-authorization-$SOURCE_RUN_ATTEMPT" \
            --dir "$AUTHORIZATION_DIR"
          node "$GITHUB_WORKSPACE/scripts/npm-publish-authorization.mjs" verify \
            "$AUTHORIZATION_DIR/npm-publish-authorization.json" \
            "$GITHUB_REPOSITORY" ".github/workflows/release-conformance.yml" \
            "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$SOURCE_BRANCH" \
            "$SOURCE_HEAD_SHA" "openiap-conformance-$VERSION" "$GITHUB_SHA"

      # Re-verify at the tag: a suite published with drifted ids would
      # invalidate every report produced against it.
      - name: Verify behavior ids and coverage at the tag
        working-directory: ${{ github.workspace }}
        run: |
          node packages/conformance/scripts/generate-behavior-ids.mjs --check
          node packages/conformance/scripts/coverage-report.mjs --check

      - name: Check if npm package already published
        id: check_npm
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if NPM_OUTPUT=$(npm view "openiap-conformance@$VERSION" version 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$NPM_OUTPUT" | grep -qiE 'E404|404 Not Found'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unable to verify openiap-conformance@$VERSION on npm"
            echo "$NPM_OUTPUT"
            exit 1
          fi

      - name: Publish to npm
        if: steps.check_npm.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag next --provenance
          else
            npm publish --access public --provenance
          fi

      - name: Verify published provenance
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node scripts/verify-npm-release-provenance.mjs \
            openiap-conformance "$VERSION" "$GITHUB_SHA" \
            "openiap-conformance-$VERSION" release-conformance.yml
