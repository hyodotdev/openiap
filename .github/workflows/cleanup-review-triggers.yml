name: "PR: Delete review triggers on merge"

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup-triggers:
    # Fork PRs get a read-only token that cannot delete; skip instead of failing.
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    name: Delete review-automation comments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Delete review-automation comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/delete-review-automation-comments.mjs "$PR_NUMBER"
