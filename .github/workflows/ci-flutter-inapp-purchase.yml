name: CI - flutter_inapp_purchase

on:
  pull_request:
    branches: [main, next]
    paths:
      - "libraries/flutter_inapp_purchase/**"
      - "packages/gql/src/generated/types.dart"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "openiap-versions.json"
      - ".github/workflows/ci-flutter-inapp-purchase.yml"
  push:
    branches: [main, next]
    paths:
      - "libraries/flutter_inapp_purchase/**"
      - "packages/gql/src/generated/types.dart"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "openiap-versions.json"
      - ".github/workflows/ci-flutter-inapp-purchase.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libraries/flutter_inapp_purchase

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android consumer build smoke test
        run: bash scripts/verify-android-consumer-build.sh

  apple-xcode-27:
    name: Apple examples (Flutter 3.44 + Xcode 27)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Build iOS and macOS examples with SwiftPM
        run: bash scripts/verify-apple-swiftpm-consumer-build.sh
