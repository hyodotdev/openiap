name: CI - flutter_inapp_purchase

on:
  pull_request:
    branches: [main]
    paths:
      - "libraries/flutter_inapp_purchase/**"
      - "specs/client/src/generated/types.dart"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "packages/apple/openiap.podspec"
      - "openiap-versions.json"
      - "packages/google/gradle/openiap-store.gradle"
      - "packages/google/build.gradle.kts"
      - "packages/google/openiap/**"
      - "packages/google/core/**"
      - "packages/conformance/android/**"
      - "libraries-versions.jsonc"
      - "codecov.yml"
      - "scripts/install-security-tool.sh"
      - "scripts/assert-lcov-coverage.mjs"
      - ".github/actions/coverage-report/**"
      - ".github/workflows/ci-flutter-inapp-purchase.yml"
      - ".github/actions/setup-xcode/action.yml"
      - ".java-version"
      - ".github/workflows/release-flutter.yml"
      - "scripts/ci/retry-gradle.sh"
      - "scripts/verify-horizon-merged-manifest.mjs"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "libraries/flutter_inapp_purchase/**"
      - "specs/client/src/generated/types.dart"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "packages/apple/openiap.podspec"
      - "openiap-versions.json"
      - "packages/google/gradle/openiap-store.gradle"
      - "packages/google/build.gradle.kts"
      - "packages/google/openiap/**"
      - "packages/google/core/**"
      - "packages/conformance/android/**"
      - "libraries-versions.jsonc"
      - "codecov.yml"
      - "scripts/install-security-tool.sh"
      - "scripts/assert-lcov-coverage.mjs"
      - ".github/actions/coverage-report/**"
      - ".github/workflows/ci-flutter-inapp-purchase.yml"
      - ".github/actions/setup-xcode/action.yml"
      - ".java-version"
      - ".github/workflows/release-flutter.yml"
      - "scripts/ci/retry-gradle.sh"
      - "scripts/verify-horizon-merged-manifest.mjs"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libraries/flutter_inapp_purchase

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: stable
          version: "3.44.9"
          cache: true
          cache-sdk: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version-file: .java-version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Filter generated coverage
        run: dart run tool/filter_coverage.dart

      - name: Enforce project and patch coverage
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node ../../scripts/assert-lcov-coverage.mjs coverage/lcov.info --component flutter-inapp-purchase

      - name: Android consumer build smoke test
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" \
            bash scripts/verify-android-consumer-build.sh

      # The static audit checks that the example declares the Horizon
      # meta-data; only the merged manifest shows what the build resolved it
      # to. A blank or missing property merges an empty value, which compiles
      # and installs and then throws inside startConnection on a headset.
      # Merging the manifest is enough — no APK is needed.
      - name: Verify Horizon app id resolves in the merged manifest
        working-directory: libraries/flutter_inapp_purchase/example
        run: |
          flutter pub get
          ./android/gradlew -p android :app:processDebugManifest -PopeniapStore=horizon
          node "$GITHUB_WORKSPACE/scripts/verify-horizon-merged-manifest.mjs" \
            build/app/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml

      # Flutter shrinks release builds with R8 by default, and the setup guide
      # says apps add no rules, so every store's release build has to shrink.
      - name: Build minified release APKs per store
        working-directory: libraries/flutter_inapp_purchase/example
        run: |
          for store in play horizon amazon; do
            ORG_GRADLE_PROJECT_openiapStore="$store" \
              "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" \
              flutter build apk --release --target-platform android-arm64
          done

      - name: Preserve and report coverage
        uses: ./.github/actions/coverage-report
        with:
          package-path: libraries/flutter_inapp_purchase
          flag: flutter-inapp-purchase
          use-oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  apple-xcode-27:
    name: Apple examples (Flutter 3.44 + Xcode 27)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: stable
          version: "3.44.9"
          cache: true
          cache-sdk: true

      - name: Build iOS and macOS examples with SwiftPM
        run: bash scripts/verify-apple-swiftpm-consumer-build.sh

  apple-cocoapods:
    name: iOS CocoaPods consumer (Flutter 3.44 + pinned Xcode)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: stable
          version: "3.44.9"
          cache: true
          cache-sdk: true

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Build iOS CocoaPods consumer
        run: bash scripts/verify-ios-cocoapods-consumer-build.sh
