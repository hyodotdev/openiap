name: CI - flutter_inapp_purchase

on:
  pull_request:
    branches: [main, next]
    paths:
      - "libraries/flutter_inapp_purchase/**"
      - "packages/gql/src/generated/types.dart"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "openiap-versions.json"
      - "codecov.yml"
      - ".github/workflows/ci-flutter-inapp-purchase.yml"
      - ".github/workflows/release-flutter.yml"
  push:
    branches: [main, next]
    paths:
      - "libraries/flutter_inapp_purchase/**"
      - "packages/gql/src/generated/types.dart"
      - "packages/apple/Sources/**"
      - "packages/apple/Package.swift"
      - "openiap-versions.json"
      - "codecov.yml"
      - ".github/workflows/ci-flutter-inapp-purchase.yml"
      - ".github/workflows/release-flutter.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libraries/flutter_inapp_purchase

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Filter generated coverage
        run: dart run tool/filter_coverage.dart

      - name: Enforce line coverage
        run: node ../../scripts/assert-lcov-coverage.mjs coverage/lcov.info 90

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          disable_search: true
          files: coverage/lcov.info
          flags: flutter-inapp-purchase
          name: flutter-inapp-purchase
          network_prefix: libraries/flutter_inapp_purchase/
          working-directory: libraries/flutter_inapp_purchase

      - name: Android consumer build smoke test
        run: bash scripts/verify-android-consumer-build.sh

  apple-xcode-27:
    name: Apple examples (Flutter 3.44 + Xcode 27)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Build iOS and macOS examples with SwiftPM
        run: bash scripts/verify-apple-swiftpm-consumer-build.sh

  apple-cocoapods:
    name: iOS CocoaPods consumer (Flutter 3.44 + Xcode 16.4)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 60
    env:
      XCODE_VERSION: 16.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build iOS CocoaPods consumer
        run: bash scripts/verify-ios-cocoapods-consumer-build.sh
