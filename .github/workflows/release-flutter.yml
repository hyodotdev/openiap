name: "A. Release: flutter_inapp_purchase"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - current
          - rc-bump
        default: patch
      prerelease:
        description: "Publish as prerelease from next (-rc.1)"
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  release-branch:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enforce stable and prerelease branches
        env:
          VERSION_TYPE: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: >-
          node scripts/release-branch-policy.mjs guard flutter
          "$VERSION_TYPE" "$IS_PRERELEASE"
          "$GITHUB_REF_NAME"

  validate-android:
    needs: [release-branch]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: libraries/flutter_inapp_purchase
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.44.9"

      - name: Install dependencies
        run: flutter pub get

      - name: Lint
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Prepare example env
        working-directory: libraries/flutter_inapp_purchase/example
        run: cp env.example env

      - name: Build Android
        working-directory: libraries/flutter_inapp_purchase/example
        run: flutter build apk --debug

      - name: Android consumer build smoke test
        working-directory: libraries/flutter_inapp_purchase
        run: bash scripts/verify-android-consumer-build.sh

  validate-ios:
    needs: [release-branch]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      XCODE_VERSION: 16.4
    defaults:
      run:
        working-directory: libraries/flutter_inapp_purchase
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.44.9"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build iOS CocoaPods consumer
        run: bash scripts/verify-ios-cocoapods-consumer-build.sh

  validate-apple-swiftpm:
    needs: [release-branch]
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: libraries/flutter_inapp_purchase
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.44.9"
          cache: true

      - name: Build Apple examples with SwiftPM
        run: bash scripts/verify-apple-swiftpm-consumer-build.sh

  deploy:
    needs: [validate-android, validate-ios, validate-apple-swiftpm]
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/flutter_inapp_purchase
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.44.9"

      - name: Setup Bun
        if: ${{ inputs.version != 'current' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Checkout release tag (current version)
        if: ${{ inputs.version == 'current' }}
        id: current_tag
        run: |
          NEW_VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          RELEASE_TAG="flutter-iap-${NEW_VERSION}"
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            node "$GITHUB_WORKSPACE/scripts/assert-release-tag.mjs" \
              flutter "$RELEASE_BRANCH" "$RELEASE_TAG" "$NEW_VERSION"
            git checkout "$RELEASE_TAG"
            echo "checked_out=true" >> "$GITHUB_OUTPUT"
          else
            echo "checked_out=false" >> "$GITHUB_OUTPUT"
            echo "Tag $RELEASE_TAG does not exist; current mode will use HEAD."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Validate checked-out current tag
        if: ${{ steps.current_tag.outputs.checked_out == 'true' }}
        run: |
          flutter analyze
          flutter test

      - name: Configure Git user
        run: |
          git config user.name "flutter-iap bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate version
        id: bump
        env:
          VERSION_TYPE: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          CURRENT_VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)

          if [ "$VERSION_TYPE" = "current" ]; then
            NEW_VERSION="$CURRENT_VERSION"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "prev_version=${CURRENT_VERSION%%[-+]*}" >> "$GITHUB_OUTPUT"
            if [[ "$NEW_VERSION" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          BASE_VERSION="${CURRENT_VERSION%%[-+]*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          if [ "$VERSION_TYPE" = "rc-bump" ]; then
            RC_NUM=$(echo "$CURRENT_VERSION" | sed -n 's/.*-rc\.\([0-9]*\)/\1/p')
            if [ -z "$RC_NUM" ]; then
              echo "::error::Current version $CURRENT_VERSION is not an rc version."
              exit 1
            fi
            NEW_VERSION="${BASE_VERSION}-rc.$((RC_NUM + 1))"
          elif [ "$IS_PRERELEASE" = "true" ]; then
            # major/minor/patch + prerelease → X.Y.Z-rc.1
            case "$VERSION_TYPE" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-rc.1"
          else
            # Stable release — if current version is RC, strip prerelease without bumping
            IS_RC=$(echo "$CURRENT_VERSION" | grep -c '\-rc\.' || true)
            if [ "$IS_RC" -gt 0 ] && [ "$VERSION_TYPE" = "patch" ]; then
              NEW_VERSION="${BASE_VERSION}"
            else
              case "$VERSION_TYPE" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                patch) PATCH=$((PATCH + 1)) ;;
              esac
              NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "prev_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$NEW_VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release tag already exists
        id: check_tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          VERSION_TYPE: ${{ inputs.version }}
        run: |
          RELEASE_TAG="flutter-iap-${NEW_VERSION}"
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$VERSION_TYPE" = "current" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "⚠️ Tag $RELEASE_TAG already exists. Will reuse existing tag (current mode)."
            else
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "❌ Tag $RELEASE_TAG already exists. Use 'current' to retry this version."
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "✓ Tag $RELEASE_TAG does not exist"
          fi

      - name: Check if pub.dev package already published
        id: check_pub
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          HTTP_STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" "https://pub.dev/api/packages/flutter_inapp_purchase/versions/$VERSION" || true)
          HTTP_STATUS="${HTTP_STATUS:-000}"
          case "$HTTP_STATUS" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "⚠️ flutter_inapp_purchase $VERSION already exists on pub.dev"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "✓ flutter_inapp_purchase $VERSION does not exist, will publish"
              ;;
            *)
              echo "❌ Unable to verify flutter_inapp_purchase $VERSION on pub.dev (HTTP $HTTP_STATUS)"
              exit 1
              ;;
          esac

      - name: Refuse an untagged published version
        if: ${{ steps.check_pub.outputs.exists == 'true' && steps.check_tag.outputs.exists != 'true' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          echo "❌ flutter_inapp_purchase $VERSION is published without a provenance tag; refusing to tag an unverified source"
          exit 1

      - name: Generate CHANGELOG entry
        if: ${{ inputs.version != 'current' }}
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          PREV_VERSION: ${{ steps.bump.outputs.prev_version }}
        run: |
          DATE=$(date +%Y-%m-%d)
          CONSOLIDATED_RELEASE_NOTES="https://openiap.dev/docs/updates/releases"
          CHANGES=""
          PREV_TAG=""
          for CANDIDATE in "flutter-iap-$PREV_VERSION" "$PREV_VERSION"; do
            if [ -n "$CANDIDATE" ] && git rev-parse "$CANDIDATE" >/dev/null 2>&1; then
              PREV_TAG="$CANDIDATE"
              break
            fi
          done

          if [ -n "$PREV_TAG" ]; then
            PR_LINES=$(git log "${PREV_TAG}..HEAD" --merges --pretty=format:"%s" -- ":(top)libraries/flutter_inapp_purchase/" ":(top)packages/google/" ":(top)packages/apple/" | \
              sed -n 's/^Merge pull request #\([0-9]*\) from .*/\1/p')
            for PR_NUM in $PR_LINES; do
              PR_TITLE=$(git log --all --grep="Merge pull request #${PR_NUM}" --pretty=format:"%s" | head -1 | sed "s|Merge pull request #${PR_NUM} from [^ ]* ||")
              if [ -n "$PR_TITLE" ]; then
                CHANGES="${CHANGES}- ${PR_TITLE} (#${PR_NUM})\n"
              fi
            done
            if [ -z "$CHANGES" ]; then
              LOG_LINES=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s" -- ":(top)libraries/flutter_inapp_purchase/" ":(top)packages/google/" ":(top)packages/apple/" | head -20)
              if [ -n "$LOG_LINES" ]; then
                CHANGES="${LOG_LINES}\n"
              fi
            fi
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES="- No direct Flutter package changes found between releases; this release picks up the latest OpenIAP native package updates.\n"
          fi
          CHANGES="${CHANGES}- See the consolidated OpenIAP release notes: ${CONSOLIDATED_RELEASE_NOTES}\n"
          ENTRY="## ${NEW_VERSION} (${DATE})\n\n${CHANGES}"
          if [ -f CHANGELOG.md ]; then
            EXISTING=$(cat CHANGELOG.md)
            printf "%b" "# Changelog\n\n${ENTRY}\n${EXISTING#"# Changelog"*$'\n'}" > CHANGELOG.md
          else
            printf "%b" "# Changelog\n\n${ENTRY}" > CHANGELOG.md
          fi

      - name: Commit version update
        if: ${{ inputs.version != 'current' }}
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add pubspec.yaml
          [ -f CHANGELOG.md ] && git add CHANGELOG.md
          "$GITHUB_WORKSPACE/scripts/sync-release-generated.sh"
          git commit -m "chore(release): flutter_inapp_purchase@${NEW_VERSION}"

      - name: Assert verified release head is unchanged
        if: ${{ inputs.version != 'current' || steps.check_tag.outputs.exists != 'true' }}
        run: node "$GITHUB_WORKSPACE/scripts/assert-release-head.mjs" "$RELEASE_BRANCH" "$GITHUB_SHA"

      - name: Tag only (current version)
        if: ${{ inputs.version == 'current' && steps.check_tag.outputs.exists != 'true' }}
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          RELEASE_TAG="flutter-iap-${NEW_VERSION}"
          git commit --allow-empty -m "chore: recover release ref"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"

      - name: Create release tag
        if: ${{ inputs.version != 'current' }}
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git tag -a "flutter-iap-${NEW_VERSION}" -m "Release flutter-iap-${NEW_VERSION}"

      - name: Write Flutter publish authorization
        if: ${{ steps.check_pub.outputs.exists == 'false' && steps.check_tag.outputs.exists != 'true' }}
        id: flutter_auth
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          RELEASE_TAG="flutter-iap-${NEW_VERSION}"
          TAG_SHA=$(git rev-parse "$RELEASE_TAG^{commit}")
          node "$GITHUB_WORKSPACE/scripts/npm-publish-authorization.mjs" write \
            "$RUNNER_TEMP/flutter-publish-authorization.json" \
            "$GITHUB_REPOSITORY" ".github/workflows/release-flutter.yml" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RELEASE_BRANCH" \
            "$GITHUB_SHA" "$RELEASE_TAG" "$TAG_SHA"
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload Flutter publish authorization
        if: ${{ steps.check_pub.outputs.exists == 'false' && steps.check_tag.outputs.exists != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-publish-authorization-${{ steps.flutter_auth.outputs.tag_sha }}
          path: ${{ runner.temp }}/flutter-publish-authorization.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Push commit and tag
        if: ${{ inputs.version != 'current' }}
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_UPDATE_PAT }}
        run: |
          gh auth setup-git
          git push --atomic origin "HEAD:$RELEASE_BRANCH" --follow-tags

      - name: Push tag (current version)
        if: ${{ inputs.version == 'current' && steps.check_tag.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_UPDATE_PAT }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh auth setup-git
          RELEASE_TAG="flutter-iap-${NEW_VERSION}"
          git push --atomic origin \
            "HEAD:refs/heads/$RELEASE_BRANCH" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

      - name: Wait for tag-push pub.dev publisher
        if: ${{ steps.check_pub.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: flutter-iap-${{ steps.bump.outputs.version }}
          TAG_ALREADY_EXISTED: ${{ steps.check_tag.outputs.exists }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          TAG_COMMIT=$(git rev-parse "$TAG^{commit}")
          if ! git -C "$GITHUB_WORKSPACE" grep -q "Verify release workflow authorization" "$TAG" -- \
               .github/workflows/publish-flutter.yml || \
             ! git -C "$GITHUB_WORKSPACE" cat-file -e "$TAG:scripts/npm-publish-authorization.mjs"; then
            echo "::error::$TAG predates the authorized tag-push publisher and cannot be retried safely"
            echo "::error::Release a new reviewed version instead of rerunning legacy publishing code"
            exit 1
          fi

          AUTHORIZATION_NAME="flutter-publish-authorization-$TAG_COMMIT"
          AUTHORIZATION_COUNT=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$AUTHORIZATION_NAME&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          if [ "$AUTHORIZATION_COUNT" -lt 1 ]; then
            echo "::error::No unexpired release authorization exists for $TAG at $TAG_COMMIT"
            echo "::error::Release a new reviewed version instead of bypassing the guarded release workflow"
            exit 1
          fi

          RUN_ID=""
          RUN_STATUS=""
          RUN_CONCLUSION=""

          for attempt in $(seq 1 30); do
            RUN_JSON=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/publish-flutter.yml/runs?event=push&head_sha=$TAG_COMMIT&per_page=20" \
              --jq ".workflow_runs | map(select(.head_branch == \"$TAG\" and .head_sha == \"$TAG_COMMIT\")) | sort_by(.created_at) | last // empty")
            RUN_ID=$(jq -r '.id // empty' <<< "$RUN_JSON")
            if [ -n "$RUN_ID" ]; then
              RUN_STATUS=$(jq -r '.status // empty' <<< "$RUN_JSON")
              RUN_CONCLUSION=$(jq -r '.conclusion // empty' <<< "$RUN_JSON")
              break
            fi
            sleep 10
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::No tag-push publish-flutter run exists for $TAG at $TAG_COMMIT"
            echo "::error::pub.dev rejects workflow_dispatch publishing, and immutable release tags must not be recreated"
            exit 1
          fi

          if [ "$TAG_ALREADY_EXISTED" = "true" ] && [ "$RUN_STATUS" = "completed" ] && [ "$RUN_CONCLUSION" != "success" ]; then
            echo "Rerunning original tag-push publisher run $RUN_ID for $TAG"
            gh run rerun "$RUN_ID"
          fi

          gh run watch "$RUN_ID" --exit-status

          for attempt in $(seq 1 30); do
            HTTP_STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" \
              "https://pub.dev/api/packages/flutter_inapp_purchase/versions/$VERSION" || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "flutter_inapp_purchase $VERSION is public on pub.dev"
              exit 0
            fi
            sleep 10
          done

          echo "::error::Publisher completed, but flutter_inapp_purchase $VERSION is not public on pub.dev"
          exit 1

      - name: Generate release notes
        id: release_notes
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          RELEASE_REF="HEAD"
          if git rev-parse "flutter-iap-$VERSION" >/dev/null 2>&1; then
            RELEASE_REF="flutter-iap-$VERSION"
          fi
          PREV_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' 'refs/tags/flutter-iap-*' | grep -v "$VERSION" | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG..$RELEASE_REF" --pretty=format:"- %s ([\`%h\`](https://github.com/hyodotdev/openiap/commit/%H))" -- ":(top)libraries/flutter_inapp_purchase/" ":(top)packages/google/" ":(top)packages/apple/")
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No direct code changes — picks up the latest openiap-google / openiap-apple native library updates. See the consolidated release notes for details."
          fi
          cat > /tmp/release-notes.md <<EOF
          ## flutter_inapp_purchase $VERSION

          Flutter plugin for the OpenIAP specification.

          ### What's Changed

          $CHANGELOG

          ### Installation

          \`\`\`yaml
          # pubspec.yaml
          dependencies:
            flutter_inapp_purchase: ^$VERSION
          \`\`\`

          \`\`\`bash
          flutter pub get
          \`\`\`

          ### Documentation

          - [Setup guide — Flutter](https://openiap.dev/docs/setup/flutter)
          - [API reference](https://openiap.dev/docs/apis)
          - [Release notes](https://openiap.dev/docs/updates/releases)

          ### Links

          - [pub.dev](https://pub.dev/packages/flutter_inapp_purchase/versions/$VERSION)
          - [GitHub (monorepo)](https://github.com/hyodotdev/openiap/tree/flutter-iap-$VERSION/libraries/flutter_inapp_purchase)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: flutter-iap-${{ steps.bump.outputs.version }}
          name: flutter_inapp_purchase ${{ steps.bump.outputs.version }}
          draft: false
          prerelease: ${{ steps.bump.outputs.is_prerelease }}
          body_path: /tmp/release-notes.md

      - name: Dispatch SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: flutter-iap-${{ steps.bump.outputs.version }}
        run: gh workflow run sbom.yml --ref main -f tag="$RELEASE_TAG"
