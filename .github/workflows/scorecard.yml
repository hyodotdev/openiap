name: "Security: Scorecard"

# OpenSSF Scorecard checks the security posture of the repository itself —
# branch protection, workflow token permissions, action pinning, dangerous
# workflow patterns, release signing.
#
# This is the one thing neither Dependabot nor the SBOM covers. Dependabot
# watches dependencies; the SBOM records what shipped; Scorecard checks whether
# the process that produced it is sound. It adds no code and no dependency —
# it reads the repository through the GitHub API.

on:
  branch_protection_rule:
  schedule:
    # Weekly, off the hour to avoid the scheduler's busiest minute.
    - cron: "37 5 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload results to the code-scanning dashboard.
      security-events: write
      # Publish results so the score is verifiable by third parties.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to the OpenSSF API so it can be cited as
          # evidence and shown as a badge. Requires the repository to be public.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: results.sarif
