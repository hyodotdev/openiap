name: "A. Release: react-native-iap"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - current
          - rc-bump
        default: patch
      prerelease:
        description: "Publish as prerelease from next (-rc.1)"
        required: false
        default: false
        type: boolean
      publish_only:
        description: "Internal: publish an existing release tag to npm"
        required: false
        default: false
        type: boolean
      source_run_id:
        description: "Internal: validated branch release workflow run"
        required: false
        default: ""
        type: string
      source_run_attempt:
        description: "Internal: validated branch release workflow attempt"
        required: false
        default: ""
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ inputs.publish_only && 'publish' || 'release' }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  release-branch:
    name: Validate release branch
    if: ${{ !inputs.publish_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enforce stable and prerelease branches
        env:
          VERSION_TYPE: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: >-
          node scripts/release-branch-policy.mjs guard react-native
          "$VERSION_TYPE" "$IS_PRERELEASE"
          "$GITHUB_REF_NAME"

  validate-android:
    needs: [release-branch]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError"'
    defaults:
      run:
        working-directory: libraries/react-native-iap
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Install Yarn 3
        run: corepack enable && corepack prepare yarn@3.6.1 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android library
        working-directory: libraries/react-native-iap/example/android
        run: ./gradlew :react-native-iap:assembleDebug --stacktrace

  validate-ios:
    needs: [release-branch]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      XCODE_VERSION: 16.4
    defaults:
      run:
        working-directory: libraries/react-native-iap
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          working-directory: libraries/react-native-iap/example

      - name: Install Yarn 3
        run: corepack enable && corepack prepare yarn@3.6.1 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cocoapods/repos/trunk
            libraries/react-native-iap/example/ios/Pods
          key: ${{ runner.os }}-pods-rniap-${{ hashFiles('libraries/react-native-iap/example/ios/Podfile.lock') }}

      - name: Install Ruby dependencies
        working-directory: libraries/react-native-iap/example
        run: BUNDLE_FROZEN=true bundle install

      - name: Install CocoaPods dependencies
        working-directory: libraries/react-native-iap/example/ios
        run: bundle exec pod install --repo-update

      - name: Build iOS library
        working-directory: libraries/react-native-iap/example/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace example.xcworkspace \
            -scheme example \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

  deploy:
    needs: [validate-android, validate-ios]
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/react-native-iap
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Preserve npm release verifiers
        run: |
          cp "$GITHUB_WORKSPACE/scripts/verify-npm-release-provenance.mjs" "$RUNNER_TEMP/verify-npm-release-provenance.mjs"
          cp "$GITHUB_WORKSPACE/scripts/npm-publish-authorization.mjs" "$RUNNER_TEMP/npm-publish-authorization.mjs"

      - name: Ensure npm CLI v11.19.0 for signature verification
        run: npm install -g npm@11.19.0

      - name: Setup Bun
        if: ${{ inputs.version != 'current' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Checkout release tag (current version)
        if: ${{ inputs.version == 'current' }}
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="react-native-iap-${NEW_VERSION}"
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            node "$GITHUB_WORKSPACE/scripts/assert-release-tag.mjs" \
              react-native "$RELEASE_BRANCH" "$RELEASE_TAG" "$NEW_VERSION"
            git checkout "$RELEASE_TAG"
          else
            echo "Tag $RELEASE_TAG does not exist; current mode will use HEAD."
          fi

      - name: Disable Corepack
        run: corepack disable

      - name: Install dependencies
        run: node .yarn/releases/yarn-3.6.1.cjs install --immutable

      - name: Lint
        run: |
          node .yarn/releases/yarn-3.6.1.cjs lint:tsc
          npx eslint --ext .ts,.tsx,.js,.jsx src

      - name: Configure Git user
        run: |
          git config user.name "react-native-iap bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          VERSION_TYPE: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$VERSION_TYPE" = "current" ]; then
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            if [[ "$NEW_VERSION" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "$VERSION_TYPE" = "rc-bump" ]; then
            npm version prerelease --preid=rc --no-git-tag-version
          elif [ "$IS_PRERELEASE" = "true" ]; then
            npm version "pre${VERSION_TYPE}" --preid=rc --no-git-tag-version
          else
            npm version "$VERSION_TYPE" --no-git-tag-version
          fi

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$NEW_VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release tag already exists
        id: check_tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          VERSION_TYPE: ${{ inputs.version }}
        run: |
          RELEASE_TAG="react-native-iap-${NEW_VERSION}"
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$VERSION_TYPE" = "current" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "⚠️ Tag $RELEASE_TAG already exists. Will reuse existing tag (current mode)."
            else
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "❌ Tag $RELEASE_TAG already exists. Use 'current' to retry this version."
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "✓ Tag $RELEASE_TAG does not exist"
          fi

      - name: Prepare package (build + codegen)
        run: node .yarn/releases/yarn-3.6.1.cjs prepare

      - name: Assert verified release head is unchanged
        if: ${{ inputs.version != 'current' || steps.check_tag.outputs.exists != 'true' }}
        run: node "$GITHUB_WORKSPACE/scripts/assert-release-head.mjs" "$RELEASE_BRANCH" "$GITHUB_SHA"

      - name: Check if npm package already published
        id: check_npm
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if NPM_OUTPUT=$(npm view "react-native-iap@$VERSION" version 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ react-native-iap@$VERSION already exists on npm"
          elif echo "$NPM_OUTPUT" | grep -qiE 'E404|404 Not Found'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "✓ react-native-iap@$VERSION does not exist, will publish"
          else
            echo "❌ Unable to verify react-native-iap@$VERSION on npm"
            echo "$NPM_OUTPUT"
            exit 1
          fi

      - name: Refuse an untagged published version
        if: ${{ steps.check_npm.outputs.exists == 'true' && steps.check_tag.outputs.exists != 'true' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          echo "❌ react-native-iap@$VERSION is published without a provenance tag; refusing to tag an unverified source"
          exit 1

      - name: Verify existing npm release provenance
        if: ${{ steps.check_npm.outputs.exists == 'true' && steps.check_tag.outputs.exists == 'true' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          RELEASE_TAG="react-native-iap-$VERSION"
          EXPECTED_COMMIT=$(git rev-parse "$RELEASE_TAG^{commit}")
          node "$RUNNER_TEMP/verify-npm-release-provenance.mjs" \
            react-native-iap "$VERSION" "$EXPECTED_COMMIT" "$RELEASE_TAG" \
            release-react-native.yml

      - name: Commit version update
        if: ${{ inputs.version != 'current' }}
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add package.json
          "$GITHUB_WORKSPACE/scripts/sync-release-generated.sh"
          git commit -m "chore(release): react-native-iap@${NEW_VERSION}"

      - name: Push commit and tags
        if: ${{ inputs.version != 'current' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh auth setup-git
          git tag -a "react-native-iap-${NEW_VERSION}" -m "Release react-native-iap-${NEW_VERSION}"
          git push --atomic origin "HEAD:$RELEASE_BRANCH" --follow-tags

      - name: Create tag (current version)
        if: ${{ inputs.version == 'current' && steps.check_tag.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh auth setup-git
          RELEASE_TAG="react-native-iap-${NEW_VERSION}"
          git commit --allow-empty -m "chore: recover release ref"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
          git push --atomic origin \
            "HEAD:refs/heads/$RELEASE_BRANCH" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

      - name: Require tag-ref npm publisher capability
        if: steps.check_npm.outputs.exists == 'false'
        env:
          TAG: react-native-iap-${{ steps.bump.outputs.version }}
        run: |
          if ! git -C "$GITHUB_WORKSPACE" grep -q '^  publish-npm:' "$TAG" -- .github/workflows/release-react-native.yml || \
             ! git -C "$GITHUB_WORKSPACE" grep -q 'Upload npm publish authorization' "$TAG" -- .github/workflows/release-react-native.yml || \
             ! git -C "$GITHUB_WORKSPACE" cat-file -e "$TAG:scripts/npm-publish-authorization.mjs"; then
            echo "::error::$TAG predates the tag-ref npm publisher and cannot be retried safely. Release a new reviewed version instead."
            exit 1
          fi

      - name: Write npm publish authorization
        if: steps.check_npm.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          RELEASE_TAG="react-native-iap-$VERSION"
          TAG_SHA=$(git rev-parse "$RELEASE_TAG^{commit}")
          node "$RUNNER_TEMP/npm-publish-authorization.mjs" write \
            "$RUNNER_TEMP/npm-publish-authorization.json" \
            "$GITHUB_REPOSITORY" ".github/workflows/release-react-native.yml" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RELEASE_BRANCH" \
            "$GITHUB_SHA" "$RELEASE_TAG" "$TAG_SHA"

      - name: Upload npm publish authorization
        if: steps.check_npm.outputs.exists == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-publish-authorization-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-publish-authorization.json
          if-no-files-found: error
          retention-days: 1

      - name: Generate release notes
        id: release_notes
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          RELEASE_REF="HEAD"
          if git rev-parse "react-native-iap-$VERSION" >/dev/null 2>&1; then
            RELEASE_REF="react-native-iap-$VERSION"
          fi
          PREV_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' 'refs/tags/react-native-iap-*' | grep -v "$VERSION" | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG..$RELEASE_REF" --pretty=format:"- %s ([\`%h\`](https://github.com/hyodotdev/openiap/commit/%H))" -- ":(top)libraries/react-native-iap/" ":(top)packages/google/" ":(top)packages/apple/")
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No direct code changes — picks up the latest openiap-google / openiap-apple native library updates. See the consolidated release notes for details."
          fi
          cat > /tmp/release-notes.md <<EOF
          ## react-native-iap $VERSION

          React Native wrapper for the OpenIAP specification.

          ### What's Changed

          $CHANGELOG

          ### Installation

          \`\`\`bash
          npm install react-native-iap@$VERSION
          # or
          yarn add react-native-iap@$VERSION
          \`\`\`

          ### Documentation

          - [Setup guide — React Native](https://openiap.dev/docs/setup/react-native)
          - [API reference](https://openiap.dev/docs/apis)
          - [Release notes](https://openiap.dev/docs/updates/releases)

          ### Links

          - [npm](https://www.npmjs.com/package/react-native-iap/v/$VERSION)
          - [GitHub (monorepo)](https://github.com/hyodotdev/openiap/tree/react-native-iap-$VERSION/libraries/react-native-iap)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: react-native-iap-${{ steps.bump.outputs.version }}
          name: react-native-iap ${{ steps.bump.outputs.version }}
          draft: false
          prerelease: ${{ steps.bump.outputs.is_prerelease }}
          body_path: /tmp/release-notes.md

      - name: Dispatch SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: react-native-iap-${{ steps.bump.outputs.version }}
        run: gh workflow run sbom.yml --ref main -f tag="$RELEASE_TAG"

      # npm provenance reads the immutable workflow event GITHUB_SHA. Dispatch
      # this same trusted-publisher workflow on the tag so the event SHA, npm
      # package gitHead, and release tag all identify the same source commit.
      - name: Dispatch npm publish on tag ref
        if: steps.check_npm.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: react-native-iap-${{ steps.bump.outputs.version }}
        run: |
          gh workflow run release-react-native.yml --ref "$TAG" \
            -f version=current \
            -f publish_only=true \
            -f source_run_id="$GITHUB_RUN_ID" \
            -f source_run_attempt="$GITHUB_RUN_ATTEMPT"

  publish-npm:
    name: Publish npm from release tag
    if: ${{ inputs.publish_only }}
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/react-native-iap
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Require the matching release tag
        id: release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_REF="refs/tags/react-native-iap-$VERSION"
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "::error::npm publish must be dispatched on $EXPECTED_REF"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checked-out source does not match the workflow event SHA"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            SOURCE_BRANCH="next"
          else
            SOURCE_BRANCH="main"
          fi
          git fetch --no-tags origin "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$SOURCE_BRANCH"; then
            echo "::error::$EXPECTED_REF is not reachable from origin/$SOURCE_BRANCH"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Require successful source release run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ steps.release.outputs.source_branch }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || \
             ! [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A validated source release run id and attempt are required"
            exit 1
          fi
          for attempt in {1..12}; do
            SOURCE_RUN_JSON=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT")
            SOURCE_STATUS=$(jq -r '.status // ""' <<<"$SOURCE_RUN_JSON")
            if [ "$SOURCE_STATUS" = "completed" ]; then
              break
            fi
            sleep 5
          done
          SOURCE_PATH=$(jq -r '.path // ""' <<<"$SOURCE_RUN_JSON")
          SOURCE_EVENT=$(jq -r '.event // ""' <<<"$SOURCE_RUN_JSON")
          SOURCE_HEAD_BRANCH=$(jq -r '.head_branch // ""' <<<"$SOURCE_RUN_JSON")
          SOURCE_HEAD_SHA=$(jq -r '.head_sha // ""' <<<"$SOURCE_RUN_JSON")
          SOURCE_RESPONSE_ATTEMPT=$(jq -r '.run_attempt // ""' <<<"$SOURCE_RUN_JSON")
          SOURCE_REPOSITORY=$(jq -r '.repository.full_name // ""' <<<"$SOURCE_RUN_JSON")
          SOURCE_CONCLUSION=$(jq -r '.conclusion // ""' <<<"$SOURCE_RUN_JSON")
          if [ "$SOURCE_STATUS" != "completed" ] || [ "$SOURCE_CONCLUSION" != "success" ]; then
            echo "::error::Source release run $SOURCE_RUN_ID did not complete successfully"
            exit 1
          fi
          if [ "$SOURCE_PATH" != ".github/workflows/release-react-native.yml" ] || \
             [ "$SOURCE_EVENT" != "workflow_dispatch" ] || \
             [ "$SOURCE_HEAD_BRANCH" != "$SOURCE_BRANCH" ] || \
             [ "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ] || \
             [ "$SOURCE_RESPONSE_ATTEMPT" != "$SOURCE_RUN_ATTEMPT" ]; then
            echo "::error::Source run does not match the required release workflow and branch"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_HEAD_SHA" "origin/$SOURCE_BRANCH"; then
            echo "::error::Source release run is not reachable from origin/$SOURCE_BRANCH"
            exit 1
          fi
          echo "head_sha=$SOURCE_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$SOURCE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Verify source run authorized this release tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ steps.release.outputs.source_branch }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          AUTHORIZATION_DIR="$RUNNER_TEMP/npm-publish-authorization"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "npm-publish-authorization-$SOURCE_RUN_ATTEMPT" \
            --dir "$AUTHORIZATION_DIR"
          node "$GITHUB_WORKSPACE/scripts/npm-publish-authorization.mjs" verify \
            "$AUTHORIZATION_DIR/npm-publish-authorization.json" \
            "$GITHUB_REPOSITORY" ".github/workflows/release-react-native.yml" \
            "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$SOURCE_BRANCH" \
            "$SOURCE_HEAD_SHA" "react-native-iap-$VERSION" "$GITHUB_SHA"

      - name: Ensure npm CLI v11.19.0 for OIDC and signature verification
        run: npm install -g npm@11.19.0

      - name: Disable Corepack
        run: corepack disable

      - name: Install dependencies
        run: node .yarn/releases/yarn-3.6.1.cjs install --immutable

      - name: Prepare package (build + codegen)
        run: node .yarn/releases/yarn-3.6.1.cjs prepare

      - name: Resolve symlinks for npm publish
        run: |
          if [ -L openiap-versions.json ]; then
            cp --remove-destination "$(readlink openiap-versions.json)" openiap-versions.json
          fi

      - name: Consumer install smoke test
        run: node .yarn/releases/yarn-3.6.1.cjs verify:consumer-install --pack-ignore-scripts

      - name: Check if npm package already published
        id: check_npm
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if NPM_OUTPUT=$(npm view "react-native-iap@$VERSION" version 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ react-native-iap@$VERSION already exists on npm"
          elif echo "$NPM_OUTPUT" | grep -qiE 'E404|404 Not Found'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "✓ react-native-iap@$VERSION does not exist, will publish"
          else
            echo "❌ Unable to verify react-native-iap@$VERSION on npm"
            echo "$NPM_OUTPUT"
            exit 1
          fi

      - name: Verify existing npm release provenance
        if: steps.check_npm.outputs.exists == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          RELEASE_TAG="react-native-iap-$VERSION"
          node "$GITHUB_WORKSPACE/scripts/verify-npm-release-provenance.mjs" \
            react-native-iap "$VERSION" "$GITHUB_SHA" "$RELEASE_TAG" \
            release-react-native.yml

      - name: Assert npm publish source is unchanged
        if: steps.check_npm.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/tags/react-native-iap-$VERSION" ] || \
             [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::npm publish source changed after release-tag validation"
            exit 1
          fi

      - name: Publish to npm with OIDC trusted publishing
        if: steps.check_npm.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag next --access public --provenance
          else
            npm publish --access public --provenance
          fi

      - name: Verify published npm release provenance
        if: steps.check_npm.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          RELEASE_TAG="react-native-iap-$VERSION"
          VERIFIED=false
          # npm can expose package metadata before its attestation endpoint is
          # ready. Allow five minutes for the immutable provenance to propagate.
          for attempt in {1..30}; do
            if node "$GITHUB_WORKSPACE/scripts/verify-npm-release-provenance.mjs" \
              react-native-iap "$VERSION" "$GITHUB_SHA" "$RELEASE_TAG" \
              release-react-native.yml; then
              VERIFIED=true
              break
            fi
            sleep 10
          done
          if [ "$VERIFIED" != "true" ]; then
            echo "::error::Published npm provenance did not become verifiable"
            exit 1
          fi
