name: CI

on:
  pull_request:
    branches:
      - main
      - next
  push:
    branches:
      - main
      - next

permissions:
  contents: read

# Cancel the superseded run on every PR push; main pushes always run to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit-release-state:
    name: Audit Release Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A PR's merge commit and its base, for the release note audit.
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Audit repository layout
        run: npm run audit:layout

      - name: Validate package version metadata
        run: node scripts/release-branch-policy.mjs audit

      # A PR compares against its base (HEAD^1 of the merge commit); a push, which can
      # carry several commits, against the main tip before it.
      - name: Audit plugin manifests
        env:
          PUSH_BASE: ${{ github.event_name == 'push' && !github.event.created && !github.event.forced && github.event.before || '' }}
        run: |
          node --test scripts/audit-plugin-manifests.test.mjs
          BASE=HEAD^1
          # A new or force-pushed branch has no comparable base; then HEAD^1 is used.
          if [ -n "$PUSH_BASE" ]; then
            if git fetch --no-tags --depth=1 origin "$PUSH_BASE"; then
              BASE="$PUSH_BASE"
            else
              echo "::warning::Could not fetch $PUSH_BASE; auditing plugin manifests against HEAD^1 only."
            fi
          fi
          node scripts/audit-plugin-manifests.mjs "$BASE"

      - name: Require a release note for published source changes
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          # Read labels now, not from the event, so a re-run sees one added later.
          LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name')
          if grep -qxF '፦ refactor' <<<"$LABELS"; then
            echo "Release note audit skipped: the PR is labeled ፦ refactor."
            exit 0
          fi
          case "$AUTHOR_ASSOCIATION" in
            OWNER | MEMBER | COLLABORATOR)
              node scripts/audit-release-notes.mjs HEAD^1
              ;;
            *)
              # Outside contributors cannot know the next version, so a
              # maintainer writes their release card.
              if ! OUTPUT=$(node scripts/audit-release-notes.mjs HEAD^1 2>&1); then
                printf '%s\n' "$OUTPUT" | sed 's/^::error::/::warning::/'
                echo "::warning::This change needs a release card; a maintainer will add it before merging."
              fi
              ;;
          esac

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install release test dependencies
        run: bun install --frozen-lockfile --filter openiap-monorepo --ignore-scripts

      - name: Test release automation
        run: >-
          node --test scripts/release-branch-policy.test.mjs
          scripts/audit-release-notes.test.mjs
          scripts/release-openiap.test.mjs
          scripts/release-flutter.test.mjs
          scripts/audit-release-sync-script.test.mjs
          scripts/provider-release-preflight.test.mjs
          scripts/npm-publish-authorization.test.mjs
          scripts/verify-npm-release-provenance.test.mjs
          scripts/generate-sbom.test.mjs
          scripts/generate-third-party-notices.test.mjs
          scripts/xml-document.test.mjs

      - name: Audit the release sync script
        run: node scripts/audit-release-sync-script.mjs

      - name: Test Gradle network retry helper
        run: node --test scripts/ci/retry-gradle.test.mjs

  audit-lockfile:
    name: Audit Lockfile Sync
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          min-wrapper-count: 7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby
        with:
          working-directory: libraries/react-native-iap/example

      - name: Verify bun.lock matches workspace manifests
        run: |
          # Retry bun install up to 3 times to handle transient registry errors
          for i in 1 2 3; do
            bun install --frozen-lockfile && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

      # This job installs with bun, which accepts an override that npm refuses.
      # Without this step a manifest can ship that breaks every npm and npx
      # command in the repository root.
      - name: Audit npm override compatibility
        run: bun run audit:overrides

      # security/SBOM.md restates the releasable component list for readers.
      # Without this the copy drifts, which is how commerce-protocol shipped an
      # SBOM artifact while the documented matrix said it did not exist.
      - name: Audit SBOM documentation
        run: bun run audit:sbom-docs

      # The godot-iap addon ships prebuilt iOS/macOS frameworks pinned in
      # prebuilt-binaries.sha256. The release gates on the same audit; this
      # re-runs it here so a tampered binary fails on the PR, not at release.
      - name: Audit Godot binary digests
        run: bun run audit:godot-binaries

      - name: Verify independent Bun locks
        run: |
          for directory in \
            libraries/expo-iap \
            libraries/expo-iap/example \
            libraries/expo-iap/example/vega \
            libraries/react-native-iap/example/vega \
            scripts/agent; do
            (cd "$directory" && bun install --frozen-lockfile --ignore-scripts)
          done

      - name: Verify Yarn lock
        run: cd libraries/react-native-iap && corepack yarn install --immutable --mode=skip-build

      - name: Verify Ruby locks
        run: |
          for directory in libraries/react-native-iap/example packages/apple; do
            (cd "$directory" && BUNDLE_FROZEN=true bundle install)
          done

      - name: Test dependency and workflow guards
        run: >-
          node --test scripts/audit-security.test.mjs
          scripts/bun-dependency-snapshot.test.mjs

      - name: Audit workflow security
        run: node scripts/audit-security.mjs workflows

      # shellcheck is off: existing run blocks still carry its findings.
      - name: Lint workflows with actionlint v1.7.12
        run: |
          scripts/install-security-tool.sh actionlint "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

      - name: Install OSV-Scanner v2.5.0
        run: |
          scripts/install-security-tool.sh osv-scanner "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Audit dependency vulnerabilities and exception lifecycle
        run: node scripts/audit-security.mjs dependencies

      - name: Audit all tracked dependency locks with OSV
        run: |
          osv-scanner scan source \
            --lockfile=bun.lock \
            --lockfile=libraries/expo-iap/bun.lock \
            --lockfile=libraries/expo-iap/example/bun.lock \
            --lockfile=libraries/expo-iap/example/vega/bun.lock \
            --lockfile=libraries/react-native-iap/example/vega/bun.lock \
            --lockfile=libraries/react-native-iap/example/Gemfile.lock \
            --lockfile=packages/apple/Gemfile.lock \
            --lockfile=libraries/react-native-iap/yarn.lock \
            --lockfile=scripts/agent/bun.lock

  # Detect which packages have changes. The filters that gated nothing before
  # still run their jobs on every push.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ github.event_name != 'pull_request' || steps.filter.outputs.agent }}
      commerce: ${{ github.event_name != 'pull_request' || steps.filter.outputs.commerce }}
      conformance: ${{ github.event_name != 'pull_request' || steps.filter.outputs.conformance }}
      deps: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps }}
      parity: ${{ github.event_name != 'pull_request' || steps.filter.outputs.parity }}
      gql: ${{ steps.filter.outputs.gql }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      docs: ${{ steps.filter.outputs.docs }}
      web: ${{ steps.filter.outputs.web }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Without this, '!' patterns are OR-ed positives that match nearly everything.
          predicate-quantifier: some-with-excludes
          filters: |
            agent:
              # The agent-context inputs and outputs in scripts/agent/context-files.ts,
              # plus the files scripts/agent/tests read.
              - 'scripts/agent/**'
              - '.claude/commands/review-pr.md'
              - '.claude/skills/openiap-workflows/SKILL.md'
              - '.codex/skills/openiap-workflows/SKILL.md'
              - '.codex/skills/review-self/SKILL.md'
              - '.husky/pre-commit'
              - 'packages/kit/public/llms.txt'
              - 'scripts/delete-review-automation-comments.mjs'
              - 'scripts/assert-clean-worktree.mjs'
              - 'package.json'
              - 'bun.lock'
              - 'openiap-versions.json'
              - 'packages/docs/src/generated/version-metadata.json'
              - 'specs/commerce-protocol/SPEC.md'
              - 'packages/docs/community-touchpoints.json'
              - 'knowledge/internal/**'
              - 'knowledge/external/**'
              - 'knowledge/_agent-context/**'
              - 'knowledge/_claude-context'
              - 'packages/docs/public/llms.txt'
              - 'packages/docs/public/llms-full.txt'
              - 'llms.txt'
              - 'llms-full.txt'
              - '.github/workflows/ci.yml'
            commerce:
              - 'specs/commerce-protocol/**'
              - 'packages/kit/**'
              - 'packages/mcp-server/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            conformance:
              # The suites in every language whose behavior ids it checks.
              - 'packages/conformance/**'
              - 'packages/apple/Tests/OpenIapTests/ConformanceBehaviors.swift'
              - 'packages/apple/Tests/OpenIapTests/StoreConformanceTests.swift'
              - 'packages/apple/compatibility/community-provider/Tests/FixtureProviderTests/FixtureProviderTests.swift'
              - 'packages/google/compatibility/community-provider/provider/src/test/java/community/fixture/FixtureConformanceTest.kt'
              - 'packages/kit/convex/webhooks/conformance.test.ts'
              - 'libraries/react-native-iap/src/__tests__/conformance.test.ts'
              - 'libraries/expo-iap/src/__tests__/conformance.test.ts'
              - 'specs/client/package.json'
              - 'specs/client/src/capability-matrix.mjs'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            deps:
              - '**/package.json'
              - '**/bun.lock'
              - '**/yarn.lock'
              - '**/Gemfile'
              - '**/Gemfile.lock'
              - '**/osv-scanner.toml'
              - '**/gradle-wrapper.jar'
              - 'libraries/react-native-iap/.yarnrc.yml'
              - 'libraries/react-native-iap/.yarn/**'
              # Godot binary digests and the files the guard tests read.
              - 'libraries/godot-iap/prebuilt-binaries.sha256'
              - 'libraries/godot-iap/addons/godot-iap/bin/**'
              - 'libraries/godot-iap/addons/godot-iap/android/**'
              - 'libraries/kmp-iap/native/InAppPurchaseBridge/**'
              - 'libraries/expo-iap/example/scripts/build-vega-example.mjs'
              - 'libraries/react-native-iap/example/scripts/build-vega-example.mjs'
              - 'packages/kit/Dockerfile'
              - '.claude/commands/audit-security.md'
              - '.github/**'
              - 'scripts/**'
              - 'security/**'
            parity:
              # The SDK parity audit reads code, docs, and agent surfaces across the tree.
              - '.claude/**'
              - '.codecov.yml'
              - '.codecov.yaml'
              - 'codecov.yaml'
              - 'dev/**'
              - 'llms.txt'
              - 'llms-full.txt'
              - '.codex/**'
              - '.gemini/**'
              - '.github/**'
              - '.gitignore'
              - 'AGENTS.md'
              - 'CHANGELOG.md'
              - 'CLAUDE.md'
              - 'CODE_OF_CONDUCT.md'
              - 'CONTRIBUTING.md'
              - 'GEMINI.md'
              - 'MAINTAINERS.md'
              - 'README.md'
              - 'SECURITY.md'
              - 'codecov.yml'
              - 'openiap-versions.json'
              - 'package.json'
              - 'knowledge/**'
              - 'libraries/**'
              - 'packages/**'
              - 'plugins/**'
              - 'scripts/**'
              - 'security/**'
              - 'specs/**'
            gql:
              - '.github/workflows/release-openiap.yml'
              - 'specs/client/**'
              - 'packages/conformance/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'openiap-versions.json'
              - '.github/workflows/ci.yml'
              - 'libraries/maui-iap/src/OpenIap.Maui/Types.cs'
              - '!**/*.md'
            android:
              - 'packages/google/**'
              - '.java-version'
              - 'packages/conformance/**'
              - 'specs/client/**'
              - 'scripts/**'
              - 'openiap-versions.json'
              - '.github/workflows/ci.yml'
              - '!**/*.md'
            ios:
              - 'packages/apple/**'
              - '.github/actions/setup-xcode/**'
              - 'packages/conformance/apple/**'
              - 'packages/conformance/src/spec/**'
              - 'packages/conformance/scripts/**'
              - 'Package.swift'
              - 'specs/client/**'
              - 'scripts/**'
              - 'openiap-versions.json'
              - '.github/workflows/ci.yml'
              - '!**/*.md'
            docs:
              - 'packages/docs/**'
              # Docs import the showcase schema and handler from the MCP server.
              - 'packages/mcp-server/**'
              - 'specs/client/src/generated/**'
              - 'specs/client/generated-sync-manifest.mjs'
              # The docs link to the canonical contract and audit its derived
              # transport constants, so every protocol change must run this job.
              - 'specs/commerce-protocol/**'
              - 'scripts/audit-docs.ts'
              - 'scripts/audit-docs.test.ts'
              - '.github/workflows/ci.yml'
            web:
              - 'packages/docs/**'
              - 'packages/kit/**'
              - 'packages/mcp-server/**'
              # The kit server embeds the generated protocol artifacts at build
              # time, so a spec change must rebuild and probe the binary.
              - 'specs/commerce-protocol/**'
              - 'scripts/e2e-web-sites.mjs'
              - 'scripts/audit-commerce-evidence.mjs'
              - 'scripts/audit-commerce-evidence.test.mjs'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            cli:
              # The suite reads packages/cli/README.md as a contract input, so
              # a README edit has to run it.
              - 'packages/cli/**'
              - 'packages/docs/community-touchpoints.json'
              - 'scripts/release-openiap.mjs'
              - 'scripts/release-openiap.test.mjs'
              - 'scripts/release-branch-policy.mjs'
              - '.github/workflows/release-openiap.yml'
              - '.github/workflows/ci.yml'
              - 'bun.lock'
  test-cli:
    name: Test CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Exercise the oldest supported Node version.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile --filter @hyodotdev/openiap --ignore-scripts

      - name: Run CLI tests
        working-directory: packages/cli
        run: npm test

      # The repository-wide bin/ rule would stop `git add` from tracking the
      # executable at all, so it would be missing from a publish checkout.
      - name: The published tarball carries the executable
        working-directory: packages/cli
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const [{files}] = require('./pack.json');
            if (!files.some((one) => one.path === 'bin/openiap.mjs')) {
              throw new Error('bin/openiap.mjs is not in the tarball');
            }
          "
          rm pack.json

      - name: The executable loads
        run: node packages/cli/bin/openiap.mjs --help

      - name: The doctor exits 1 on a project it proves is broken
        run: |
          mkdir -p /tmp/doctor-fixture/android/app
          printf 'openiapStore=play\n' \
            > /tmp/doctor-fixture/android/gradle.properties
          printf 'missingDimensionStrategy "platform", "horizon"\n' \
            > /tmp/doctor-fixture/android/app/build.gradle
          if node packages/cli/bin/openiap.mjs doctor /tmp/doctor-fixture; then
            echo "expected a non-zero exit for a mismatched flavor" >&2
            exit 1
          fi

  test-commerce-protocol:
    name: Test Commerce Protocol
    needs: changes
    if: needs.changes.outputs.commerce == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            bun install --frozen-lockfile && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

      # Compiles the canonical SDL and byte-compares every generated artifact,
      # so an SDL edit that was not rebuilt cannot ship stale validators.
      - name: Run spec suite
        working-directory: specs/commerce-protocol
        run: bun run test

      - name: Verify IAPKit conformance
        working-directory: packages/kit
        # The payload conformance proof plus the dual-binding runner pass over
        # the real REST and GraphQL adapters.
        run: bunx vitest run convex/commerce/spec.conformance.test.ts server/api/commerce/

  test-conformance:
    name: Test Conformance Suite
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            bun install --frozen-lockfile && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

      - name: Run conformance suite tests
        working-directory: packages/conformance
        run: bun run test

      - name: Verify cross-language behavior ids are in sync
        run: node packages/conformance/scripts/generate-behavior-ids.mjs --check

      - name: Reference conformance report
        run: node packages/conformance/scripts/run-reference-report.mjs

      - name: Ecosystem coverage report
        run: |
          node packages/conformance/scripts/coverage-report.mjs
          node packages/conformance/scripts/coverage-report.mjs --json > conformance-coverage.json
          node packages/conformance/scripts/run-reference-report.mjs --json > conformance-report.json

      - name: Upload conformance report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: |
            conformance-report.json
            conformance-coverage.json
          if-no-files-found: error

  audit-parity:
    name: Audit SDK Parity
    needs: changes
    if: needs.changes.outputs.parity == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # 22 strips types, so the path-filter audit can import context-files.ts.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install parity audit dependencies
        run: |
          # The root parity scripts use root devDependencies (for example,
          # TypeScript) as well as client-spec workspace tooling. Install both scopes
          # so Node can resolve them without installing unrelated workspaces.
          for i in 1 2 3; do
            bun install --frozen-lockfile \
              --filter openiap-monorepo \
              --filter @hyodotdev/openiap-client-protocol && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

      - name: Test clean-worktree drift guard
        run: node --test scripts/assert-clean-worktree.test.mjs

      - name: Test review-thread listing
        run: node --test scripts/list-review-threads.test.mjs

      - name: Test review-automation comment sweep
        run: node --test scripts/delete-review-automation-comments.test.mjs

      - name: Test pull request guard
        run: node --test scripts/guard-pull-request.test.mjs

      - name: Sync generated version files
        run: ./scripts/sync-versions.sh

      - name: Verify version and generated synchronization is committed
        run: node scripts/assert-clean-worktree.mjs

      - name: Test community touchpoint audit
        run: node --test scripts/audit-community-touchpoints.test.mjs

      - name: Run non-Godot SDK parity audit
        run: node scripts/audit-non-godot-parity.mjs

      # Kit and the spec deploy on separate workflows, so check their contract here.
      - name: Test IAPKit spec contract audit
        run: node --test scripts/audit-kit-spec-contract.test.mjs

      - name: Run IAPKit spec contract audit
        run: node scripts/audit-kit-spec-contract.mjs

      - name: Audit CI path filters
        run: npm run audit:ci-paths

      - name: Audit agent surfaces
        run: npm run audit:agents

      - name: Audit sponsor surfaces
        run: npm run audit:sponsors

      - name: Audit orphan release tags
        run: npm run audit:orphan-tags

  test-gql:
    name: Test OpenIAP Client Spec
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.gql == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history so the schema semver audit compares against the
          # merge base, not the moving base-branch tip.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          # Retry bun install up to 3 times to handle transient registry errors
          for i in 1 2 3; do
            bun install --frozen-lockfile && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

      - name: Generate types
        working-directory: specs/client
        run: bun run generate

      # The generated-wire test compiles Dart and C# output alongside Swift.
      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: stable
          version: "3.44.9"
          cache: true
          cache-sdk: true

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        working-directory: specs/client
        env:
          OPENIAP_WIRE_TOOLCHAINS: required
        run: bun run test

      # Breaking-change guard for the schema (knowledge/research backlog R1).
      # PR-only: after merge the base comparison is no longer actionable.
      - name: Audit schema semver claims
        if: github.event_name == 'pull_request'
        working-directory: specs/client
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bun run audit:schema-semver -- --base "origin/$BASE_REF"

      - name: Verify generated types are committed (no drift)
        run: node scripts/assert-clean-worktree.mjs

  # test-gql owns client-spec regeneration, platform sync, and worktree drift
  # check. Consumer jobs compile the committed copies instead of invoking a
  # second generator path.
  test-android:
    name: Test Android
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version-file: .java-version

      - name: Grant execute permission
        working-directory: packages/google
        run: chmod +x gradlew

      - name: Run tests
        working-directory: packages/google
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew :openiap-core:test :openiap:test

      - name: Check core API compatibility
        working-directory: packages/google
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew :openiap-core:apiCheck

      - name: Build Play flavor
        working-directory: packages/google
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew :openiap:assemblePlayDebug

      - name: Build Horizon flavor
        working-directory: packages/google
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew :openiap:assembleHorizonDebug

      # The audit checks that the Example declares the app id; only the merged
      # manifest shows what the build actually resolved it to. Without this a
      # blank or missing property merges an empty value, which compiles and
      # installs and then throws inside startConnection on a headset.
      - name: Verify Horizon app id resolves in the merged manifest
        working-directory: packages/google
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew :Example:processHorizonDebugManifest
          node "$GITHUB_WORKSPACE/scripts/verify-horizon-merged-manifest.mjs" \
            Example/build/intermediates/merged_manifests/horizonDebug/processHorizonDebugManifest/AndroidManifest.xml

      - name: Build Fire OS flavor
        working-directory: packages/google
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew :openiap:assembleAmazonDebug

      - name: Verify independent community provider and minified host
        working-directory: packages/google
        run: bash scripts/verify-community-provider.sh

      - name: Verify Kotlin 2.1 consumer compatibility
        working-directory: packages/google
        run: bash scripts/verify-kotlin-2.1-consumer.sh

      # A wrong store is invisible until the artifact reaches a device, so the
      # selection rule is asserted here rather than on hardware.
      - name: Verify the store resolver
        working-directory: packages/google
        run: bash scripts/verify-store-resolver.sh

      # The plugin carries that rule to apps linking the published artifacts.
      - name: Verify the store plugin
        working-directory: packages/google
        run: bash scripts/verify-store-plugin.sh

      # Nothing above runs R8; an app's release build does.
      - name: Verify minified release builds per store
        working-directory: packages/google
        run: bash scripts/verify-release-consumer.sh

      # Run every store flavor so flavor-specific API-23 regressions cannot
      # bypass lint coverage.
      - name: Lint Android API compatibility
        working-directory: packages/google
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew \
            :openiap:lintPlayDebug \
            :openiap:lintHorizonDebug \
            :openiap:lintAmazonDebug

  test-ios:
    name: Test iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Build
        working-directory: packages/apple
        run: swift build

      - name: Run tests
        working-directory: packages/apple
        run: swift test

      - name: Verify public provider contract and conformance
        run: |
          swift build --target OpenIapConformance
          swift test --package-path packages/apple/compatibility/community-provider
          swift run --package-path packages/apple/compatibility/community-provider/consumer -c release FixtureConsumer

  test-ios-compiler-boundaries:
    name: Build iOS guard boundary (Xcode ${{ matrix.xcode-version }})
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode-version: "16.3"
          - runner: macos-26
            xcode-version: "26.0.1"
          - runner: macos-26
            xcode-version: "26.4.1"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Build in Swift 5 language mode
        working-directory: packages/apple
        run: swift build -Xswiftc -swift-version -Xswiftc 5

  test-docs:
    name: Test Docs
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          # Retry bun install up to 3 times to handle transient registry errors
          for i in 1 2 3; do
            bun install --frozen-lockfile && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

      - name: Type check
        working-directory: packages/docs
        run: bun run typecheck

      - name: Audit docs consistency
        run: |
          bun test scripts/audit-docs.test.ts
          bun run audit:docs

      - name: Check static discovery guards
        working-directory: packages/docs
        run: bun run test:discoverability

      - name: Test showcase API and metrics
        working-directory: packages/docs
        run: |
          bun run test:showcase
          bun run showcase:metrics:test

      - name: Lint
        working-directory: packages/docs
        run: bun run lint

      - name: Format check
        working-directory: packages/docs
        run: bunx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Build
        working-directory: packages/docs
        run: bun run build

  web-e2e:
    name: Web E2E Quality
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          # Retry bun install up to 3 times to handle transient registry errors
          for i in 1 2 3; do
            bun install --frozen-lockfile && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

      - name: Install Playwright chromium
        # `--with-deps` runs apt, which fails whenever Google's Chrome
        # repository serves a stale index. Playwright downloads its own
        # chromium, so drop that source first: nothing here needs it.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          bunx playwright install --with-deps chromium

      - name: Build docs site
        working-directory: packages/docs
        run: bun run build

      - name: Build IAPKit site and server
        working-directory: packages/kit
        env:
          VITE_KIT_CONVEX_URL: https://placeholder-build-1.convex.cloud
        run: bun run build:all

      - name: Test the Commerce evidence audit
        run: bun test ./scripts/audit-commerce-evidence.test.mjs

      - name: Report Commerce evidence freshness
        # Advisory: the recorded IAPKit interop stays valid for its recorded
        # revision; drift only means the guide shows older sources than main.
        continue-on-error: true
        run: bun run audit:commerce-evidence

      - name: Run docs and IAPKit web E2E
        env:
          WEB_E2E_DOCS_BASE_URL: http://127.0.0.1:4173
          WEB_E2E_KIT_BASE_URL: http://127.0.0.1:4174
        run: |
          (cd packages/docs && bunx vite preview --host 127.0.0.1 --port 4173) &
          docs_pid=$!
          (cd packages/kit && CONVEX_URL=https://placeholder-build-1.convex.cloud STATIC_ROOT=dist PORT=4174 ./openiap-kit-server) &
          kit_pid=$!
          cleanup() {
            kill "$docs_pid" "$kit_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for url in http://127.0.0.1:4173 http://127.0.0.1:4174; do
            for attempt in $(seq 1 60); do
              if curl -fsS "$url" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "::error::$url did not become ready"
                exit 1
              fi
              sleep 1
            done
          done
          bun run e2e:web

  test-agent:
    name: Test Agent Scripts
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
