name: CI

on:
  pull_request:
    branches:
      - main
      - next
  push:
    branches:
      - main
      - next

env:
  XCODE_VERSION: 16.4

jobs:
  audit-release-state:
    name: Audit Release Branch State
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Reject prerelease metadata on main
        run: node scripts/release-branch-policy.mjs audit

      - name: Test release branch policy
        run: node --test scripts/release-branch-policy.test.mjs

      - name: Test Gradle network retry helper
        run: node --test scripts/ci/retry-gradle.test.mjs

  # The test jobs below install with --frozen-lockfile but only run when
  # their path filters match, so a workspace package.json change outside
  # those paths can land with a stale bun.lock. Run the check on every CI
  # run to catch lockfile drift regardless of which paths changed.
  audit-lockfile:
    name: Audit Lockfile Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Verify bun.lock matches workspace manifests
        run: |
          # Retry bun install up to 3 times to handle transient registry errors
          for i in 1 2 3; do
            bun install --frozen-lockfile && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

  # Detect which packages have changes
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      gql: ${{ steps.filter.outputs.gql }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      docs: ${{ steps.filter.outputs.docs }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            gql:
              - 'packages/gql/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'openiap-versions.json'
              - '.github/workflows/ci.yml'
              - 'libraries/maui-iap/src/OpenIap.Maui/Types.cs'
            android:
              - 'packages/google/**'
              - 'packages/gql/**'
              - 'scripts/**'
              - 'openiap-versions.json'
              - '.github/workflows/ci.yml'
            ios:
              - 'packages/apple/**'
              - 'packages/gql/**'
              - 'scripts/**'
              - 'openiap-versions.json'
              - '.github/workflows/ci.yml'
            docs:
              - 'packages/docs/**'
              - 'packages/gql/src/generated/**'
              - 'packages/gql/generated-sync-manifest.mjs'
              - 'scripts/audit-docs.ts'
              - 'scripts/audit-docs.test.ts'
              - '.github/workflows/ci.yml'
            web:
              - 'packages/docs/**'
              - 'packages/kit/**'
              - 'scripts/e2e-web-sites.mjs'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
  audit-parity:
    name: Audit SDK Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install parity audit dependencies
        run: |
          # The root parity scripts use root devDependencies (for example,
          # TypeScript) as well as GQL workspace tooling. Install both scopes
          # so Node can resolve them without installing unrelated workspaces.
          for i in 1 2 3; do
            bun install --frozen-lockfile \
              --filter @hyodotdev/openiap \
              --filter @hyodotdev/openiap-gql && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

      - name: Test clean-worktree drift guard
        run: node --test scripts/assert-clean-worktree.test.mjs

      - name: Sync generated version files
        run: ./scripts/sync-versions.sh

      - name: Verify version and generated synchronization is committed
        run: node scripts/assert-clean-worktree.mjs

      - name: Run non-Godot SDK parity audit
        run: node scripts/audit-non-godot-parity.mjs

  test-gql:
    name: Test GQL Types
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.gql == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: |
          # Retry bun install up to 3 times to handle transient registry errors
          for i in 1 2 3; do
            bun install --frozen-lockfile && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

      - name: Generate types
        working-directory: packages/gql
        run: bun run generate

      - name: Run tests
        working-directory: packages/gql
        run: bun run test

      - name: Verify generated types are committed (no drift)
        run: node scripts/assert-clean-worktree.mjs

  # test-gql owns regeneration, platform sync, and the clean-worktree drift
  # check. Consumer jobs compile the committed copies instead of invoking a
  # second generator path.
  test-android:
    name: Test Android
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission
        working-directory: packages/google
        run: chmod +x gradlew

      - name: Run tests
        working-directory: packages/google
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew :openiap:test

      - name: Build Play flavor
        working-directory: packages/google
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew :openiap:assemblePlayDebug

      - name: Build Horizon flavor
        working-directory: packages/google
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew :openiap:assembleHorizonDebug

      - name: Build Fire OS flavor
        working-directory: packages/google
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew :openiap:assembleAmazonDebug

      # Play lint covers the shared API-23 source set, and Horizon lint covers
      # its flavor-specific implementation. Amazon lint currently crashes in
      # the upstream Compose detector on Kotlin metadata 2.2; audit:parity
      # guards the known API-24 set factory across every minSdk-23 source tree.
      - name: Lint Android API compatibility
        working-directory: packages/google
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew \
            :openiap:lintPlayDebug \
            :openiap:lintHorizonDebug

  test-ios:
    name: Test iOS
    runs-on: macos-15
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build
        working-directory: packages/apple
        run: swift build

      - name: Run tests
        working-directory: packages/apple
        run: swift test

  test-docs:
    name: Test Docs
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: |
          # Retry bun install up to 3 times to handle transient registry errors
          for i in 1 2 3; do
            bun install --frozen-lockfile && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

      - name: Type check
        working-directory: packages/docs
        run: bun run typecheck

      - name: Audit docs consistency
        run: |
          bun test scripts/audit-docs.test.ts
          bun run audit:docs

      - name: Lint
        working-directory: packages/docs
        run: bun run lint

      - name: Format check
        working-directory: packages/docs
        run: bunx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Build
        working-directory: packages/docs
        run: bun run build

  web-e2e:
    name: Web E2E Quality
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: |
          # Retry bun install up to 3 times to handle transient registry errors
          for i in 1 2 3; do
            bun install --frozen-lockfile && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: Build docs site
        working-directory: packages/docs
        run: bun run build

      - name: Build IAPKit site and server
        working-directory: packages/kit
        env:
          VITE_KIT_CONVEX_URL: https://placeholder-build-1.convex.cloud
        run: bun run build:all

      - name: Run docs and IAPKit web E2E
        env:
          WEB_E2E_DOCS_BASE_URL: http://127.0.0.1:4173
          WEB_E2E_KIT_BASE_URL: http://127.0.0.1:4174
        run: |
          (cd packages/docs && bunx vite preview --host 127.0.0.1 --port 4173) &
          docs_pid=$!
          (cd packages/kit && CONVEX_URL=https://placeholder-build-1.convex.cloud STATIC_ROOT=dist PORT=4174 ./openiap-kit-server) &
          kit_pid=$!
          cleanup() {
            kill "$docs_pid" "$kit_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for url in http://127.0.0.1:4173 http://127.0.0.1:4174; do
            for attempt in $(seq 1 60); do
              if curl -fsS "$url" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "::error::$url did not become ready"
                exit 1
              fi
              sleep 1
            done
          done
          bun run e2e:web

  test-agent:
    name: Test Agent Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        working-directory: scripts/agent
        run: |
          # Retry bun install up to 3 times to handle transient registry errors
          for i in 1 2 3; do
            bun install --frozen-lockfile && break
            [ $i -eq 3 ] && exit 1
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done

      - name: Type check
        working-directory: scripts/agent
        run: bun run typecheck

      - name: Run tests
        working-directory: scripts/agent
        run: bun test

      - name: Compile generated agent context
        working-directory: scripts/agent
        run: bun run compile:ai

      - name: Verify compiled agent context is committed
        run: node scripts/assert-clean-worktree.mjs
