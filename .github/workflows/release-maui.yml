name: "A. Release: maui-iap"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - current
          - rc-bump
        default: patch
      prerelease:
        description: "Publish as prerelease from next (-rc.1)"
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  XCODEGEN_VERSION: 2.45.4
  XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
  APP_STORE_XCODE_VERSION: "26.6"
  APP_STORE_SDK_VERSION: "26.5"
  APP_STORE_LD_VERSION: "1267.0"
  RELEASE_BRANCH: ${{ github.ref_name }}

jobs:
  release-branch:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enforce stable and prerelease branches
        env:
          VERSION_TYPE: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: >-
          node scripts/release-branch-policy.mjs guard maui
          "$VERSION_TYPE" "$IS_PRERELEASE"
          "$GITHUB_REF_NAME"

  validate:
    needs: [release-branch]
    name: Validate (net10.0 shared)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      # The shared `net10.0` build catches Types.cs / public-API regressions
      # without needing the MAUI / android / ios workloads. Two things make
      # this work — see ci-maui-iap.yml for the same pattern with details.
      # Note: `-p:TargetFrameworks=...` is PLURAL (overrides the project's
      # multi-target list); the singular `-p:TargetFramework=...` and `-f`
      # leave the implicit restore walking all TFMs.
      - name: Build library (shared)
        run: dotnet build libraries/maui-iap/src/OpenIap.Maui/OpenIap.Maui.csproj -p:TargetFrameworks=net10.0

      - name: Run contract tests (shared)
        run: dotnet run --project libraries/maui-iap/tests/OpenIap.Maui.ContractTests/OpenIap.Maui.ContractTests.csproj --framework net10.0 -p:TargetFrameworks=net10.0 --no-launch-profile

      - name: Run unit tests (shared)
        run: dotnet test libraries/maui-iap/tests/OpenIap.Maui.Tests/OpenIap.Maui.Tests.csproj -p:TargetFrameworks=net10.0 --nologo

  validate-multitarget:
    needs: [release-branch]
    name: Validate (net10.0 platform TFMs)
    # Keep the upcoming SDK as a source-compatibility lane. The publish job
    # separately rebuilds the packaged Apple sidecar with the stable App Store
    # toolchain.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-sign-check

      - name: Install xcodegen
        run: bash scripts/install-xcodegen.sh "$XCODEGEN_VERSION"

      # Native artifacts must exist before the binding csprojs can compile.
      - name: Build OpenIAP.xcframework (Apple)
        run: bash packages/apple/scripts/build-xcframework.sh

      - name: Build Play AAR (Google)
        working-directory: packages/google
        run: ./gradlew :openiap:assemblePlayRelease

      - name: Build MAUI Android module AAR
        working-directory: libraries/maui-iap/android
        run: ../../../packages/google/gradlew :openiap:assembleRelease

      # OpenIap.Maui.csproj includes net10.0-android, net10.0-ios, and
      # net10.0-maccatalyst.
      - name: Build all target frameworks
        run: dotnet build libraries/maui-iap/src/OpenIap.Maui/OpenIap.Maui.csproj

  publish:
    needs: [validate, validate-multitarget]
    permissions:
      actions: write
      contents: write
    # Rebuild the exact native sidecar packed into NuGet with an App Store
    # submission toolchain. Xcode 27 remains validation-only until Apple
    # accepts its SDK for App Store uploads.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up App Store Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.APP_STORE_XCODE_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-sign-check

      - name: Install xcodegen
        run: bash scripts/install-xcodegen.sh "$XCODEGEN_VERSION"

      - name: Calculate new version
        id: version
        env:
          VERSION_TYPE: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          CSPROJ=libraries/maui-iap/src/OpenIap.Maui/OpenIap.Maui.csproj
          CURRENT_VERSION=$(sed -n -E 's|.*<PackageVersion>([^<]+)</PackageVersion>.*|\1|p' "$CSPROJ" | head -n 1)
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION=$(sed -n -E 's|.*<Version>([^<]+)</Version>.*|\1|p' "$CSPROJ" | head -n 1)
          fi
          if [ -z "$CURRENT_VERSION" ]; then
            echo "❌ Unable to read MAUI package version from $CSPROJ"
            exit 1
          fi
          echo "Current version: $CURRENT_VERSION"

          BASE_VERSION="${CURRENT_VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          if [ "$VERSION_TYPE" = "current" ]; then
            NEW_VERSION="$CURRENT_VERSION"
            echo "Using current version (no bump): $NEW_VERSION"
            echo "skip_version_commit=true" >> $GITHUB_OUTPUT
          elif [ "$VERSION_TYPE" = "rc-bump" ]; then
            RC_NUM=$(echo "$CURRENT_VERSION" | sed -n 's/.*-rc\.\([0-9]*\)/\1/p')
            if [ -z "$RC_NUM" ]; then
              echo "::error::Current version $CURRENT_VERSION is not an rc version."
              exit 1
            fi
            NEW_VERSION="${BASE_VERSION}-rc.$((RC_NUM + 1))"
          elif [ "$IS_PRERELEASE" = "true" ]; then
            case "$VERSION_TYPE" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-rc.1"
          else
            IS_RC=$(echo "$CURRENT_VERSION" | grep -c '\-rc\.' || true)
            if [ "$IS_RC" -gt 0 ] && [ "$VERSION_TYPE" = "patch" ]; then
              NEW_VERSION="${BASE_VERSION}"
            else
              case "$VERSION_TYPE" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                patch) PATCH=$((PATCH + 1)) ;;
              esac
              NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          if [[ "$NEW_VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if tag already exists
        id: check_tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SKIP_VERSION_COMMIT: ${{ steps.version.outputs.skip_version_commit }}
        run: |
          if git rev-parse "maui-iap-$VERSION" >/dev/null 2>&1; then
            if [ "$SKIP_VERSION_COMMIT" = "true" ]; then
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "⚠️ Tag maui-iap-$VERSION already exists. Will reuse existing tag (current mode)."
            else
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "❌ Tag maui-iap-$VERSION already exists. Use 'current' to retry with existing version."
              exit 1
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✓ Tag maui-iap-$VERSION does not exist, proceeding with release"
          fi

      - name: Verify current release tag provenance
        if: steps.version.outputs.skip_version_commit == 'true' && steps.check_tag.outputs.exists == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RELEASE_TAG="maui-iap-$VERSION"
          node scripts/assert-release-tag.mjs \
            maui "$RELEASE_BRANCH" "$RELEASE_TAG" "$VERSION"

      - name: Checkout release tag (current version)
        if: steps.version.outputs.skip_version_commit == 'true' && steps.check_tag.outputs.exists == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RELEASE_TAG="maui-iap-$VERSION"
          git checkout "$RELEASE_TAG"

      - name: Assert verified release head is unchanged
        if: ${{ steps.version.outputs.skip_version_commit != 'true' || steps.check_tag.outputs.exists != 'true' }}
        run: node "$GITHUB_WORKSPACE/scripts/assert-release-head.mjs" "$RELEASE_BRANCH" "$GITHUB_SHA"

      - name: Update package version in OpenIap.Maui.csproj
        if: steps.version.outputs.skip_version_commit != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CSPROJ=libraries/maui-iap/src/OpenIap.Maui/OpenIap.Maui.csproj
          if grep -q "<PackageVersion>" "$CSPROJ"; then
            sed -i '' -E "s|<PackageVersion>[^<]*</PackageVersion>|<PackageVersion>$VERSION</PackageVersion>|" "$CSPROJ"
          elif grep -q "<Version>" "$CSPROJ"; then
            sed -i '' -E "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" "$CSPROJ"
          else
            # Insert immediately after PackageId so package metadata stays grouped.
            awk -v ver="$VERSION" '
              !inserted && /<PackageId>/ {
                print
                print "    <PackageVersion>" ver "</PackageVersion>"
                inserted = 1
                next
              }
              { print }
            ' "$CSPROJ" > "$CSPROJ.tmp"
            mv "$CSPROJ.tmp" "$CSPROJ"
          fi
          echo "Updated csproj package version to $VERSION"

      - name: Setup Bun
        if: steps.version.outputs.skip_version_commit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Sync generated version metadata
        if: steps.version.outputs.skip_version_commit != 'true'
        run: ./scripts/sync-release-generated.sh

      - name: Commit version updates
        if: steps.version.outputs.skip_version_commit != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add libraries/maui-iap/src/OpenIap.Maui/OpenIap.Maui.csproj
          git add packages/docs/src/generated/version-metadata.json

          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore(release): maui-iap@$VERSION"
          fi

      # Re-build native artifacts on the publish runner; the validate-multitarget
      # job runs in a separate workspace.
      - name: Build OpenIAP.xcframework (Apple)
        run: bash packages/apple/scripts/build-xcframework.sh

      - name: Verify App Store toolchain provenance
        run: bash packages/apple/scripts/verify-app-store-xcframework.sh

      - name: Build Play AAR (Google)
        working-directory: packages/google
        run: ./gradlew :openiap:assemblePlayRelease

      - name: Build MAUI Android module AAR
        working-directory: libraries/maui-iap/android
        run: ../../../packages/google/gradlew :openiap:assembleRelease

      - name: Pack NuGet package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack libraries/maui-iap/src/OpenIap.Maui/OpenIap.Maui.csproj \
            -c Release \
            -p:Version=$VERSION \
            -o ./nupkgs

      - name: Check if NuGet package already published
        id: check_nuget
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION_NORMALIZED=$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')
          PACKAGE_URL="https://api.nuget.org/v3-flatcontainer/openiap.maui/$VERSION_NORMALIZED/openiap.maui.$VERSION_NORMALIZED.nupkg"
          HTTP_STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" "$PACKAGE_URL" || true)
          HTTP_STATUS="${HTTP_STATUS:-000}"
          case "$HTTP_STATUS" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "⚠️ OpenIap.Maui $VERSION already exists on NuGet.org"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "✓ OpenIap.Maui $VERSION does not exist, will publish"
              ;;
            *)
              echo "❌ Unable to verify OpenIap.Maui $VERSION on NuGet.org (HTTP $HTTP_STATUS)"
              exit 1
              ;;
          esac

      - name: Preflight NuGet publication
        if: steps.check_nuget.outputs.exists == 'false'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is required before creating the release tag"
            exit 1
          fi

      - name: Create and push tag
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_EXISTS: ${{ steps.check_nuget.outputs.exists }}
          SKIP_VERSION_COMMIT: ${{ steps.version.outputs.skip_version_commit }}
        run: |
          gh auth setup-git
          RELEASE_TAG="maui-iap-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists"
          elif [ "$PACKAGE_EXISTS" = "true" ]; then
            echo "❌ OpenIap.Maui $VERSION is published without a provenance tag; refusing to tag an unverified source"
            exit 1
          else
            TAG_TARGET="HEAD"
            if [ "$SKIP_VERSION_COMMIT" = "true" ]; then
              git commit --allow-empty -m "chore: recover release ref"
              TAG_TARGET="$GITHUB_SHA"
            fi
            git tag -a "$RELEASE_TAG" "$TAG_TARGET" -m "Release $RELEASE_TAG"
            git push --atomic origin \
              "HEAD:$RELEASE_BRANCH" \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi

      - name: Publish to NuGet.org
        if: steps.check_nuget.outputs.exists == 'false'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push './nupkgs/*.nupkg' \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Generate release notes
        if: success()
        id: release_notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RELEASE_REF="HEAD"
          if git rev-parse "maui-iap-$VERSION" >/dev/null 2>&1; then
            RELEASE_REF="maui-iap-$VERSION"
          fi
          PREV_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' 'refs/tags/maui-iap-*' | grep -v "$VERSION" | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG..$RELEASE_REF" --pretty=format:"- %s ([\`%h\`](https://github.com/hyodotdev/openiap/commit/%H))" -- libraries/maui-iap/ packages/google/ packages/apple/ specs/client/)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Initial release / no direct code changes — picks up the latest openiap-google / openiap-apple native library updates."
          fi
          cat > /tmp/release-notes.md <<EOF
          ## maui-iap $VERSION

          .NET 10 MAUI / C# 12 library for the OpenIAP specification (iOS + Android + macCatalyst).

          ### What's Changed

          $CHANGELOG

          ### Installation

          \`\`\`xml
          <ItemGroup>
            <PackageReference Include="OpenIap.Maui" Version="$VERSION" />
          </ItemGroup>
          \`\`\`

          Or via the .NET CLI:

          \`\`\`bash
          dotnet add package OpenIap.Maui --version $VERSION
          \`\`\`

          ### Documentation

          - [Setup guide — .NET MAUI](https://openiap.dev/docs/setup/maui)
          - [API reference](https://openiap.dev/docs/apis)
          - [Release notes](https://openiap.dev/docs/updates/releases)

          ### Links

          - [NuGet](https://www.nuget.org/packages/OpenIap.Maui/$VERSION)
          - [GitHub (monorepo)](https://github.com/hyodotdev/openiap/tree/maui-iap-$VERSION/libraries/maui-iap)
          EOF

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: maui-iap-${{ steps.version.outputs.version }}
          name: maui-iap ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          body_path: /tmp/release-notes.md
          files: ./nupkgs/*.nupkg

      - name: Dispatch SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: maui-iap-${{ steps.version.outputs.version }}
        run: gh workflow run sbom.yml --ref main -f tag="$RELEASE_TAG"
