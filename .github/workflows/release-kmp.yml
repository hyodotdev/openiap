name: "A. Release: kmp-iap"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - current
          - rc-bump
        default: patch
      prerelease:
        description: "Publish as prerelease from next (-rc.1)"
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"
  XCODE_VERSION: 16.4
  RELEASE_BRANCH: ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  release-branch:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enforce stable and prerelease branches
        env:
          VERSION_TYPE: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: >-
          node scripts/release-branch-policy.mjs guard kmp
          "$VERSION_TYPE" "$IS_PRERELEASE"
          "$GITHUB_REF_NAME"

  validate-android:
    needs: [release-branch]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: libraries/kmp-iap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android targets
        run: |
          ./gradlew \
            :library:compilePlayDebugKotlinAndroid \
            :library:compileHorizonDebugKotlinAndroid \
            :library:compileAmazonDebugKotlinAndroid \
            --no-daemon \
            --stacktrace

  validate-ios:
    needs: [release-branch]
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: libraries/kmp-iap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: |
          ./gradlew :library:build
          ./gradlew :library:allTests

      - name: Build iOS frameworks
        run: |
          ./gradlew :library:podGenIos
          ./gradlew :library:podInstallSyntheticIos
          ./gradlew :library:podBuildOpeniapIos
          ./gradlew :library:linkPodDebugFrameworkIosSimulatorArm64
          ./gradlew :library:linkPodDebugFrameworkIosArm64

  publish:
    needs: [validate-android, validate-ios]
    permissions:
      actions: write
      contents: write
    runs-on: macos-15
    defaults:
      run:
        working-directory: libraries/kmp-iap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Calculate version
        id: version
        env:
          VERSION_TYPE: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          CURRENT_VERSION=$(grep '^libraryVersion=' gradle.properties | cut -d'=' -f2)

          if [ "$VERSION_TYPE" = "current" ]; then
            echo "VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
            echo "VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            if [[ "$CURRENT_VERSION" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          BASE_VERSION=$(echo "$CURRENT_VERSION" | sed -E 's/(-[a-zA-Z]+(\.[0-9]+)?)+$//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          if [ "$VERSION_TYPE" = "rc-bump" ]; then
            RC_NUM=$(echo "$CURRENT_VERSION" | sed -n 's/.*-rc\.\([0-9]*\)/\1/p')
            if [ -z "$RC_NUM" ]; then
              echo "::error::Current version $CURRENT_VERSION is not an rc version."
              exit 1
            fi
            VERSION="${BASE_VERSION}-rc.$((RC_NUM + 1))"
          elif [ "$IS_PRERELEASE" = "true" ]; then
            case "$VERSION_TYPE" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}-rc.1"
          else
            # Stable release — if current version is RC, strip prerelease without bumping
            IS_RC=$(echo "$CURRENT_VERSION" | grep -c '\-rc\.' || true)
            if [ "$IS_RC" -gt 0 ] && [ "$VERSION_TYPE" = "patch" ]; then
              VERSION="${BASE_VERSION}"
            else
              case "$VERSION_TYPE" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                patch) PATCH=$((PATCH + 1)) ;;
              esac
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release tag already exists
        id: check_tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          VERSION_TYPE: ${{ inputs.version }}
        run: |
          RELEASE_TAG="kmp-iap-$VERSION"
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$VERSION_TYPE" = "current" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "⚠️ Tag $RELEASE_TAG already exists. Will reuse existing tag (current mode)."
            else
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "❌ Tag $RELEASE_TAG already exists. Use 'current' to retry this version."
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "✓ Tag $RELEASE_TAG does not exist"
          fi

      - name: Verify current release tag provenance
        if: ${{ inputs.version == 'current' && steps.check_tag.outputs.exists == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          RELEASE_TAG="kmp-iap-$VERSION"
          node "$GITHUB_WORKSPACE/scripts/assert-release-tag.mjs" \
            kmp "$RELEASE_BRANCH" "$RELEASE_TAG" "$VERSION"

      - name: Checkout release tag (current version)
        if: ${{ inputs.version == 'current' && steps.check_tag.outputs.exists == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          RELEASE_TAG="kmp-iap-$VERSION"
          git checkout "$RELEASE_TAG"

      - name: Assert verified release head is unchanged
        if: ${{ inputs.version != 'current' || steps.check_tag.outputs.exists != 'true' }}
        run: node "$GITHUB_WORKSPACE/scripts/assert-release-head.mjs" "$RELEASE_BRANCH" "$GITHUB_SHA"

      - name: Update release metadata
        if: ${{ inputs.version != 'current' }}
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          perl -0pi -e 's/^libraryVersion=.*/libraryVersion=$ENV{VERSION}/m' gradle.properties
          ./scripts/update-readme-version.sh "$VERSION"

      - name: Setup Bun
        if: ${{ inputs.version != 'current' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Commit version updates
        if: ${{ inputs.version != 'current' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gradle.properties
          "$GITHUB_WORKSPACE/scripts/sync-release-generated.sh"
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore(release): kmp-iap@$VERSION"
          fi

      - name: Clean build artifacts
        run: rm -rf library/build/cocoapods

      - name: Build iOS frameworks
        run: |
          ./gradlew :library:podGenIos
          ./gradlew :library:podInstallSyntheticIos
          ./gradlew :library:podBuildOpeniapIos
          ./gradlew :library:linkPodDebugFrameworkIosSimulatorArm64
          ./gradlew :library:linkPodDebugFrameworkIosArm64

      - name: Check if KMP package already published
        id: check_maven
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://repo1.maven.org/maven2/io/github/hyochan/kmp-iap/$VERSION/" || true)
          HTTP_STATUS="${HTTP_STATUS:-000}"
          case "$HTTP_STATUS" in
            200)
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "⚠️ kmp-iap $VERSION already exists on Maven Central"
              ;;
            404)
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "✓ kmp-iap $VERSION does not exist, will publish"
              ;;
            *)
              echo "❌ Unable to verify kmp-iap $VERSION on Maven Central (HTTP $HTTP_STATUS)"
              exit 1
              ;;
          esac

      - name: Preflight Maven Central publication
        if: steps.check_maven.outputs.exists == 'false'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          for credential in \
            "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" \
            "$GPG_KEY_CONTENTS" "$SIGNING_KEY_ID" "$SIGNING_PASSWORD"; do
            if [ -z "$credential" ]; then
              echo "::error::Complete Maven Central and signing credentials are required before creating the release tag"
              exit 1
            fi
          done

      - name: Create and push tag
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          PACKAGE_EXISTS: ${{ steps.check_maven.outputs.exists }}
          VERSION_TYPE: ${{ inputs.version }}
        run: |
          gh auth setup-git
          RELEASE_TAG="kmp-iap-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists"
          elif [ "$PACKAGE_EXISTS" = "true" ]; then
            echo "❌ kmp-iap $VERSION is published without a provenance tag; refusing to tag an unverified source"
            exit 1
          else
            TAG_TARGET="HEAD"
            if [ "$VERSION_TYPE" = "current" ]; then
              git commit --allow-empty -m "chore: recover release ref"
              TAG_TARGET="$GITHUB_SHA"
            fi
            git tag -a "$RELEASE_TAG" "$TAG_TARGET" -m "Release $RELEASE_TAG"
            git push --atomic origin \
              "HEAD:$RELEASE_BRANCH" \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi

      - name: Publish to Maven Central
        if: steps.check_maven.outputs.exists == 'false'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :library:publishAndReleaseToMavenCentral --no-daemon --no-parallel

      - name: Generate release notes
        if: success()
        id: release_notes
        run: |
          RELEASE_REF="HEAD"
          if git rev-parse "kmp-iap-$VERSION" >/dev/null 2>&1; then
            RELEASE_REF="kmp-iap-$VERSION"
          fi
          PREV_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' 'refs/tags/kmp-iap-*' | grep -v "$VERSION" | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG..$RELEASE_REF" --pretty=format:"- %s ([\`%h\`](https://github.com/hyodotdev/openiap/commit/%H))" -- ":(top)libraries/kmp-iap/" ":(top)packages/google/" ":(top)packages/apple/")
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No direct code changes — picks up the latest openiap-google / openiap-apple native library updates. See the consolidated release notes for details."
          fi
          cat > /tmp/release-notes.md <<EOF
          ## kmp-iap $VERSION

          Kotlin Multiplatform library for the OpenIAP specification (iOS + Android).

          ### What's Changed

          $CHANGELOG

          ### Installation

          **Gradle (Kotlin DSL):**

          \`\`\`kotlin
          dependencies {
              implementation("io.github.hyochan:kmp-iap:$VERSION")
          }
          \`\`\`

          **Gradle (Groovy):**

          \`\`\`groovy
          dependencies {
              implementation 'io.github.hyochan:kmp-iap:$VERSION'
          }
          \`\`\`

          ### Documentation

          - [Setup guide — Kotlin Multiplatform](https://openiap.dev/docs/setup/kmp)
          - [API reference](https://openiap.dev/docs/apis)
          - [Release notes](https://openiap.dev/docs/updates/releases)

          ### Links

          - [Maven Central](https://central.sonatype.com/artifact/io.github.hyochan/kmp-iap/$VERSION)
          - [GitHub (monorepo)](https://github.com/hyodotdev/openiap/tree/kmp-iap-$VERSION/libraries/kmp-iap)
          EOF

      - name: Build Android release artifacts
        if: success()
        run: ./gradlew :library:assembleRelease --no-daemon --stacktrace

      - name: Create release artifacts
        if: success()
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob
          artifacts=(library/build/outputs/aar/*.aar library/build/libs/*.jar)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::No KMP release artifacts found"
            exit 1
          fi
          cp "${artifacts[@]}" release-artifacts/
          zip -r release-artifacts.zip release-artifacts/

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: kmp-iap-${{ steps.version.outputs.VERSION }}
          name: kmp-iap ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          body_path: /tmp/release-notes.md
          files: libraries/kmp-iap/release-artifacts.zip

      - name: Dispatch SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: kmp-iap-${{ steps.version.outputs.VERSION }}
        run: gh workflow run sbom.yml --ref main -f tag="$RELEASE_TAG"
