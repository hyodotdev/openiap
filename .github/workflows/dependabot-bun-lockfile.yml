name: Dependabot — Auto-refresh bun lockfile

# Dependabot doesn't update bun.lock when it bumps a package.json, so the
# kit verify job fails with `lockfile had changes, but lockfile is frozen`.
# This workflow re-runs `bun install` on the PR branch and pushes the
# refreshed bun.lock back so subsequent CI sees a consistent workspace.

on:
  pull_request:
    paths:
      - "package.json"
      - "packages/**/package.json"
      - "libraries/**/package.json"

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh bun.lock
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.install.outputs.changed }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Run bun install
        id: install
        run: |
          bun install --ignore-scripts
          if git diff --quiet bun.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push refreshed lockfile
        if: steps.install.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): refresh bun.lock"
          gh auth setup-git
          git push origin "HEAD:$PR_HEAD_REF"

  retrigger:
    name: Re-trigger Kit verify
    if: needs.refresh.outputs.changed == 'true'
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Kit verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # GITHUB_TOKEN pushes don't trigger pull_request events, so
          # dispatch deploy-kit.yml on the updated branch tip. Non-main manual
          # dispatches are verify-only; the deploy job is guarded to main.
          gh workflow run deploy-kit.yml --ref "$PR_HEAD_REF"
