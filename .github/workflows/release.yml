name: "A. Release: Docs"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release the native-derived current spec version"
        required: true
        type: choice
        options:
          - current
        default: current

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce stable release branch
        run: |
          node scripts/release-branch-policy.mjs guard docs \
            current false "$GITHUB_REF_NAME"
          node scripts/release-branch-policy.mjs assert-floor

      - name: Read derived spec version
        id: version
        run: |
          CURRENT_VERSION=$(jq -r '.spec' openiap-versions.json)
          echo "Native-derived spec version: $CURRENT_VERSION"
          echo "VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="docs-$VERSION"
          if git rev-parse --verify "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            node scripts/assert-release-tag.mjs docs main "$TAG_NAME" "$VERSION"
            git checkout --detach "$TAG_NAME"
            echo "Tag $TAG_NAME is valid; continuing the idempotent release rerun"
          else
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            gh auth setup-git
            git push origin "$TAG_NAME"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: docs-${{ steps.version.outputs.version }}
          name: Docs ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          generate_release_notes: true
          body: |
            ## OpenIAP Docs ${{ steps.version.outputs.version }}

            ### Documentation
            - [Documentation](https://openiap.dev)
            - [GitHub Repository](https://github.com/hyodotdev/openiap)

      - name: Dispatch SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: docs-${{ steps.version.outputs.version }}
        run: gh workflow run sbom.yml --ref main -f tag="$RELEASE_TAG"
