name: CI - kmp-iap

on:
  pull_request:
    branches: [main, next]
    paths:
      - "libraries/kmp-iap/**"
      - "packages/google/**"
      - "openiap-versions.json"
      - "scripts/ci/retry-gradle.sh"
      - ".github/workflows/ci-kmp-iap.yml"
      - "!**/*.md"
  push:
    branches: [main, next]
    paths:
      - "libraries/kmp-iap/**"
      - "packages/google/**"
      - "openiap-versions.json"
      - "scripts/ci/retry-gradle.sh"
      - ".github/workflows/ci-kmp-iap.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libraries/kmp-iap

jobs:
  compile-check:
    name: Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Compile check
        run: |
          chmod +x gradlew
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew \
            --no-parallel \
            -Dorg.gradle.jvmargs=-Xmx8192M \
            -Dkotlin.daemon.jvm.options=-Xmx4096M \
            :library:compilePlayDebugKotlinAndroid \
            :library:compileHorizonDebugKotlinAndroid \
            :library:compileAmazonDebugKotlinAndroid \
            :library:testPlayDebugUnitTest \
            :example:composeApp:assemblePlayDebug \
            :example:composeApp:assembleHorizonDebug \
            :example:composeApp:assembleAmazonDebug

  pick-mac-runner:
    # Same-repo runs go to the self-hosted Mac only while its heartbeat
    # (MAC_CI, refreshed by scripts/ci/mac-runner-heartbeat.sh) is fresh;
    # a stale heartbeat, a fork PR, or any parse doubt falls back to cloud.
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        # No checkout here, so the workflow's default working-directory may
        # not exist; runner.temp always does.
        working-directory: ${{ runner.temp }}
        env:
          HEARTBEAT: ${{ vars.MAC_CI }}
          # Owner-only: the Mac is Hyo's machine, so only Hyo's own PRs
          # and pushes may use it; everyone else builds on hosted runners.
          OWNER_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hyochan' && github.actor == 'hyochan' }}
        run: |
          runner='macos-26'
          case "$HEARTBEAT" in
            ''|*[!0-9]*) ;;
            *)
              if [ "$OWNER_PR" = "true" ] \
                && [ $(( $(date +%s) - HEARTBEAT )) -lt 900 ]; then
                runner='self-mac'
              fi
              ;;
          esac
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  ios-compile-check:
    name: iOS Compile Check
    needs: pick-mac-runner
    runs-on: ${{ needs.pick-mac-runner.outputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      # `iosSimulatorArm64Test` also compiles the source set, so this replaces
      # the previous compile-only step rather than adding to it. Without it the
      # iosTest suite (IosErrorMappingTest, IosConnectionLifecycleTest) never
      # ran in CI.
      - name: Compile and test iOS simulator source set
        run: |
          chmod +x gradlew
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" \
            ./gradlew --no-parallel :library:iosSimulatorArm64Test
