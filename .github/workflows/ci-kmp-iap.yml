name: CI - kmp-iap

on:
  pull_request:
    branches: [main, next]
    paths:
      - "libraries/kmp-iap/**"
      - "packages/google/**"
      - "openiap-versions.json"
      - ".github/workflows/ci-kmp-iap.yml"
  push:
    branches: [main, next]
    paths:
      - "libraries/kmp-iap/**"
      - "packages/google/**"
      - "openiap-versions.json"
      - ".github/workflows/ci-kmp-iap.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libraries/kmp-iap

jobs:
  compile-check:
    name: Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Compile check
        run: |
          chmod +x gradlew
          ./gradlew \
            --no-parallel \
            -Dorg.gradle.jvmargs=-Xmx8192M \
            -Dkotlin.daemon.jvm.options=-Xmx4096M \
            :library:compilePlayDebugKotlinAndroid \
            :library:compileHorizonDebugKotlinAndroid \
            :library:compileAmazonDebugKotlinAndroid \
            :library:testPlayDebugUnitTest \
            :example:composeApp:assemblePlayDebug \
            :example:composeApp:assembleHorizonDebug \
            :example:composeApp:assembleAmazonDebug

  ios-compile-check:
    name: iOS Compile Check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Compile iOS simulator source set
        run: |
          chmod +x gradlew
          ./gradlew --no-parallel :library:compileKotlinIosSimulatorArm64
