name: CI - kmp-iap

on:
  pull_request:
    branches: [main, next]
    paths:
      - "libraries/kmp-iap/**"
      - "packages/google/**"
      - "openiap-versions.json"
      - "scripts/ci/retry-gradle.sh"
      - ".github/workflows/ci-kmp-iap.yml"
      - "!**/*.md"
  push:
    branches: [main, next]
    paths:
      - "libraries/kmp-iap/**"
      - "packages/google/**"
      - "openiap-versions.json"
      - "scripts/ci/retry-gradle.sh"
      - ".github/workflows/ci-kmp-iap.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libraries/kmp-iap

jobs:
  compile-check:
    name: Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Compile check
        run: |
          chmod +x gradlew
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" ./gradlew \
            --no-parallel \
            -Dorg.gradle.jvmargs=-Xmx8192M \
            -Dkotlin.daemon.jvm.options=-Xmx4096M \
            :library:compilePlayDebugKotlinAndroid \
            :library:compileHorizonDebugKotlinAndroid \
            :library:compileAmazonDebugKotlinAndroid \
            :library:testPlayDebugUnitTest \
            :example:composeApp:assemblePlayDebug \
            :example:composeApp:assembleHorizonDebug \
            :example:composeApp:assembleAmazonDebug

  ios-compile-check:
    name: iOS Compile Check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      # `iosSimulatorArm64Test` also compiles the source set, so this replaces
      # the previous compile-only step rather than adding to it. Without it the
      # iosTest suite (IosErrorMappingTest, IosConnectionLifecycleTest) never
      # ran in CI.
      - name: Compile and test iOS simulator source set
        run: |
          chmod +x gradlew
          "$GITHUB_WORKSPACE/scripts/ci/retry-gradle.sh" \
            ./gradlew --no-parallel :library:iosSimulatorArm64Test
