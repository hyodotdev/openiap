name: "Security: SBOM"

# Generates a CycloneDX SBOM for whichever component a published release
# belongs to, attaches it to that release, and attests that this workflow
# produced it.
#
# Release workflows dispatch this workflow explicitly because releases created
# with GITHUB_TOKEN do not emit another workflow run. A scheduled scan repairs
# any missed dispatch for the newest release of each component.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - ".github/workflows/sbom.yml"
      - "scripts/generate-sbom.mjs"
      - "scripts/sbom-dependencies.mjs"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to generate an SBOM for"
        required: true
        type: string

concurrency:
  group: sbom-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

# The backfill job can dispatch repair runs; the publish job replaces these
# permissions with exactly what attestation and upload require.
permissions:
  actions: write
  contents: read

jobs:
  backfill:
    name: Dispatch missing current SBOMs
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7

      - name: Find and dispatch missing SBOMs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/releases.json"
          node scripts/generate-sbom.mjs missing-release-tags \
            "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/missing-tags.txt"

          while IFS= read -r RELEASE_TAG; do
            [ -n "$RELEASE_TAG" ] || continue
            echo "Dispatching SBOM for $RELEASE_TAG"
            gh workflow run sbom.yml --ref "$DEFAULT_BRANCH" \
              -f tag="$RELEASE_TAG"
          done < "$RUNNER_TEMP/missing-tags.txt"

  sbom:
    name: Generate and publish SBOM
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOM as a release asset
      id-token: write # request the Sigstore signing certificate
      attestations: write # record the provenance attestation
    steps:
      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::No release tag available"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Take the generator from the default branch
        id: generator
        # Keep release manifests at the tag while using the current generator.
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          GENERATOR_COMMIT=$(git rev-parse FETCH_HEAD)
          git checkout "$GENERATOR_COMMIT" -- \
            scripts/generate-sbom.mjs \
            scripts/sbom-dependencies.mjs \
            scripts/release-branch-policy.mjs \
            scripts/assert-release-tag.mjs
          echo "commit=$GENERATOR_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Generator taken from $DEFAULT_BRANCH at $GENERATOR_COMMIT"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Identify the released component
        id: component
        # Pass the tag through the environment rather than interpolating it
        # into the shell command; a ref name must never be able to extend the
        # command it is an argument to.
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/generate-sbom.mjs resolve-tag "$RELEASE_TAG"

      - name: Check for an existing immutable asset
        id: existing
        if: ${{ steps.component.outputs.matched == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          SBOM_NAME: ${{ steps.component.outputs.sbom-name }}
        run: |
          if gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name' | grep -Fxq "$SBOM_NAME"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$SBOM_NAME is already attached; preserving it."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # CI tests the generator and its historical fixtures in their owning tree.

      - name: Generate CycloneDX SBOM
        id: generate
        if: ${{ steps.component.outputs.matched == 'true' && steps.existing.outputs.exists == 'false' }}
        # License lookups degrade when unavailable; required POM/nuspec reads
        # retry for the registry propagation window and then fail closed.
        env:
          GENERATOR_COMMIT: ${{ steps.generator.outputs.commit }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for attempt in {1..16}; do
            if OUTPUT=$(node scripts/generate-sbom.mjs --tag "$RELEASE_TAG" \
              --output-dir sbom \
              --commit "$(git rev-parse HEAD)" \
              --generator-commit "$GENERATOR_COMMIT" \
              --with-licenses 2>&1); then
              echo "$OUTPUT"
              exit 0
            fi

            echo "$OUTPUT"
            if ! grep -Eq '^::error::Published (POM|nuspec) not found:' <<< "$OUTPUT"; then
              exit 1
            fi
            if [ "$attempt" -eq 16 ]; then
              echo "::error::Published dependency metadata remained unavailable after the registry propagation retry window."
              exit 1
            fi
            echo "::notice::Registry metadata is still indexing; retrying in 120 seconds."
            sleep 120
          done

      - name: Verify the SBOM describes this release
        if: ${{ steps.component.outputs.matched == 'true' && steps.existing.outputs.exists == 'false' }}
        env:
          SBOM_FILE: ${{ steps.generate.outputs.sbom-file }}
          EXPECTED_VERSION: ${{ steps.component.outputs.version }}
          EXPECTED_GENERATOR_COMMIT: ${{ steps.generator.outputs.commit }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # A version mismatch means the tag and the manifest disagree, which
          # would attach a misleading inventory to a real release.
          ACTUAL_VERSION=$(jq -r '.metadata.component.version' "$SBOM_FILE")
          ACTUAL_TAG=$(jq -r '
            .metadata.component.properties[]
            | select(.name == "openiap:release:tag") | .value
          ' "$SBOM_FILE")
          ACTUAL_COMMIT=$(jq -r '
            .metadata.component.properties[]
            | select(.name == "openiap:release:commit") | .value
          ' "$SBOM_FILE")
          ACTUAL_GENERATOR_COMMIT=$(jq -r '
            .metadata.tools.components[]
            | select(.name == "openiap-sbom-generator")
            | .properties[]
            | select(.name == "openiap:generator:commit") | .value
          ' "$SBOM_FILE")

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::SBOM version $ACTUAL_VERSION does not match tag version $EXPECTED_VERSION"
            exit 1
          fi
          if [ "$ACTUAL_TAG" != "$RELEASE_TAG" ]; then
            echo "::error::SBOM tag $ACTUAL_TAG does not match release tag $RELEASE_TAG"
            exit 1
          fi
          if [ "$ACTUAL_COMMIT" != "$(git rev-parse HEAD)" ]; then
            echo "::error::SBOM commit $ACTUAL_COMMIT does not match the released commit"
            exit 1
          fi
          if [ "$ACTUAL_GENERATOR_COMMIT" != "$EXPECTED_GENERATOR_COMMIT" ]; then
            echo "::error::SBOM generator $ACTUAL_GENERATOR_COMMIT does not match $EXPECTED_GENERATOR_COMMIT"
            exit 1
          fi

          # Fail closed if a local path ever reaches a published document.
          if grep -qE '/Users/|/home/[a-z]|/tmp/' "$SBOM_FILE"; then
            echo "::error::SBOM contains a local filesystem path"
            exit 1
          fi

          echo "SBOM verified for $RELEASE_TAG at $ACTUAL_COMMIT"

      - name: Attest SBOM provenance
        if: ${{ steps.component.outputs.matched == 'true' && steps.existing.outputs.exists == 'false' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.generate.outputs.sbom-file }}

      - name: Attach SBOM to the release
        if: ${{ steps.component.outputs.matched == 'true' && steps.existing.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          SBOM_FILE: ${{ steps.generate.outputs.sbom-file }}
        run: gh release upload "$RELEASE_TAG" "$SBOM_FILE"

      - name: Report a skipped tag
        if: ${{ steps.component.outputs.matched != 'true' }}
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "::notice::$RELEASE_TAG is not a component release tag; no SBOM generated."
