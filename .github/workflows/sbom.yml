name: "Security: SBOM"

# Generates a CycloneDX SBOM for whichever component a published release
# belongs to, attaches it to that release, and attests that this workflow
# produced it.
#
# Release workflows dispatch this workflow explicitly because releases created
# with GITHUB_TOKEN do not emit another workflow run. A scheduled scan repairs
# newest-stable misses and exact legacy assets approved by the repair SSOT.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sbom.yml"
      - "scripts/generate-sbom.mjs"
      - "scripts/sbom-dependencies.mjs"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to generate an SBOM for"
        required: true
        type: string

concurrency:
  group: sbom-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    name: Dispatch stable SBOM repairs
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Find and dispatch missing SBOMs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/releases.json"
          node scripts/generate-sbom.mjs missing-release-tags \
            "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/missing-tags.txt"

          while IFS= read -r RELEASE_TAG; do
            [ -n "$RELEASE_TAG" ] || continue
            echo "Dispatching SBOM for $RELEASE_TAG"
            gh workflow run sbom.yml --ref "$DEFAULT_BRANCH" \
              -f tag="$RELEASE_TAG"
          done < "$RUNNER_TEMP/missing-tags.txt"

  sbom:
    name: Generate and publish SBOM
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOM as a release asset
      id-token: write # request the Sigstore signing certificate
      attestations: write # record the provenance attestation
    steps:
      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::No release tag available"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Take the generator from the default branch
        id: generator
        # Keep release manifests at the tag while using the attested workflow revision.
        env:
          GENERATOR_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$GENERATOR_COMMIT"
          git checkout "$GENERATOR_COMMIT" -- \
            scripts/generate-sbom.mjs \
            scripts/sbom-dependencies.mjs \
            scripts/release-branch-policy.mjs \
            scripts/assert-release-tag.mjs \
            scripts/install-security-tool.sh
          echo "commit=$GENERATOR_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Generator pinned to attested workflow commit $GENERATOR_COMMIT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install CycloneDX CLI v0.33.1
        run: scripts/install-security-tool.sh cyclonedx "$RUNNER_TEMP/cyclonedx"

      - name: Identify the released component
        id: component
        # Pass the tag through the environment rather than interpolating it
        # into the shell command; a ref name must never be able to extend the
        # command it is an argument to.
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/generate-sbom.mjs resolve-tag "$RELEASE_TAG"

      - name: Verify release tag provenance
        if: ${{ steps.component.outputs.matched == 'true' }}
        env:
          COMPONENT_ID: ${{ steps.component.outputs.component }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.component.outputs.version }}
        run: |
          RELEASE_BRANCH=main
          case "$RELEASE_VERSION" in
            *-*) RELEASE_BRANCH=next ;;
          esac
          node scripts/assert-release-tag.mjs \
            "$COMPONENT_ID" "$RELEASE_BRANCH" "$RELEASE_TAG" "$RELEASE_VERSION"

      - name: Inspect the existing asset
        id: existing
        if: ${{ steps.component.outputs.matched == 'true' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPAIR_DIGEST: ${{ steps.component.outputs.repair-digest }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          SBOM_NAME: ${{ steps.component.outputs.sbom-name }}
        run: |
          if ! RELEASE_JSON=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"); then
            echo "::error::Unable to inspect release assets for $RELEASE_TAG"
            exit 1
          fi
          ASSET=$(jq -c --arg name "$SBOM_NAME" \
            '[.assets[] | select(.name == $name)][0] // empty' \
            <<< "$RELEASE_JSON")
          STAGED_ASSET=$(jq -c --arg name "$SBOM_NAME.replacement" \
            '[.assets[] | select(.name == $name)][0] // empty' \
            <<< "$RELEASE_JSON")
          ASSET_DIGEST=$(jq -r '.digest // ""' <<< "$ASSET")
          if [ -n "$ASSET" ] && \
            { [ -z "$REPAIR_DIGEST" ] || [ "$ASSET_DIGEST" != "$REPAIR_DIGEST" ]; }; then
            ASSET_ID=$(jq -r '.id' <<< "$ASSET")
            EXISTING_FILE="$RUNNER_TEMP/$SBOM_NAME"
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
              -H "Accept: application/octet-stream" > "$EXISTING_FILE"
            node scripts/generate-sbom.mjs verify-file "$EXISTING_FILE" \
              --tag "$RELEASE_TAG" --digest "$ASSET_DIGEST"
            "$RUNNER_TEMP/cyclonedx" validate \
              --input-file "$EXISTING_FILE" --input-format json \
              --input-version v1_6 --fail-on-errors
            CERT_IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/sbom.yml@refs/heads/$DEFAULT_BRANCH"
            ATTESTATION_FILE="$RUNNER_TEMP/$SBOM_NAME.attestation.json"
            gh attestation verify "$EXISTING_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$CERT_IDENTITY" \
              --deny-self-hosted-runners --format json > "$ATTESTATION_FILE"
            node scripts/generate-sbom.mjs verify-attested-generator \
              "$EXISTING_FILE" "$ATTESTATION_FILE" \
              --repository "$GITHUB_REPOSITORY" --branch "$DEFAULT_BRANCH"
            if [ -n "$REPAIR_DIGEST" ] && [ -n "$STAGED_ASSET" ]; then
              STAGED_ASSET_ID=$(jq -r '.id' <<< "$STAGED_ASSET")
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$STAGED_ASSET_ID"
              echo "::notice::Removed a stale staged repair after verifying $SBOM_NAME."
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$SBOM_NAME is verified and will be preserved."
          elif [ -n "$REPAIR_DIGEST" ] && [ -n "$STAGED_ASSET" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A staged legacy repair will be reconciled."
          elif [ -z "$ASSET" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$SBOM_NAME matches a guarded legacy digest and will be replaced once."
          fi

      # CI tests the generator and its historical fixtures in their owning tree.

      - name: Generate CycloneDX SBOM
        id: generate
        if: ${{ steps.component.outputs.matched == 'true' && steps.existing.outputs.exists == 'false' }}
        # License lookups degrade when unavailable; required POM/nuspec reads
        # retry for the registry propagation window and then fail closed.
        env:
          GENERATOR_COMMIT: ${{ steps.generator.outputs.commit }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for attempt in {1..16}; do
            if OUTPUT=$(node scripts/generate-sbom.mjs --tag "$RELEASE_TAG" \
              --output-dir sbom \
              --commit "$(git rev-parse HEAD)" \
              --generator-commit "$GENERATOR_COMMIT" \
              --with-licenses 2>&1); then
              echo "$OUTPUT"
              exit 0
            else
              STATUS=$?
            fi

            echo "$OUTPUT"
            # generate-sbom reserves EX_TEMPFAIL (75) for registry metadata.
            if [ "$STATUS" -ne 75 ]; then
              exit "$STATUS"
            fi
            if [ "$attempt" -eq 16 ]; then
              echo "::error::Published dependency metadata remained unavailable after the registry propagation retry window."
              exit 1
            fi
            echo "::notice::Registry metadata is still indexing; retrying in 120 seconds."
            sleep 120
          done

      - name: Verify the SBOM describes this release
        if: ${{ steps.component.outputs.matched == 'true' && steps.existing.outputs.exists == 'false' }}
        env:
          SBOM_FILE: ${{ steps.generate.outputs.sbom-file }}
          EXPECTED_GENERATOR_COMMIT: ${{ steps.generator.outputs.commit }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node scripts/generate-sbom.mjs verify-file "$SBOM_FILE" \
            --tag "$RELEASE_TAG" \
            --generator-commit "$EXPECTED_GENERATOR_COMMIT"
          "$RUNNER_TEMP/cyclonedx" validate \
            --input-file "$SBOM_FILE" --input-format json \
            --input-version v1_6 --fail-on-errors

      - name: Attest SBOM provenance
        if: ${{ steps.component.outputs.matched == 'true' && steps.existing.outputs.exists == 'false' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ steps.generate.outputs.sbom-file }}

      - name: Attach SBOM to the release
        if: ${{ steps.component.outputs.matched == 'true' && steps.existing.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPAIR_DIGEST: ${{ steps.component.outputs.repair-digest }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          SBOM_FILE: ${{ steps.generate.outputs.sbom-file }}
          SBOM_NAME: ${{ steps.component.outputs.sbom-name }}
        run: |
          if [ -z "$REPAIR_DIGEST" ]; then
            gh release upload "$RELEASE_TAG" "$SBOM_FILE"
            exit 0
          fi

          STAGED_NAME="$SBOM_NAME.replacement"
          STAGED_FILE="$RUNNER_TEMP/$STAGED_NAME"
          cp "$SBOM_FILE" "$STAGED_FILE"
          RELEASE_JSON=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          CANONICAL_ASSET=$(jq -c --arg name "$SBOM_NAME" \
            '[.assets[] | select(.name == $name)][0] // empty' \
            <<< "$RELEASE_JSON")
          STAGED_ASSET=$(jq -c --arg name "$STAGED_NAME" \
            '[.assets[] | select(.name == $name)][0] // empty' \
            <<< "$RELEASE_JSON")
          CANONICAL_ASSET_ID=$(jq -r '.id // ""' <<< "$CANONICAL_ASSET")
          CANONICAL_DIGEST=$(jq -r '.digest // ""' <<< "$CANONICAL_ASSET")
          STAGED_ASSET_ID=$(jq -r '.id' <<< "$STAGED_ASSET")
          STAGED_DIGEST=$(jq -r '.digest // ""' <<< "$STAGED_ASSET")
          LOCAL_DIGEST="sha256:$(sha256sum "$STAGED_FILE" | cut -d ' ' -f 1)"

          finalize_staged_asset() {
            for _ in {1..5}; do
              if gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/releases/assets/$STAGED_ASSET_ID" \
                -f name="$SBOM_NAME" >/dev/null; then
                return 0
              fi
              sleep 5
            done
            echo "::error::The verified replacement remains attached as $STAGED_NAME but could not be renamed."
            return 1
          }

          if [ -z "$CANONICAL_ASSET_ID" ]; then
            if [ -n "$STAGED_ASSET_ID" ] && [ "$STAGED_DIGEST" = "$LOCAL_DIGEST" ]; then
              finalize_staged_asset
            else
              if [ -n "$STAGED_ASSET_ID" ]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$STAGED_ASSET_ID"
              fi
              gh release upload "$RELEASE_TAG" "$SBOM_FILE"
            fi
            exit 0
          fi

          if [ -n "$STAGED_ASSET_ID" ] && [ "$STAGED_DIGEST" != "$LOCAL_DIGEST" ]; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$STAGED_ASSET_ID"
            STAGED_ASSET_ID=""
          fi
          if [ -z "$STAGED_ASSET_ID" ]; then
            gh release upload "$RELEASE_TAG" "$STAGED_FILE"
            RELEASE_JSON=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
            STAGED_ASSET=$(jq -c --arg name "$STAGED_NAME" \
              '[.assets[] | select(.name == $name)][0] // empty' \
              <<< "$RELEASE_JSON")
            STAGED_ASSET_ID=$(jq -r '.id // ""' <<< "$STAGED_ASSET")
            STAGED_DIGEST=$(jq -r '.digest // ""' <<< "$STAGED_ASSET")
          fi
          if [ -z "$STAGED_ASSET_ID" ] || [ "$STAGED_DIGEST" != "$LOCAL_DIGEST" ]; then
            echo "::error::The staged replacement SBOM failed digest verification."
            exit 1
          fi

          if [ "$CANONICAL_DIGEST" != "$REPAIR_DIGEST" ]; then
            echo "::error::$SBOM_NAME changed during repair; leaving the staged asset for verified reconciliation."
            exit 1
          fi

          CURRENT_DIGEST=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/assets/$CANONICAL_ASSET_ID" \
            --jq '.digest // ""')
          if [ "$CURRENT_DIGEST" != "$REPAIR_DIGEST" ]; then
            echo "::error::The legacy SBOM asset changed during repair; leaving the staged asset for verified reconciliation."
            exit 1
          fi
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/releases/assets/$CANONICAL_ASSET_ID"
          finalize_staged_asset

      - name: Verify the published SBOM
        if: ${{ steps.component.outputs.matched == 'true' && steps.existing.outputs.exists == 'false' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_GENERATOR_COMMIT: ${{ steps.generator.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          SBOM_NAME: ${{ steps.component.outputs.sbom-name }}
        run: |
          RELEASE_JSON=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          ASSET_COUNT=$(jq --arg name "$SBOM_NAME" \
            '[.assets[] | select(.name == $name)] | length' \
            <<< "$RELEASE_JSON")
          if [ "$ASSET_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one published $SBOM_NAME asset, found $ASSET_COUNT."
            exit 1
          fi
          ASSET=$(jq -c --arg name "$SBOM_NAME" \
            '[.assets[] | select(.name == $name)][0]' \
            <<< "$RELEASE_JSON")
          ASSET_ID=$(jq -r '.id' <<< "$ASSET")
          ASSET_DIGEST=$(jq -r '.digest // ""' <<< "$ASSET")
          if [ -z "$ASSET_DIGEST" ]; then
            echo "::error::GitHub did not report a digest for $SBOM_NAME."
            exit 1
          fi

          PUBLISHED_FILE="$RUNNER_TEMP/$SBOM_NAME"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            -H "Accept: application/octet-stream" > "$PUBLISHED_FILE"
          node scripts/generate-sbom.mjs verify-file "$PUBLISHED_FILE" \
            --tag "$RELEASE_TAG" \
            --digest "$ASSET_DIGEST" \
            --generator-commit "$EXPECTED_GENERATOR_COMMIT"
          "$RUNNER_TEMP/cyclonedx" validate \
            --input-file "$PUBLISHED_FILE" --input-format json \
            --input-version v1_6 --fail-on-errors

          CERT_IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/sbom.yml@refs/heads/$DEFAULT_BRANCH"
          ATTESTATION_FILE="$RUNNER_TEMP/$SBOM_NAME.attestation.json"
          for attempt in {1..12}; do
            if gh attestation verify "$PUBLISHED_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$CERT_IDENTITY" \
              --deny-self-hosted-runners --format json > "$ATTESTATION_FILE"; then
              node scripts/generate-sbom.mjs verify-attested-generator \
                "$PUBLISHED_FILE" "$ATTESTATION_FILE" \
                --repository "$GITHUB_REPOSITORY" --branch "$DEFAULT_BRANCH"
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::The published SBOM attestation was not verifiable after the propagation window."
              exit 1
            fi
            echo "::notice::The SBOM attestation is still propagating; retrying in 10 seconds."
            sleep 10
          done

      - name: Report a skipped tag
        if: ${{ steps.component.outputs.matched != 'true' }}
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "::notice::$RELEASE_TAG is not a component release tag; no SBOM generated."
