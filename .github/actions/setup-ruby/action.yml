name: Set up Ruby
description: Install the repository's pinned Ruby.
inputs:
  working-directory:
    description: Directory whose Gemfile.lock selects the Bundler version
    default: .
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
      with:
        ruby-version: "3.3"
        working-directory: ${{ inputs.working-directory }}
