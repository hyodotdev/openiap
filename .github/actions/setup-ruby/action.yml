name: Set up Ruby
description: Install the repository's pinned Ruby.
inputs:
  working-directory:
    description: Directory whose Gemfile.lock selects the Bundler version
    default: .
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
      with:
        ruby-version: "3.3"
        working-directory: ${{ inputs.working-directory }}
