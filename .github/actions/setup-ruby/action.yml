name: Set up Ruby
description: Install the repository's pinned Ruby.
inputs:
  working-directory:
    description: Directory whose Gemfile.lock selects the Bundler version
    default: .
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
      with:
        ruby-version: "3.3"
        working-directory: ${{ inputs.working-directory }}
