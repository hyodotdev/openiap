name: Set up Ruby
description: Install the repository's pinned Ruby.
inputs:
  working-directory:
    description: Directory whose Gemfile.lock selects the Bundler version
    default: .
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
      with:
        ruby-version: "3.3"
        working-directory: ${{ inputs.working-directory }}
