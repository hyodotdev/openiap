org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
openIapAndroidGradlePluginVersion=8.13.2
openIapKotlinVersion=2.4.10
openIapJunitVersion=4.13.2
openIapAndroidTestRunnerVersion=1.7.0
openIapEspressoCoreVersion=3.7.0

# Enable Horizon OS support (Meta Quest)
# Default: false (uses Google Play Billing)
# Uncomment to enable Horizon billing:
# horizonEnabled=true

# Enable Fire OS support for Amazon distribution
# Default: false (uses Google Play Billing unless horizonEnabled=true)
# Do not enable with horizonEnabled in the same build.
# fireOsEnabled=true

# Exclude every Android store SDK while keeping Apple IAP support.
# Do not combine this with horizonEnabled or fireOsEnabled.
# openiapPlatform=none
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
