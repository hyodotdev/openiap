org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
openIapAndroidGradlePluginVersion=8.13.2
openIapKotlinVersion=2.4.10
openIapJunitVersion=4.13.2
openIapAndroidTestRunnerVersion=1.7.0
openIapEspressoCoreVersion=3.7.0

# Store selection is automatic: a flavor (flutter run --flavor horizon) or, for
# debug builds, the single connected Quest or Fire device picks the store; play
# otherwise. Pin one here or with -PopeniapStore=<play|horizon|amazon> when a
# build must not look at the device (release trains, CI).
# openiapStore=horizon

# Exclude every Android store SDK while keeping Apple IAP support.
# openiapStore=none
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
