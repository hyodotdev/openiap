#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M
kotlin.apple.xcodeCompatibility.nowarn=true

#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024M
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
# AGP 8.13 bundles Lint that cannot read Kotlin 2.4 metadata.
android.experimental.lint.version=9.4.1
android.nonTransitiveRClass=true
android.useAndroidX=true
