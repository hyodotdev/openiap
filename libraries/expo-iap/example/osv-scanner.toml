[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-12-24
reason = "The fix is glob 14.0.2. This lock resolves glob 13 for the Expo 57 packages, which accept glob 14 from expo 57.0.34, and glob 11 for the React Native TV config plugin, which still requires it. Expo uses glob for trusted local project discovery and builds, including early cancellation after the first match; cancellation must not be treated as an enforced traversal budget. The example mobile entry points and published expo-iap runtime do not import glob. Do not run this tooling on untrusted directory trees or expose it as a public request handler. Recheck compatible upstream upgrades before expiry: https://github.com/advisories/GHSA-3g3m-2fjr-6pw4. Rechecked 2026-11-25: the React Native TV config plugin has no release that accepts the fix."

