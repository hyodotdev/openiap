reason = "decode-uri-component 0.5.0 is the only patched release and is ESM-only, so query-string 7 cannot take it; query-string 9, which can, is ESM-only too. expo-router 57.0.21 still depends on query-string ^7.1.3, so this example app cannot break the chain. Revisit when expo-router drops query-string 7, as @react-navigation/core did in 7.22.1."

