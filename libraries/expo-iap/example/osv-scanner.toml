reason = "The fix is glob 14.0.2. This lock resolves glob 13 for Jest 30, glob 10 for its coverage tooling, and glob 11 for the React Native TV config plugin; each still requires its line. They use glob for trusted local test and project discovery, including early cancellation after the first match; cancellation must not be treated as an enforced traversal budget. The example mobile entry points and published expo-iap runtime do not import glob. Do not run this tooling on untrusted directory trees or expose it as a public request handler. Recheck compatible upstream upgrades before expiry: https://github.com/advisories/GHSA-3g3m-2fjr-6pw4. Rechecked 2026-11-27: Jest 30.5.2 and the React Native TV config plugin 0.1.7 do not accept the fix."

