// OpenIAP store resolver. Source of truth: packages/google/gradle/openiap-store.gradle.
// Each framework's android/ copy must stay byte-identical (bun audit:parity).
// Apply it, then call openIapResolveStore('<label>'), or ('<label>', [allowNone: true])
// where opting out of Android IAP is supported.
//
// First match wins:
//   1. explicit  openiapStore=<store> (-P, ORG_GRADLE_PROJECT_openiapStore, gradle.properties).
//                horizonEnabled / fireOsEnabled / openiapPlatform=none still work, with a warning.
//   2. variant   a requested task carries a store flavor (assembleHorizonRelease, installAmazonDebug).
//   3. device    debug builds only: the adb device ANDROID_SERIAL names, or the
//                single connected one, is a Quest or Fire device.
//   4. play
// A pin and a task flavor that name different stores fail the build, as do two flavors
// in one invocation and a pin against a legacy flag, so a pinned release train cannot
// quietly ship the wrong billing SDK. The device is a fallback, not a competing signal:
// a pin or a flavor simply outranks it. A release build never consults a device,
// several attached devices select nothing unless ANDROID_SERIAL names one, and the
// configuration cache disables the device probe because a cached answer outlives the
// device that produced it.

ext.openIapStoreAliases = [
  play: 'play', google: 'play', gplay: 'play', googleplay: 'play', 'google-play': 'play', gms: 'play',
  horizon: 'horizon', meta: 'horizon', quest: 'horizon',
  amazon: 'amazon', fire: 'amazon', fireos: 'amazon', 'fire-os': 'amazon',
  none: 'none', auto: 'auto',
]

ext.openIapNormalizeStore = { Object value, String label ->
  def key = value?.toString()?.trim()?.toLowerCase(Locale.ROOT)
  if (!key) {
    return null
  }
  def store = openIapStoreAliases[key]
  if (store == null) {
    throw new GradleException("${label}: unknown openiapStore '${value}'; use play, horizon, amazon, auto, or none where the library allows it")
  }
  return store
}

// assembleHorizonRelease -> [assemble, horizon, release]
ext.openIapTaskTokens = { String taskPath ->
  def name = taskPath.substring(taskPath.lastIndexOf(':') + 1)
  return name.split(/(?<=[a-z0-9])(?=[A-Z])|[^A-Za-z0-9]+/).collect { it.toLowerCase(Locale.ROOT) }.findAll { it }
}

ext.openIapExplicitStore = { String label, boolean allowNone ->
  def explicit = openIapNormalizeStore(project.findProperty('openiapStore'), label)
  def horizon = project.findProperty('horizonEnabled')?.toString()?.toBoolean() ?: false
  def fireOs = project.findProperty('fireOsEnabled')?.toString()?.toBoolean() ?: false
  def platform = project.findProperty('openiapPlatform')?.toString()?.trim()?.toLowerCase(Locale.ROOT)
  if (platform != null && platform != 'none') {
    throw new GradleException("${label}: openiapPlatform only supports the opt-out value 'none'; use openiapStore to pick a store")
  }
  if (horizon && fireOs) {
    throw new GradleException("${label}: horizonEnabled and fireOsEnabled cannot both be true")
  }
  if (platform == 'none' && (horizon || fireOs)) {
    throw new GradleException("${label}: openiapPlatform=none conflicts with legacy store flags")
  }
  def legacy = platform == 'none' ? 'none' : (fireOs ? 'amazon' : (horizon ? 'horizon' : null))
  if (legacy != null) {
    logger.warn("${label}: horizonEnabled, fireOsEnabled, and openiapPlatform are deprecated; use openiapStore=${legacy}")
  }
  def store = (explicit != null && explicit != 'auto') ? explicit : legacy
  if (explicit != null && explicit != 'auto' && legacy != null && legacy != explicit) {
    throw new GradleException("${label}: openiapStore=${explicit} conflicts with legacy flags selecting ${legacy}")
  }
  if (store == 'none' && !allowNone) {
    throw new GradleException("${label}: openiapStore=none is not supported by this library")
  }
  return store
}

// Gradle accepts camelCase abbreviations, so `aHR` runs assembleHorizonRelease.
// Every capital starts a segment; the first one is the verb.
ext.openIapAbbreviatedStore = { String taskPath ->
  def flavors = ['play', 'horizon', 'amazon']
  def buildTypes = ['debug', 'release']
  def name = taskPath.substring(taskPath.lastIndexOf(':') + 1)
  def segments = name.split(/(?=[A-Z])/).collect { it.toLowerCase(Locale.ROOT) }.findAll { it }
  if (segments.size() < 2) {
    return [] as LinkedHashSet
  }
  def matches = [] as LinkedHashSet
  segments.drop(1).each { segment ->
    if (buildTypes.any { it.startsWith(segment) }) {
      return
    }
    flavors.findAll { it.startsWith(segment) }.each { matches << it }
  }
  return matches
}

ext.openIapTaskStore = { String label ->
  def stores = [] as LinkedHashSet
  def abbreviated = [] as LinkedHashSet
  gradle.startParameter.taskNames.each { String taskPath ->
    openIapTaskTokens(taskPath).each { token ->
      if (token in ['play', 'horizon', 'amazon']) {
        stores << token
      }
    }
    openIapAbbreviatedStore(taskPath).each { abbreviated << it }
  }
  if (stores.size() > 1) {
    throw new GradleException("${label}: the requested tasks name more than one store (${stores.join(', ')}); build one store per invocation or set openiapStore")
  }
  if (stores) {
    return stores.first()
  }
  // Guessing here would link the wrong billing SDK without a word of warning.
  if (abbreviated.size() > 1) {
    throw new GradleException("${label}: cannot tell which store the abbreviated tasks '${gradle.startParameter.taskNames.join(' ')}' select (${abbreviated.join(', ')}); spell the task out or set openiapStore")
  }
  return abbreviated ? abbreviated.first() : null
}

// `clean assembleDebug` is still a debug build, but anything naming a release
// task is not: a release artifact must never depend on what is plugged in.
ext.openIapDebugBuild = {
  def names = gradle.startParameter.taskNames
  if (!names) {
    return false
  }
  def tokens = names.collectMany { openIapTaskTokens(it) }
  return tokens.contains('debug') && !tokens.contains('release')
}

ext.openIapEnv = { String name ->
  // providers.environmentVariable is a tracked configuration-cache input;
  // System.getenv is not.
  return providers.environmentVariable(name).orNull
}

ext.openIapAdb = {
  def roots = [openIapEnv('ANDROID_HOME'), openIapEnv('ANDROID_SDK_ROOT')]
  def localProperties = rootProject.file('local.properties')
  if (localProperties.isFile()) {
    def properties = new Properties()
    localProperties.withInputStream { properties.load(it) }
    roots << properties.getProperty('sdk.dir')
  }
  def names = ['adb', 'adb.exe']
  def adb = roots.findResult { root ->
    if (!root) {
      return null
    }
    return names.findResult { name ->
      def candidate = new File(root, "platform-tools/${name}")
      return candidate.isFile() ? candidate.absolutePath : null
    }
  }
  if (adb != null) {
    return adb
  }
  // A developer with adb only on PATH still gets device selection.
  return (openIapEnv('PATH') ?: '').split(File.pathSeparator).findResult { entry ->
    if (!entry) {
      return null
    }
    return names.findResult { name ->
      def candidate = new File(entry, name)
      return candidate.isFile() ? candidate.absolutePath : null
    }
  }
}

// providers.exec keeps the probe legal under the configuration cache.
ext.openIapAdbText = { List<String> command ->
  try {
    return providers.exec {
      commandLine(command)
      ignoreExitValue = true
    }.standardOutput.asText.get()
  } catch (Throwable ignored) {
    return null
  }
}

// ANDROID_SERIAL is how every Android tool picks among attached devices, so a
// developer with several plugged in still gets the one they are targeting.
ext.openIapDeviceStore = {
  def adb = openIapAdb()
  if (adb == null) {
    return null
  }
  def listing = openIapAdbText([adb, 'devices'])
  if (listing == null) {
    return null
  }
  // Windows adb terminates lines with CR, which the serial would otherwise keep.
  def serials = listing.readLines()
      .collect { it.replace('\r', '').trim() }
      .findAll { it ==~ /^\S+\s+device$/ }
      .collect { it.split(/\s+/)[0] }
  def requested = openIapEnv('ANDROID_SERIAL')?.trim()
  def serial
  if (requested) {
    if (!serials.contains(requested)) {
      logger.warn("openiap: ANDROID_SERIAL=${requested} is not attached; not selecting a store from a device")
      return null
    }
    serial = requested
  } else if (serials.size() == 1) {
    serial = serials[0]
  } else {
    return null
  }
  // A device that drops between the listing and these probes must not be
  // reported as a device signal that happened to mean play.
  def features = openIapAdbText([adb, '-s', serial, 'shell', 'pm', 'list', 'features'])
  def manufacturerText = openIapAdbText([adb, '-s', serial, 'shell', 'getprop', 'ro.product.manufacturer'])
  if (features == null && manufacturerText == null) {
    logger.warn("openiap: ${serial} stopped responding; not selecting a store from a device")
    return null
  }
  features = features ?: ''
  def manufacturer = (manufacturerText ?: '').trim()
  def store = 'play'
  if (features.contains('feature:horizonos.software.horizon_os') || features.contains('feature:oculus.hardware.standalone_vr')) {
    store = 'horizon'
  } else if (features.contains('feature:amazon.hardware.fire_tv') || manufacturer.equalsIgnoreCase('Amazon')) {
    store = 'amazon'
  }
  return [store: store, reason: "device ${serial}, manufacturer ${manufacturer ?: 'unknown'}"]
}

ext.openIapResolveStore = { String label, Map options = [:] ->
  if (rootProject.ext.has('openIapStoreResolution')) {
    return rootProject.ext.openIapStoreResolution
  }
  def allowNone = options.allowNone == true
  def explicit = openIapExplicitStore(label, allowNone)
  def variant = openIapTaskStore(label)
  // A pin that disagrees with the requested flavor is the case that ships the
  // wrong billing SDK from a correct-looking release task, so it fails here.
  if (explicit != null && variant != null && explicit != variant) {
    throw new GradleException(
      "${label}: openiapStore=${explicit} conflicts with the ${variant} flavor in '${gradle.startParameter.taskNames.join(' ')}'"
    )
  }
  def resolution = null
  if (explicit != null) {
    resolution = [store: explicit, source: 'explicit', reason: 'openiapStore or a legacy flag']
  } else if (variant != null) {
    resolution = [store: variant, source: 'variant', reason: "task ${gradle.startParameter.taskNames.join(' ')}"]
  } else if (openIapDebugBuild()) {
    def ccRequested = false
    try {
      ccRequested = gradle.startParameter.isConfigurationCacheRequested()
    } catch (Throwable ignored) {
    }
    if (ccRequested) {
      // A cached configuration keeps the store the probe saw, long after that
      // device is gone. Pin the store instead of shipping a stale answer.
      logger.warn("openiap: the configuration cache is on, so the connected device does not select a store; set openiapStore")
    } else {
      def device = openIapDeviceStore()
      if (device != null) {
        resolution = [store: device.store, source: 'device', reason: device.reason]
      }
    }
  }
  if (resolution == null) {
    resolution = [store: 'play', source: 'default', reason: 'no store signal']
  }
  rootProject.ext.openIapStoreResolution = resolution
  logger.lifecycle("openiap: store=${resolution.store} (source=${resolution.source}; ${resolution.reason})")
  return resolution
}
