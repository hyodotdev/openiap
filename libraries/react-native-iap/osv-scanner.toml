reason = "image-size reaches this lock only through Metro 0.84.4, pinned by @expo/metro 56.0.0 and resolved for @react-native/community-cli-plugin 0.86.2. The advisories are fixed in image-size 2.0.3, and Metro 0.84.5 drops it; @expo/metro 56.0.1+ pins 0.84.5 inside the locked ~56.0.0 range, so re-resolving Metro clears both. Until then Metro uses it only during trusted local builds."

