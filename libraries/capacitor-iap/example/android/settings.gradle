pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'

// Build openiap-google from this checkout, like the other examples.
def localOpenIap = new File(settingsDir, '../../../../packages/google/openiap')
if (localOpenIap.exists()) {
    include ':openiap-google'
    project(':openiap-google').projectDir = localOpenIap
    include ':openiap-core'
    project(':openiap-core').projectDir = new File(settingsDir, '../../../../packages/google/core')
}
