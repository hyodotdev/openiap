coverage:
  precision: 2
  round: down
  range: "50...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
      react-native-iap:
        target: 90%
        threshold: 0%
        informational: false
        flags:
          - react-native-iap
      expo-iap:
        target: 90%
        threshold: 0%
        informational: false
        flags:
          - expo-iap
      flutter-inapp-purchase:
        target: 90%
        threshold: 0%
        informational: false
        flags:
          - flutter-inapp-purchase
      iapkit-server:
        target: 90%
        threshold: 0%
        informational: false
        paths:
          - "packages/kit/server/**"
      iapkit-convex:
        target: 48%
        threshold: 0%
        informational: false
        paths:
          - "packages/kit/convex/**"
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true
      react-native-iap:
        target: 90%
        threshold: 0%
        informational: false
        flags:
          - react-native-iap
      expo-iap:
        target: 90%
        threshold: 0%
        informational: false
        flags:
          - expo-iap
      flutter-inapp-purchase:
        target: 90%
        threshold: 0%
        informational: false
        flags:
          - flutter-inapp-purchase
      iapkit-server:
        target: 90%
        threshold: 0%
        informational: false
        paths:
          - "packages/kit/server/**"
      iapkit-convex:
        target: 48%
        threshold: 0%
        informational: false
        paths:
          - "packages/kit/convex/**"

flags:
  react-native-iap:
    paths:
      - "libraries/react-native-iap/src/**"
    carryforward: true
  expo-iap:
    paths:
      - "libraries/expo-iap/src/**"
    carryforward: true
  flutter-inapp-purchase:
    paths:
      - "libraries/flutter_inapp_purchase/lib/**"
    carryforward: true
  iapkit:
    paths:
      - "packages/kit/server/**"
      - "packages/kit/convex/**"
    carryforward: true

component_management:
  individual_components:
    - component_id: react-native-iap
      name: React Native IAP
      paths:
        - "libraries/react-native-iap/src/**"
      flag_regexes:
        - "^react-native-iap$"
    - component_id: expo-iap
      name: Expo IAP
      paths:
        - "libraries/expo-iap/src/**"
      flag_regexes:
        - "^expo-iap$"
    - component_id: flutter-inapp-purchase
      name: flutter_inapp_purchase
      paths:
        - "libraries/flutter_inapp_purchase/lib/**"
      flag_regexes:
        - "^flutter-inapp-purchase$"
    - component_id: iapkit-server
      name: IAPKit Server
      paths:
        - "packages/kit/server/**"
      flag_regexes:
        - "^iapkit$"
    - component_id: iapkit-convex
      name: IAPKit Convex
      paths:
        - "packages/kit/convex/**"
      flag_regexes:
        - "^iapkit$"

comment:
  layout: "reach,diff,flags,components,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "libraries/react-native-iap/src/types.ts"
  - "libraries/expo-iap/src/types.ts"
  - "libraries/flutter_inapp_purchase/lib/types.dart"
  - "packages/kit/convex/_generated/**"
  - "packages/kit/convex/**/*.test.ts"
  - "packages/kit/convex/test.setup.ts"
