# Root GraphQL types

"""
OpenIAP code-generation metadata for deprecating named schema types.
Standard GraphQL @deprecated remains reserved for fields, arguments, input
fields, and enum values.
"""
directive @openiapDeprecated(
  reason: String!
) on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT

type Query {
  _placeholder: Boolean
}

type Mutation {
  _placeholder: Boolean
}

type Subscription {
  _placeholder: Boolean
}
