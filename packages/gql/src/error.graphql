# Error handling definitions for OpenIAP

# Unified error codes surfaced by the OpenIAP APIs
enum ErrorCode {
  Unknown
  UserCancelled
  UserError
  ItemUnavailable
  RemoteError
  NetworkError
  ServiceError
  ReceiptFailed @deprecated(reason: "Use PurchaseVerificationFailed instead. Scheduled for removal in OpenIAP 3.0.")
  ReceiptFinished @deprecated(reason: "Use PurchaseVerificationFinished instead. Scheduled for removal in OpenIAP 3.0.")
  ReceiptFinishedFailed @deprecated(reason: "Use PurchaseVerificationFinishFailed instead. Scheduled for removal in OpenIAP 3.0.")
  PurchaseVerificationFailed
  PurchaseVerificationFinished
  PurchaseVerificationFinishFailed
  NotPrepared
  NotEnded
  AlreadyOwned
  DeveloperError
  BillingResponseJsonParseError
  DeferredPayment
  Interrupted
  IapNotAvailable
  PurchaseError
  SyncError
  TransactionValidationFailed
  ActivityUnavailable
  AlreadyPrepared
  Pending
  ConnectionClosed
  InitConnection
  ServiceDisconnected
  ServiceTimeout
  QueryProduct
  SkuNotFound
  SkuOfferMismatch
  ItemNotOwned
  BillingUnavailable
  FeatureNotSupported
  EmptySkuList
  DuplicatePurchase
}

# Purchase error payload delivered through listeners and API responses
type PurchaseError {
  code: ErrorCode!
  message: String!
  productId: String
  # Raw diagnostic text from the underlying billing layer, when available.
  # On Android this mirrors BillingResult.debugMessage; on iOS this is the
  # StoreKit error's localizedDescription (or equivalent). May be null.
  debugMessage: String
  # Android QueryProduct diagnostics. Present for openiap-google QueryProduct
  # failures when the native billing layer exposes the values.
  responseCode: Int
  # Available in OpenIAP Spec 2.3.0 / openiap-google 2.3.1 (requires Play
  # Billing 8.0+). Android-only
  # diagnostic returned by
  # PurchasesUpdatedListener.onPurchasesUpdated. Null when the callback does not
  # expose the value or on non-Android platforms.
  subResponseCodeAndroid: SubResponseCodeAndroid
  productIds: [String!]
  productType: String
  isEmptyProductList: Boolean
}
