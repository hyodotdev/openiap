# openiap.dev GraphQL API operations (common)

# Product management
extend type Query {
  """
  Fetch products or subscriptions from the store.
  See: https://openiap.dev/docs/apis/fetch-products
  """
  # Future
  fetchProducts(params: ProductRequest!): FetchProductsResult!
  """
  List active purchases for the current user.
  See: https://openiap.dev/docs/apis/get-available-purchases
  """
  # Future
  getAvailablePurchases(options: PurchaseOptions): [Purchase!]!
  """
  Get details of all currently active subscriptions (filters by subscriptionIds when provided).
  See: https://openiap.dev/docs/apis/get-active-subscriptions
  """
  # Future
  getActiveSubscriptions(subscriptionIds: [String!]): [ActiveSubscription!]!
  """
  Check whether the user has any active subscription.
  See: https://openiap.dev/docs/apis/has-active-subscriptions
  """
  # Future
  hasActiveSubscriptions(subscriptionIds: [String!]): Boolean!
  """
  Return the store-authoritative country code: ISO 3166-1 alpha-3 on Apple
  platforms and alpha-2 on Android. The operation fails when the store cannot
  provide a value; implementations must not synthesize a locale fallback.
  See: https://openiap.dev/docs/apis/get-storefront
  """
  # Future
  getStorefront: String!
}

# Request APIs (event driven)
extend type Mutation {
  """
  Initialize the store connection. Call before any IAP API.
  See: https://openiap.dev/docs/apis/init-connection
  """
  # Future
  initConnection(config: InitConnectionConfig): Boolean!
  """
  Close the store connection and release resources.
  See: https://openiap.dev/docs/apis/end-connection
  """
  # Future
  endConnection: Boolean!
  """
  Initiate a purchase or subscription flow; rely on events for final state.
  See: https://openiap.dev/docs/apis/request-purchase
  """
  # Future
  requestPurchase(params: RequestPurchaseProps!): RequestPurchaseResult
  """
  Complete a transaction after server-side verification. Required on Android within 3 days.
  See: https://openiap.dev/docs/apis/finish-transaction
  """
  # Future
  finishTransaction(
    purchase: PurchaseInput!
    isConsumable: Boolean
  ): VoidResult!
  """
  Restore non-consumable and active subscription purchases.
  See: https://openiap.dev/docs/apis/restore-purchases
  """
  # Future
  restorePurchases: VoidResult!
  """
  Open the platform's subscription management UI.
  See: https://openiap.dev/docs/apis/deep-link-to-subscriptions
  """
  # Future
  deepLinkToSubscriptions(options: DeepLinkOptions): VoidResult!
  """
  Open the platform's offer/promo code redemption flow so the user can enter a code.
  On Apple platforms this presents the App Store offer code redemption sheet and
  resolves the verified purchase when StoreKit reports it synchronously (Xcode 27+
  building for iOS 27+, Mac Catalyst 27+, or visionOS 27+); older sheet APIs
  resolve null after presentation. On Google Play builds this launches the Play
  Store redeem page (https://play.google.com/redeem) and resolves null; the
  billing client does not need to be initialized. Meta Horizon and Amazon
  Appstore have no equivalent redemption surface and resolve null without
  launching anything. Apple platforms without the redemption sheet (macOS,
  tvOS, watchOS) throw FeatureNotSupported. Redeemed purchases are delivered
  through the standard purchase listeners; always reconcile with
  getAvailablePurchases when the app resumes. Throws when a redemption flow
  exists but cannot be presented or launched.
  Available in OpenIAP Spec 3.3.0 / openiap-apple 3.3.0 / openiap-google 3.4.0.
  Replaces presentCodeRedemptionSheetIOS and openRedeemOfferCodeAndroid.
  See: https://openiap.dev/docs/apis/open-redeem-offer-code
  """
  # Future
  openRedeemOfferCode: Purchase
  """
  Verify a purchase against your own backend. Every VerifyPurchaseResult
  variant exposes isValid, so entitlement can be gated without inspecting the
  concrete type. Variants add their own metadata on top: IOS carries
  receipt/JWS fields, Android carries Play Store receipt fields, and Horizon
  carries grantTime.
  See: https://openiap.dev/docs/features/validation#verify-purchase
  """
  # Future
  verifyPurchase(options: VerifyPurchaseProps!): VerifyPurchaseResult!
  """
  Verify via a managed provider without standing up your own server. The
  PurchaseVerificationProvider enum currently exposes only IAPKit; platform
  availability may differ by implementation.
  See: https://openiap.dev/docs/features/validation#verify-purchase-with-provider
  """
  # Future
  verifyPurchaseWithProvider(
    options: VerifyPurchaseWithProviderProps!
  ): VerifyPurchaseWithProviderResult!
}
