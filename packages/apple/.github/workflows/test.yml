name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Verify generated types are present
      run: |
        test -s Sources/Models/Types.swift
        grep -Fq 'AUTO-GENERATED TYPES — DO NOT EDIT DIRECTLY' Sources/Models/Types.swift

    - name: Select Xcode
      run: |
        echo "Available Xcode versions:"
        ls -la /Applications | grep Xcode
        # Use the latest available Xcode
        sudo xcode-select -s /Applications/Xcode.app
      
    - name: Build
      run: swift build
      
    - name: Run tests
      run: swift test
