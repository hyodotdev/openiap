vulnerabilities:
  - id: CVE-2026-107494
    purls:
      - pkg:deb/debian/libssl3t64@3.5.9-1~deb13u1
    expired_at: 2026-12-08
    statement: >-
      A denial of service in OpenSSL's QUIC stack. Debian 13 has no fix (the
      3.5.9 in the base image is affected too). The Kit never reaches
      this library: the server binary is Bun, which links BoringSSL
      statically and needs only libc, so libssl3t64 is unused base-image
      content. Bun.serve listens for plain HTTP on 3000/tcp behind Fly's TLS
      proxy, and nothing starts a QUIC (UDP) endpoint. Recheck Debian's
      tracker and the distroless digest, or remove this exception, by the
      expiry date.
  - id: CVE-2026-124709
    purls:
      - pkg:deb/debian/libssl3t64@3.5.9-1~deb13u1
    expired_at: 2026-12-08
    statement: >-
      A memory leak in OpenSSL's QUIC server stream handling. Debian 13 has
      no fix (the 3.5.9 in the base image is affected too). The Kit
      never reaches this library: the server binary is Bun, which links
      BoringSSL statically and needs only libc, so libssl3t64 is unused
      base-image content. Bun.serve listens for plain HTTP on 3000/tcp behind
      Fly's TLS proxy, and nothing starts a QUIC (UDP) endpoint. Recheck
      Debian's tracker and the distroless digest, or remove this exception,
      by the expiry date.
