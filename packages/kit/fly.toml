app = 'openiap-kit'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  IAPKIT_BASE_URL = 'http://127.0.0.1:3000'
  IAPKIT_PUBLIC_BASE_URL = 'https://kit.openiap.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 80
    hard_limit = 120

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
