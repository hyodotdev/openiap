// Applied by the io.github.hyochan.openiap plugin after openiap-store.gradle, once
// the module applies an Android plugin. Links the store the resolver picks into a
// module that consumes openiap-google or kmp-iap as a published artifact.

def openIapGroup = 'io.github.hyochan.openiap'
// openiap-google publishes each store as its own artifact.
def openIapArtifactStores = [
  'openiap-google': 'play',
  'openiap-google-horizon': 'horizon',
  'openiap-google-amazon': 'amazon',
]

// Links the store's build of openiap-google in the given configurations, or in
// every one of this module's when none are given.
def openIapUseStore = { String store, Collection targets = null ->
  def swap = { configuration ->
    configuration.resolutionStrategy.eachDependency { details ->
      def named = details.requested.group == openIapGroup ? openIapArtifactStores[details.requested.name] : null
      if (named == null || named == store) {
        return
      }
      // As in the resolver, two signals that name different stores stop the build.
      if (named != 'play') {
        throw new GradleException(
          "openiap: ${details.requested.name} is declared but this build's store is ${store}; depend on openiap-google, or set openiapStore=${named}"
        )
      }
      // useTarget needs a version, and a BOM's would not carry over to the store's coordinates.
      def version = details.requested.version
      if (!version) {
        throw new GradleException(
          "openiap: openiap-google is declared without a version but this build's store is ${store}; declare a version so the plugin can link openiap-google-${store}"
        )
      }
      details.useTarget(group: openIapGroup, name: "openiap-google-${store}", version: version)
      details.because("openiap: store=${store}")
    }
  }
  if (targets == null) {
    configurations.configureEach(swap)
  } else {
    targets.each(swap)
  }
}

// The DSL has no getter for a dimension strategy; AGP's flavor class keeps them.
// A product flavor's request opens with its own name and lists the values after
// it, and AGP takes the first one the dependency has, so that is the store.
def openIapRequestedPlatform = { flavor ->
  if (!flavor.hasProperty('missingDimensionStrategies')) {
    return null
  }
  def request = flavor.missingDimensionStrategies['platform']
  if (request == null) {
    return null
  }
  return ([request.requested] + request.fallbacks).find { it in openIapArtifactStores.values() }
}

['com.android.application', 'com.android.library', 'com.android.dynamic-feature', 'com.android.test'].each { id ->
  pluginManager.withPlugin(id) {
    // A module's own platform flavor names each variant's store, so one plain
    // openiap-google dependency links that store's build in each variant.
    androidComponents.onVariants(androidComponents.selector().all()) { variant ->
      def flavor = variant.productFlavors.find { it.first == 'platform' }?.second
      if (flavor in openIapArtifactStores.values()) {
        openIapUseStore(flavor, [variant.runtimeConfiguration, variant.compileConfiguration])
      }
    }
    androidComponents.finalizeDsl { android ->
      // Its own platform flavors choose the store per variant.
      if (android.flavorDimensions.contains('platform')) {
        if (project.findProperty('openiapStore')) {
          logger.lifecycle("openiap: ${project.path} declares platform flavors, so openiapStore does not apply to it")
        }
        return
      }
      def store = openIapResolveStore('openiap').store
      // A platform the module or one of its flavors already requests is a second
      // signal, and as in the resolver one that disagrees stops the build.
      ([android.defaultConfig] + android.productFlavors.toList()).each { flavor ->
        def requested = openIapRequestedPlatform(flavor)
        if (requested != null && requested != store) {
          def owner = flavor.is(android.defaultConfig) ? project.path : "${project.path} flavor ${flavor.name}"
          throw new GradleException(
            "openiap: ${owner} sets missingDimensionStrategy platform=${requested} but this build's store is ${store}; remove the strategy and let the plugin set it, or set openiapStore=${requested}"
          )
        }
      }
      // kmp-iap publishes one Android variant per store in this dimension.
      android.defaultConfig.missingDimensionStrategy('platform', store)
      openIapUseStore(store)
    }
  }
}

pluginManager.withPlugin('com.android.kotlin.multiplatform.library') {
  def store = openIapResolveStore('openiap').store
  kotlin.targets.configureEach { target ->
    // AGP 9 removed dependencyVariantSelection; localDependencySelection replaces it.
    if (target.hasProperty('localDependencySelection')) {
      target.localDependencySelection.productFlavorDimension('platform') { spec -> spec.selectFrom.set([store]) }
    } else if (target.hasProperty('dependencyVariantSelection')) {
      target.dependencyVariantSelection.productFlavors.put('platform', [store])
    } else if (target.platformType.name() == 'androidJvm') {
      logger.warn("openiap: ${project.path} cannot select kmp-iap's ${store} variant on this Android Gradle Plugin; select the platform flavor yourself")
    }
  }
  openIapUseStore(store)
}
