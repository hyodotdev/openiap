// Applied by the io.github.hyochan.openiap plugin after openiap-store.gradle. Links
// the store the resolver picks into a module that uses the published openiap-google
// or kmp-iap.

def openIapGroup = 'io.github.hyochan.openiap'
// openiap-google publishes each store as its own artifact.
def openIapArtifactStores = [
  'openiap-google': 'play',
  'openiap-google-horizon': 'horizon',
  'openiap-google-amazon': 'amazon',
]

// Swaps openiap-google for the store's artifact, in the given configurations or all.
def openIapUseStore = { String store, Collection targets = null ->
  def swap = { configuration ->
    configuration.resolutionStrategy.eachDependency { details ->
      def named = details.requested.group == openIapGroup ? openIapArtifactStores[details.requested.name] : null
      if (named == null || named == store) {
        return
      }
      // A store artifact that names another store fails, as in the resolver.
      if (named != 'play') {
        throw new GradleException(
          "openiap: ${details.requested.name} is declared but this build's store is ${store}; depend on openiap-google, or set openiapStore=${named}"
        )
      }
      // useTarget needs a version; a BOM's does not carry over to the store's artifact.
      def version = details.requested.version
      if (!version) {
        throw new GradleException(
          "openiap: openiap-google is declared without a version but this build's store is ${store}; declare a version so the plugin can link openiap-google-${store}"
        )
      }
      def artifact = store in openIapArtifactStores.values() ? "openiap-google-${store}" : 'openiap-core'
      details.useTarget(group: openIapGroup, name: artifact, version: version)
      details.because("openiap: store=${store}")
    }
  }
  if (targets == null) {
    configurations.configureEach(swap)
  } else {
    targets.each(swap)
  }
}

// The store a flavor's `missingDimensionStrategy 'platform', ...` asks for. The DSL
// has no getter, so read AGP's flavor class; the first store listed wins.
def openIapRequestedPlatform = { flavor ->
  if (!flavor.hasProperty('missingDimensionStrategies')) {
    if (!binding.hasVariable('openIapStrategyCheckSkipped')) {
      binding.setVariable('openIapStrategyCheckSkipped', true)
      logger.warn("openiap-store: this AGP hides missingDimensionStrategies, so the strategy-agreement check is skipped")
    }
    return null
  }
  def request = flavor.missingDimensionStrategies['platform']
  if (request == null) {
    return null
  }
  return ([request.requested] + request.fallbacks).find { it in openIapArtifactStores.values() || it == 'provider' }
}

['com.android.application', 'com.android.library', 'com.android.dynamic-feature', 'com.android.test'].each { id ->
  pluginManager.withPlugin(id) {
    // With its own platform flavors, each variant and its test components link
    // the flavor's store; tests resolve classpaths of their own.
    androidComponents.onVariants(androidComponents.selector().all()) { variant ->
      def flavor = variant.productFlavors.find { it.first == 'platform' }?.second
      if (flavor in openIapArtifactStores.values()) {
        def components = [variant] + variant.nestedComponents
        openIapUseStore(flavor, components.collectMany { [it.runtimeConfiguration, it.compileConfiguration] })
      } else if (flavor == 'provider') {
        def components = [variant] + variant.nestedComponents
        def targets = components.collectMany { [it.runtimeConfiguration, it.compileConfiguration] }
        targets.each { configuration ->
          configuration.incoming.beforeResolve {
            if (!openIapResolveStore('openiap').provider) {
              throw new GradleException('openiap: the provider platform flavor requires openiapStore and openiapProvider')
            }
          }
        }
        openIapUseStore('provider', targets)
      }
    }
    androidComponents.finalizeDsl { android ->
      if (android.flavorDimensions.contains('platform')) {
        if (android.productFlavors.findByName('provider') != null && project.findProperty('openiapProvider')) {
          def resolution = openIapResolveStore('openiap')
          dependencies.add('providerImplementation', resolution.provider)
        }
        if (project.findProperty('openiapStore')) {
          logger.lifecycle("openiap: ${project.path} declares platform flavors, so openiapStore does not apply to it")
        }
        return
      }
      def resolution = openIapResolveStore('openiap')
      def store = resolution.store
      // A platform the module or a flavor already asks for must match the store.
      ([android.defaultConfig] + android.productFlavors.toList()).each { flavor ->
        def requested = openIapRequestedPlatform(flavor)
        if (requested != null && requested != resolution.platform) {
          def owner = flavor.is(android.defaultConfig) ? project.path : "${project.path} flavor ${flavor.name}"
          throw new GradleException(
            "openiap: ${owner} sets missingDimensionStrategy platform=${requested} but this build's store is ${store}; remove the strategy and let the plugin set it, or set openiapStore=${requested}"
          )
        }
      }
      // kmp-iap publishes one Android variant per store in this dimension.
      android.defaultConfig.missingDimensionStrategy('platform', resolution.platform)
      if (resolution.provider) dependencies.add('implementation', resolution.provider)
      openIapUseStore(store)
    }
  }
}

pluginManager.withPlugin('com.android.kotlin.multiplatform.library') {
  def resolution = openIapResolveStore('openiap')
  def store = resolution.store
  kotlin.targets.configureEach { target ->
    // AGP 9 removed dependencyVariantSelection; localDependencySelection replaces it.
    if (target.hasProperty('localDependencySelection')) {
      target.localDependencySelection.productFlavorDimension('platform') { spec -> spec.selectFrom.set([resolution.platform]) }
    } else if (target.hasProperty('dependencyVariantSelection')) {
      target.dependencyVariantSelection.productFlavors.put('platform', [resolution.platform])
    } else if (target.platformType.name() == 'androidJvm') {
      logger.warn("openiap: ${project.path} cannot select kmp-iap's ${store} variant on this Android Gradle Plugin; select the platform flavor yourself")
    }
  }
  if (resolution.provider) dependencies.add('androidMainImplementation', resolution.provider)
  openIapUseStore(store)
}
