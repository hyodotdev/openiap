// AGP 9 replaced the Kotlin Multiplatform library plugin's dependency
// selection API, so the store plugin's KMP cases run here on AGP 9 as well,
// against the same modules as ../store-plugin.
pluginManagement {
  includeBuild('../../gradle-plugin')
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}

plugins {
  id 'io.github.hyochan.openiap'
}

dependencyResolutionManagement {
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.name = 'store-plugin-agp9-fixture'
include ':shared', ':consumer'
project(':shared').projectDir = new File(settingsDir, '../store-plugin/shared')
project(':consumer').projectDir = new File(settingsDir, '../store-plugin/consumer')
