// Driven by scripts/verify-release-consumer.sh, which publishes the artifacts first.
pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    maven {
      url = uri(providers.gradleProperty('openIapRepository').get())
    }
    mavenCentral()
  }
}

rootProject.name = 'openiap-google-release-consumer'
