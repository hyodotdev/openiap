// Leaves the openiap-google version to another edge, as a BOM would.
plugins {
  id 'com.android.application'
}

android {
  namespace 'dev.hyo.openiap.fixture.unversioned'
  compileSdk 36
  defaultConfig {
    minSdk 24
  }
}

dependencies {
  implementation 'io.github.hyochan.openiap:openiap-google'
  // The published kmp-iap has no provider variant, so a provider build skips it.
  if (!project.findProperty('fixtureCommunityRepository') || project.findProperty('fixtureKmpVersion')) {
    implementation "io.github.hyochan:kmp-iap:${project.findProperty('fixtureKmpVersion') ?: '3.6.1'}"
  }
}

apply from: rootProject.file('print-stores.gradle')
openIapFixturePrint('printDebugStores', 'debugRuntimeClasspath')
