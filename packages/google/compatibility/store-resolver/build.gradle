// Applies the resolver exactly as a wrapper does and prints its answer in one
// machine-readable line. verify-store-resolver.sh asserts against that line.
apply from: new File(rootDir, '../../gradle/openiap-store.gradle')

def allowNone = (project.findProperty('fixtureAllowNone') ?: 'false').toBoolean()
def resolution = openIapResolveStore('fixture', [allowNone: allowNone])
// println, not logger: --quiet keeps the run readable but drops lifecycle logs.
println("FIXTURE store=${resolution.store} source=${resolution.source}")

