tasks.register('assembleDebug') { doLast { } }
tasks.register('assembleRelease') { doLast { } }
tasks.register('assembleHorizonRelease') { doLast { } }
tasks.register('assembleAmazonDebug') { doLast { } }
tasks.register('installPlayDebug') { doLast { } }
